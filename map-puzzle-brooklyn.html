  { name: "Park Slope Food Coop", lat: 40.6748, lng: -73.9769, icon: "poi-foodcoop.png", w: 64 }
];
POIS.forEach(function(p){
  var di = L.divIcon({
    className: 'poi-chip',
    html: '<img src="' + p.icon + '" alt="' + p.name + '" style="width:' + p.w + 'px;display:block;">',
    iconSize: [p.w, 1], iconAnchor: [p.w/2, 0]
  });
  L.marker([p.lat, p.lng], { icon: di, interactive: false, keyboard: false }).addTo(map);
});

var order = [], idx = -1, score = 0, streak = 0, bestStreak = 0, answered = false, current = null;
var NAMES = {};
GEO.features.forEach(function(f){ NAMES[f.properties.cd] = f.properties.name; });

function shuffle(a){ for (var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

function resetStyles(){
  for (var cd in layersByCD){
    layersByCD[cd].setStyle({ color:'#ffffff', weight:1.5, fillColor:'#1f6fb0', fillOpacity:0.55 });
  }
}

function startGame(){
  order = shuffle(GEO.features.map(function(f){ return f.properties.cd; }));
  idx = -1; score = 0; streak = 0; bestStreak = 0;
  document.getElementById('results').classList.remove('show');
  document.getElementById('startBtn').style.display = 'none';
  document.getElementById('skipBtn').style.display = 'inline-block';
  document.getElementById('scoreDisplay').textContent = 'Score: 0';
  nextRound();
}

function nextRound(){
  resetStyles();
  answered = false;
  idx++;
  if (idx >= order.length){ return endGame(); }
  current = order[idx];
  document.getElementById('targetCD').textContent = 'Community District ' + current;
  document.getElementById('targetHood').textContent = NAMES[current];
  document.getElementById('feedback').textContent = '';
  document.getElementById('feedback').className = 'feedback';
  document.getElementById('progress').textContent = 'Round ' + (idx+1) + ' of ' + order.length;
  document.getElementById('streak').textContent = 'Best streak: ' + bestStreak;
}

function onPick(cd, layer){
  if (answered || idx < 0 || idx >= order.length) return;
  answered = true;
  var fb = document.getElementById('feedback');
  if (cd === current){
    score++; streak++; if (streak > bestStreak) bestStreak = streak;
    layer.setStyle({ color:'#fff', weight:2, fillColor:'#2ecc71', fillOpacity:0.8 });
    fb.textContent = 'Correct!'; fb.className = 'feedback right';
  } else {
    streak = 0;
    layer.setStyle({ color:'#fff', weight:2, fillColor:'#e74c3c', fillOpacity:0.8 });
    if (layersByCD[current]) layersByCD[current].setStyle({ color:'#fff', weight:2.5, fillColor:'#2ecc71', fillOpacity:0.8 });
    fb.textContent = 'That was CD ' + cd + '. The right one is highlighted.'; fb.className = 'feedback wrong';
  }
  document.getElementById('scoreDisplay').textContent = 'Score: ' + score;
  document.getElementById('streak').textContent = 'Best streak: ' + bestStreak;
  setTimeout(nextRound, 1100);
}

function endGame(){
  document.getElementById('skipBtn').style.display = 'none';
  document.getElementById('targetCD').textContent = 'Done!';
  document.getElementById('targetHood').textContent = '';
  var pct = Math.round(100 * score / order.length);
  var msg = pct === 100 ? 'A perfect map of Brooklyn. You know this borough cold.'
          : pct >= 80 ? 'Excellent. You really know your community districts.'
          : pct >= 60 ? 'Solid. A few more rounds and you will have it down.'
          : pct >= 40 ? 'Not bad. Brooklyn has a lot of districts to keep straight.'
          : 'Brooklyn is big. Give it another go and watch them stick.';
  document.getElementById('finalScore').textContent = score + ' / ' + order.length;
  document.getElementById('finalMsg').textContent = msg;
  document.getElementById('results').classList.add('show');
}

function skip(){
  if (idx < 0) return;
  if (!answered){ streak = 0; }
  resetStyles();
  if (layersByCD[current]) layersByCD[current].setStyle({ color:'#fff', weight:2.5, fillColor:'#d4bc2d', fillOpacity:0.75 });
  var fb = document.getElementById('feedback');
  fb.textContent = 'Skipped. CD ' + current + ' is highlighted.'; fb.className = 'feedback';
  answered = true;
  setTimeout(nextRound, 900);
}

document.getElementById('startBtn').addEventListener('click', startGame);
document.getElementById('againBtn').addEventListener('click', startGame);
document.getElementById('skipBtn').addEventListener('click', skip);
</script>
</body>
