<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Election History by Community Board &middot; bkcb6.app</title>
<meta name="description" content="Every New York City primary, general and special election since 2014, plus the 2012 general, for every community board, by election district.">
<link rel="canonical" href="https://bkcb6.app/electionhistory/">
<meta property="og:site_name" content="CB6 &amp; Beyond"><meta property="og:type" content="website">
<meta property="og:title" content="Election History by Community Board">
<meta property="og:description" content="Every primary, general and special election since 2014, plus the 2012 general, for every community board, by election district.">
<meta property="og:url" content="https://bkcb6.app/electionhistory/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
<style>
:root{--navy:#0d1b4b;--orange:#f47920;--white:#fff;--off:#f8f7f4;--border:#e5e2db;--muted:#6b6760}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--navy)}
header{background:var(--navy);border-bottom:4px solid var(--orange)}
.hdr{display:flex;align-items:center;max-width:1400px;margin:0 auto}
.hdr-text{padding:16px 20px;border-left:1px solid rgba(255,255,255,.1)}
.hdr-text h1{font-size:1.3rem;font-weight:700;color:#fff;line-height:1.2}
.hdr-text h1 span{color:var(--orange)}
.hdr-text p{font-size:.75rem;color:rgba(255,255,255,.55);font-family:'DM Mono',monospace;margin-top:4px;letter-spacing:.04em;text-transform:uppercase}
.section{max-width:1400px;margin:0 auto}
.homebar{background:var(--navy);padding:8px 16px}
.homebar a{color:rgba(255,255,255,.75);font-size:.8rem;font-weight:600;text-decoration:none}
.intro{padding:16px 20px 14px;background:#fff;border-bottom:1px solid var(--border)}
.intro h3{font-size:1rem;font-weight:700;color:var(--navy);margin-bottom:8px}
.intro p{font-size:.82rem;color:var(--muted);line-height:1.6}
.pickers{display:flex;gap:10px;flex-wrap:wrap;padding:12px 20px;background:#fff;border-bottom:2px solid var(--orange)}
.pickers label{display:flex;flex-direction:column;gap:3px;font-size:.62rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--orange);font-weight:700}
select,input[type="text"]{font-family:'DM Sans',sans-serif;font-size:.85rem;padding:7px 10px;border:1.5px solid var(--border);border-radius:5px;background:var(--off);color:var(--navy);min-width:140px}
select:focus,input:focus{outline:none;border-color:var(--orange)}
.pickers select{min-width:240px;font-weight:600}
.q-tabs{display:flex;background:#fff;border-bottom:2px solid var(--border);padding:0 24px;gap:4px;overflow-x:auto;flex-wrap:wrap;align-items:center}
.q-tab{padding:12px 18px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:all .15s;user-select:none}
.q-tab:hover{color:var(--navy)}
.q-tab.active{color:var(--orange);border-bottom-color:var(--orange)}
.more{padding:10px 14px;font-size:.78rem;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;user-select:none}
#moreTabs{display:none;flex-wrap:wrap;width:100%}
.count-pill{font-family:'DM Mono',monospace;font-size:.72rem;padding:5px 12px;border-radius:20px;background:var(--off);border:1px solid var(--border);color:var(--muted)}
.eyelbl{font-size:.65rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:12px}
/* winner margin card (same look as elections.html) */
.wm-card{background:#fff;border:1px solid var(--border);border-radius:12px;padding:18px 18px 14px;margin:0 0 18px;box-shadow:0 2px 10px rgba(13,27,75,.06)}
.wm-card>p{margin:0 0 14px;color:#4b5563;font-size:.84rem;line-height:1.65}
.wm-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:16px;align-items:stretch}
.wm-map{height:520px;border-radius:10px;overflow:hidden;background:#edf2f7;border:1px solid var(--border)}
.wm-detail{border:1px solid var(--border);border-radius:10px;background:#f8f7f4;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:220px}
.wm-detail .eyebrow{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;font-weight:700}
.wm-detail h4{margin:0;color:var(--navy);font-size:1.18rem;line-height:1.2}
.wm-detail .lead{margin:0;color:#111827;font-size:.92rem;line-height:1.6}
.wm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.wm-stat{background:#fff;border:1px solid var(--border);border-radius:8px;padding:10px 12px}
.wm-stat-l{display:block;font-size:.68rem;letter-spacing:.04em;text-transform:uppercase;color:#6b7280;margin-bottom:4px}
.wm-stat-v{display:block;color:#111827;font-size:.92rem;font-weight:700;line-height:1.4}
.wm-chip{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:#374151}
.wm-dot{width:10px;height:10px;border-radius:999px;display:inline-block;flex:none}
.wm-note{font-size:.72rem;color:#6b7280;line-height:1.55}
.wm-legend{display:flex;flex-direction:column;gap:10px;margin-top:12px;font-size:.72rem;color:#4b5563}
.wm-legend-t{font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:#6b7280;font-weight:700}
.wm-legend-s{font-size:.68rem;line-height:1.5;color:#6b7280;margin-top:-4px}
.wm-legend-row{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px;align-items:center;margin-bottom:8px}
.wm-legend-l{font-size:.72rem;font-weight:700;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wm-legend-bar{position:relative;height:12px;border-radius:999px;border:1px solid rgba(17,24,39,.08)}
.wm-tick{position:absolute;top:14px;transform:translateX(-50%);font-size:.63rem;color:#6b7280;white-space:nowrap}
.wm-map .leaflet-tooltip{background:rgba(17,24,39,.94);border:0;border-radius:8px;color:#fff;box-shadow:0 8px 28px rgba(0,0,0,.22);padding:8px 10px}
/* scoreboard */
.sb-chart{display:flex;flex-direction:column;gap:6px;max-width:640px}
.sb-chart-row{display:flex;align-items:center;gap:10px}
.sb-chart-total .sb-chart-label{font-weight:700;color:var(--navy)}
.sb-chart-total .sb-chart-bar-wrap{border-top:1.5px solid var(--navy)}
.sb-chart-label{font-size:.8rem;color:var(--navy);width:108px;flex-shrink:0}
.sb-chart-bars{flex:1;display:flex;flex-direction:column;gap:3px}
.sb-chart-bar-wrap{display:flex;height:22px;border-radius:3px;overflow:hidden;background:#e5e2db}
.sb-chart-seg{display:flex;align-items:center;padding:0 5px;overflow:hidden;min-width:0}
.sb-chart-num{font-size:.7rem;font-weight:700;color:#fff;font-family:'DM Mono',monospace;white-space:nowrap}
.sb-chart-legend-inline{font-size:.72rem;color:var(--muted);white-space:nowrap;font-family:'DM Mono',monospace;font-weight:700}
.sb-chart-key{margin-top:10px;font-size:.7rem;font-family:'DM Mono',monospace;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap}
.sb-key-dot{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.note-warn{font-size:.78rem;color:#8e2b20;line-height:1.55;margin-bottom:10px}
.ed-row{border-bottom:1px solid var(--border)}
.ed-row td{padding:8px 14px}
.ed-row.hl td{background:#fff4ea!important}
th{padding:8px 14px;font-family:'DM Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.6);font-weight:500;text-align:left}
th.r{text-align:right}
/* district history */
.dh-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.dh-sum .wm-stat-v{font-size:.86rem}
.dh-ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.dh-offs{display:flex;gap:6px;flex-wrap:wrap}
.dh-off{padding:7px 12px;border:1.5px solid var(--border);border-radius:20px;background:#fff;font:inherit;font-size:.8rem;font-weight:600;color:var(--navy);cursor:pointer}
.dh-off.on{background:var(--navy);border-color:var(--navy);color:#fff}
.dh-tbl{width:100%;border-collapse:collapse;font-size:.8rem;margin-top:6px}
.dh-tbl th{background:var(--navy)}
.dh-tbl td{padding:9px 12px;border-bottom:1px solid var(--border);vertical-align:top}
.dh-tbl tr.cur td{background:#fff7f0}
.dh-tbl tr{cursor:pointer}
.dh-chip{display:inline-flex;flex-direction:column;gap:3px;margin:0 8px 8px 0;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:#fff;min-width:150px;vertical-align:top}
.dh-chip b{font-size:.8rem;color:var(--navy)}
.dh-chip span{font-size:.72rem;color:#374151;line-height:1.35}
.dh-bar{height:6px;border-radius:3px;background:#e8e8e4;overflow:hidden}
.dh-bar i{display:block;height:100%}
.dh-n{font-family:'DM Mono',monospace;font-size:.8rem;font-weight:700;color:var(--orange);white-space:nowrap}
.dh-h{font-size:.65rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 4px}
.dh-lbl{background:none;border:0;box-shadow:none;font-family:'DM Mono',monospace;font-weight:700;font-size:.72rem;color:var(--navy);text-shadow:0 0 3px #fff,0 0 3px #fff}
@media(max-width:760px){.dh-sum{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:960px){.wm-layout{grid-template-columns:1fr}.wm-map{height:420px}.wm-detail{min-height:0}}
@media(max-width:600px){.q-tabs{padding:0 10px}.q-tab{padding:10px 10px}.pickers select{min-width:0;width:100%}.pickers label{width:100%}.sec{padding-left:14px!important;padding-right:14px!important}}
</style>
</head>
<body><a id="asb" href="https://apps.apple.com/us/app/bkcb6/id6813967208" target="_blank" rel="noopener" style="display:block;background:#0d1b4b;text-align:center;padding:8px 0;line-height:0;text-decoration:none"><img src="/appstore-badge.png" alt="Download BKCB6 on the App Store" width="121" height="40" style="height:40px;width:auto;border:0;display:inline-block"></a>
<header>
  <div class="hdr"><div class="hdr-text">
    <h1 id="hTitle">Brooklyn <span>Community Board 6</span></h1>
    <p>Election history</p>
  </div></div>
</header>
<div class="section">
  <div class="homebar"><a href="/elections/">&#8592; Elections</a></div>

  <div class="intro">
    <h3>Elections</h3>
    <p id="introText">Loading&hellip;</p>
    <p style="margin-top:8px"><a href="#dhSec" id="dhJump" style="font-size:.82rem;font-weight:700;color:var(--orange);text-decoration:none">How this board&rsquo;s Council, Assembly, State Senate and Congressional districts changed since 2006 &darr;</a></p>
  </div>

  <div class="pickers">
    <label>Community board<select id="selCB"></select></label>
    <label>Election<select id="selE"></select></label>
  </div>

  <div class="q-tabs" id="qTabs"></div>

  <div style="padding:18px 24px 0;background:#fff" class="sec">
    <h3 id="raceTitle" style="font-size:1.1rem;font-weight:700;color:var(--navy)"></h3>
    <p id="raceSubtitle" style="font-size:.78rem;color:var(--muted);margin-top:2px"></p>
  </div>

  <div style="padding:12px 24px 18px;background:#fff;border-bottom:1px solid var(--border)" class="sec">
    <div class="wm-card">
      <p id="wmIntro"></p>
      <div class="wm-layout">
        <div><div class="wm-map" id="wmMap"></div><div class="wm-legend" id="wmLegend"></div></div>
        <div class="wm-detail" id="wmDetail"></div>
      </div>
    </div>
  </div>

  <div id="cb-scoreboard" class="sec" style="padding:16px 24px;background:#fff;border-bottom:1px solid var(--border)"></div>

  <div class="sec" style="padding:20px 24px;background:#fff;border-bottom:1px solid var(--border)">
    <div class="eyelbl" id="barsLbl">Results</div>
    <div id="candBars"></div>
  </div>

  <div class="sec" style="padding:20px 24px;background:#f8f8f6;border-bottom:1px solid var(--border)">
    <div class="eyelbl" style="margin-bottom:6px">See how your election district voted</div>
    <div style="display:flex;gap:8px;margin-bottom:10px">
      <input type="text" id="addrInput" placeholder="Enter your address (e.g. 250 Baltic Street)" style="flex:1;padding:9px 12px;font-size:.85rem;border:1.5px solid var(--border);border-radius:8px;background:#fff">
      <button id="addrBtn" style="padding:9px 14px;background:var(--navy);color:#fff;border:none;border-radius:8px;font-size:.82rem;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap">Find ED</button>
    </div>
    <div id="edAddrResult" style="font-size:.78rem;color:var(--navy);margin-bottom:8px;min-height:18px"></div>
    <div id="edMapWrap" style="display:none;margin-bottom:12px"><div id="edMap" style="height:260px;border-radius:8px;overflow:hidden;border:1px solid var(--border)"></div></div>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
      <input type="text" id="searchED" placeholder="Or search by ED e.g. 052/044" style="max-width:200px">
      <select id="filterAD"><option value="">All Assembly Districts</option></select>
      <select id="filterResult"><option value="">All EDs</option></select>
      <span class="count-pill" id="countPill"></span>
    </div>
  </div>

  <div style="overflow-x:auto;padding:0 0 40px">
    <table style="width:100%;border-collapse:collapse;font-size:.78rem;background:#fff">
      <thead><tr style="background:var(--navy)">
        <th>ED/AD</th><th class="r" id="th1">Cand 1</th><th class="r" id="th2">Cand 2</th><th>Ballots</th><th style="min-width:180px">Result</th>
      </tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
    <div id="noResults" style="display:none;padding:40px;text-align:center;color:var(--muted);font-size:.85rem">No matching election districts.</div>
  </div>

  <div class="sec" id="dhSec" style="padding:20px 24px 24px;background:#fff;border-top:2px solid var(--orange);border-bottom:1px solid var(--border)">
    <h3 id="dhTitle" style="font-size:1.1rem;font-weight:700;color:var(--navy)"></h3>
    <p id="dhSub" style="font-size:.78rem;color:var(--muted);margin-top:2px;line-height:1.55;max-width:80ch"></p>
    <div id="dhSummary" class="dh-sum"></div>
    <div class="wm-card" style="margin-top:14px">
      <div class="dh-ctrl"><div class="dh-offs" id="dhOffs"></div><select id="dhTerm"></select></div>
      <div class="wm-layout">
        <div><div class="wm-map" id="dhMap" style="height:460px"></div></div>
        <div class="wm-detail" id="dhDetail"></div>
      </div>
    </div>
    <div id="dhTables"></div>
  </div>

  <div class="sec" style="padding:18px 24px 40px;background:#fff">
    <div class="eyelbl">What&rsquo;s here</div>
    <p id="coverage" style="font-size:.8rem;color:var(--muted);line-height:1.6;max-width:80ch"></p>
  </div>
</div>

<script>
(function(){
var NAVY='#0d1b4b',ORANGE='#f47920',NAVY_LIGHT='#5b85d4',ORANGE_LIGHT='#f4a86a';
var OTHER=['#2d6a4f','#8e2b20','#7b6cd0','#b8860b','#2e7d8f','#c2508f','#6d8b2f','#a0522d','#4b6cb7'];
var NONCAND={'Write-in':1,'Undervote':1,'Overvote':1};
var BORO={'1':'MN','2':'BX','3':'BK','4':'QN','5':'SI'};
var BORON={'1':'Manhattan','2':'Bronx','3':'Brooklyn','4':'Queens','5':'Staten Island'};
var BORO_ORDER=['1','2','3','4','5'];
var DKBORO={'10':'Manhattan','11':'Bronx','12':'Brooklyn','13':'Queens','14':'Staten Island'};
var BASE='/data/edhistory/';
var S={cat:null,idx:null,c:null,cb:'306',geo:{},ed2cd:{},cdGeo:null,map:null,cdLayer:null,edMap:null,rows:[],filtered:[]};
var params=new URLSearchParams(location.search);
if(params.get('cb'))S.cb=params.get('cb');

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(m){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function fmt(n){return (n||0).toLocaleString('en-US');}
function p1(x){return (x*100).toFixed(1).replace(/\.0$/,'')+'%';}
function j(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+' '+r.status);return r.json();});}
function cbCode(c){c=String(c);return BORO[c[0]]+'CB'+(+c.slice(1));}
function cbLong(c){c=String(c);return BORON[c[0]]+' Community Board '+(+c.slice(1));}
function isCB(c){return +String(c).slice(1)<=18;}
function niceDate(d){var p=d.split('-');var M=['January','February','March','April','May','June','July','August','September','October','November','December'];return M[+p[1]-1]+' '+(+p[2])+', '+p[0];}
function monthYear(d){var p=d.split('-');var M=['January','February','March','April','May','June','July','August','September','October','November','December'];return M[+p[1]-1]+' '+p[0];}
function lastName(n){n=n.split(' / ')[0].replace(/,? (Jr\.|Sr\.|III|II|IV)$/,'');var a=n.trim().split(/\s+/);return a[a.length-1];}
var PABBR={'Democratic':'DEM','Republican':'REP','Conservative':'CON','Working Families':'WFP','Green':'GRN','Independence':'IND','Libertarian':'LBT','Reform':'REF','Women\'s Equality':'WEP'};

function boroOf(c){ // for countywide offices the BOE uses 10 to 14
  var d=String(c.district||'');if(DKBORO[d]&&/Borough President|President of the Borough|District Attorney|Surrogate|Civil Court|Supreme Court/i.test(c.office))return DKBORO[d];return '';}
function shortLabel(c){
  var o=c.office,d=String(c.district||''),m;
  var t=o;
  if(/^President/.test(o)&&!/Borough/.test(o))t='President';
  else if(/United States Senator/i.test(o))t='U.S. Senate';
  else if(/^Governor/i.test(o))t='Governor';
  else if(/Representative in Congress/i.test(o))t='Congress NY-'+d;
  else if(/^State Senator/i.test(o))t='State Senate '+d;
  else if(/^Member of the Assembly/i.test(o))t='Assembly '+d;
  else if(/Member of the City Council/i.test(o))t='Council '+(d.match(/\d+/)||[d])[0];
  else if(/Borough President|President of the Borough/i.test(o))t=(boroOf(c)||'')+' Borough President';
  else if(/District Attorney/i.test(o))t=(boroOf(c)||'')+' District Attorney';
  else if(/^(City )?Comptroller$/i.test(o))t='Comptroller';
  else if(/State Comptroller/i.test(o))t='State Comptroller';
  else if(/Attorney General/i.test(o))t='Attorney General';
  else if((m=o.match(/(Proposal|Question)\s*(Number\s*)?(\d+)/i)))t='Question '+m[3];
  else { t=c.title; if(t.length>44)t=t.slice(0,42)+'…'; }
  if(c.party)t+=' ('+(PABBR[c.party]||c.party)+')';
  return t.trim();
}
function fullTitle(c){
  var t=c.title;var b=boroOf(c);
  if(b)t=c.office.replace(/,.*$/,'')+', '+b;
  return t;
}

// map
S.map=L.map('wmMap',{zoomSnap:.25,scrollWheelZoom:false}).setView([40.7,-73.94],10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_2hyw_1_9cda1572a3817275ed412c0e',{maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(S.map);

Promise.all([j(BASE+'catalog.json'),j('/data/cd-boundaries-lite.geojson')]).then(function(r){
  S.cat=r[0];S.cdGeo=r[1];
  var sc=document.getElementById('selCB');
  BORO_ORDER.forEach(function(b){
    var g=document.createElement('optgroup');g.label=BORON[b];
    S.cdGeo.features.map(function(f){return f.properties.c;}).filter(function(c){return c[0]===b&&isCB(c);}).sort(function(a,b){return +a-+b;}).forEach(function(c){var o=document.createElement('option');o.value=c;o.textContent=cbLong(c);g.appendChild(o);});
    sc.appendChild(g);
  });
  sc.value=S.cb;
  sc.onchange=function(){setCB(sc.value);};
  var se=document.getElementById('selE');
  var byYear={};S.cat.elections.forEach(function(e){(byYear[e.date.slice(0,4)]=byYear[e.date.slice(0,4)]||[]).push(e);});
  Object.keys(byYear).sort().reverse().forEach(function(y){var g=document.createElement('optgroup');g.label=y;byYear[y].slice().reverse().forEach(function(e){var o=document.createElement('option');o.value=e.id;o.textContent=niceDate(e.date)+' · '+e.label;g.appendChild(o);});se.appendChild(g);});
  se.onchange=function(){loadElection(se.value,null);};
  var defE=params.get('e');
  if(!defE){var gen=S.cat.elections.filter(function(e){return e.type==='general';});defE=gen[gen.length-1].id;}
  coverage();
  loadElection(defE,params.get('c'));
}).catch(function(e){document.getElementById('introText').textContent='Could not load: '+e.message;});

function contestsInCB(){return S.idx.contests.filter(function(c){return c.cds.indexOf(S.cb)>=0;});}

function buildTabs(cid){

function tab(c){var d=document.createElement('div');d.className='q-tab';d.dataset.id=c.id;d.textContent=shortLabel(c);d.onclick=function(){loadContest(c.id);};return d;}

// vectors: v[0]=ballots, v[i+1]=votes for cands[i]
function counted(v){var t=0;for(var i=1;i<v.length;i++){var n=S.c.cands[i-1];if(n!=='Undervote'&&n!=='Overvote')t+=v[i]||0;}return t;}
function ranked(v){var a=[];for(var i=0;i<S.c.cands.length;i++){var n=S.c.cands[i];if(NONCAND[n])continue;a.push([n,v[i+1]||0]);}a.sort(function(x,y){return y[1]-x[1];});return a;}
function boardStats(cb){
  var c=S.c,v=c.cd[cb];if(!v)return null;
  var tot=counted(v),r=ranked(v);
  var w=r[0],s=r[1]||['',0];
  var m=S.ed2cd[S.idx.release],eds=0,won=0;
  Object.keys(c.eds).forEach(function(e){if(m[e]!==cb)return;var rv=ranked(c.eds[e]);if(!rv.length||rv[0][1]===0)return;eds++;if(rv[0][0]===w[0]&&rv[0][1]>(rv[1]?rv[1][1]:0))won++;});
  return {v:v,tot:tot,winner:w[0],wv:w[1],second:s[0],sv:s[1],margin:tot?(w[1]-s[1])/tot:0,eds:eds,won:won,tie:w[1]===s[1]};
}
function mix(a,b,t){function h(x){return [parseInt(x.slice(1,3),16),parseInt(x.slice(3,5),16),parseInt(x.slice(5,7),16)];}var A=h(a),B=h(b);return 'rgb('+A.map(function(x,i){return Math.round(x+(B[i]-x)*t);}).join(',')+')';}
function lighten(hex){return mix(hex,'#ffffff',.55);}
function fillFor(st,maxM){
  if(!st||!st.tot||st.wv===0)return '#d1d5db';
  if(st.tie)return '#9a958c';
  var t=Math.max(.14,Math.min(1,st.margin/(maxM||1)));
  var col=S.c.colors[st.winner];
  var light=st.winner===S.A?NAVY_LIGHT:st.winner===S.B?ORANGE_LIGHT:lighten(col);
  return mix(light,col,t);
}

function legend(maxM){

  var winners={};S.cdGeo.features.forEach(function(f){var st=boardStats(f.properties.c);if(st&&st.tot&&!st.tie&&st.wv)winners[st.winner]=1;});
  var order=[S.A,S.B].concat(Object.keys(winners).filter(function(n){return n!==S.A&&n!==S.B;})).filter(function(n){return n&&(winners[n]||n===S.A||n===S.B);});
  order.forEach(function(n){var col=S.c.colors[n],light=n===S.A?NAVY_LIGHT:n===S.B?ORANGE_LIGHT:lighten(col);
    h+='<div class="wm-legend-row"><span class="wm-legend-l">'+esc(n.split(' / ')[0])+'</span><div class="wm-legend-bar" style="background:linear-gradient(90deg,'+light+' 0%,'+col+' 100%)"><span class="wm-tick" style="left:0%">0%</span><span class="wm-tick" style="left:50%">'+mid+'%</span><span class="wm-tick" style="left:100%">'+lab+'%</span></div></div>';});

function renderMapOnly(){if(S.cdLayer){S.map.removeLayer(S.cdLayer);S.cdLayer=null;}document.getElementById('wmLegend').innerHTML='';document.getElementById('wmDetail').innerHTML='';document.getElementById('wmIntro').textContent='';}
function renderMap(){
  var c=S.c;
  if(S.cdLayer)S.map.removeLayer(S.cdLayer);
  var stats={},maxM=0,keys=[];
  S.cdGeo.features.forEach(function(f){var k=f.properties.c,st=boardStats(k);stats[k]=st;if(st&&st.tot){keys.push(k);if(st.margin>maxM)maxM=st.margin;}});
  S.maxM=maxM;S.stats=stats;
  document.getElementById('wmIntro').textContent='This map shows the winning candidate’s percentage margin in each community board.'+(S.A&&S.B?' Navy marks a '+lastName(S.A)+' win and orange marks a '+lastName(S.B)+' win'+(Object.keys(stats).some(function(k){var s=stats[k];return s&&s.tot&&s.winner!==S.A&&s.winner!==S.B&&!s.tie;})?'; other colors mark other winners.':'.'):'');
  S.cdLayer=L.geoJSON(S.cdGeo,{
    filter:function(f){return !!stats[f.properties.c];},
    style:function(f){var st=stats[f.properties.c],sel=f.properties.c===S.cb;return {color:sel?'#111827':'#ffffff',weight:sel?3:1.2,fillColor:fillFor(st,maxM),fillOpacity:.65};},
    onEachFeature:function(f,l){

      l.on('mouseout',function(){if(k!==S.cb)l.setStyle({weight:1.2,color:'#ffffff'});setDetail(S.cb);});
      l.on('click',function(){if(isCB(k)){setCB(k);document.getElementById('raceTitle').scrollIntoView({behavior:'smooth'});}});
    }}).addTo(S.map);
  if(keys.length){var ls=[];S.cdLayer.eachLayer(function(l){ls.push(l);});S.map.fitBounds(L.featureGroup(ls).getBounds(),{padding:[18,18]});}

function renderScoreboard(){
  var el=document.getElementById('cb-scoreboard'),c=S.c;
  var rows=[],all={a:0,b:0,o:0,t:0};
  BORO_ORDER.forEach(function(b){

    if(r.t){rows.push([BORON[b]==='Bronx'?'The Bronx':BORON[b],r,false]);['a','b','o','t'].forEach(function(x){all[x]+=r[x];});}

      (r.a?'<div class="sb-chart-seg" style="width:'+pa.toFixed(1)+'%;background:'+NAVY+'"><span class="sb-chart-num">'+r.a+'</span></div>':'')+

      (r.o?'<div class="sb-chart-seg" style="width:'+po.toFixed(1)+'%;background:#9a958c"><span class="sb-chart-num">'+r.o+'</span></div>':'')+

function clearBoard(){document.getElementById('candBars').innerHTML='';document.getElementById('tableBody').innerHTML='';document.getElementById('countPill').textContent='';document.getElementById('raceTitle').textContent='';document.getElementById('raceSubtitle').textContent='';document.getElementById('cb-scoreboard').innerHTML='';}

function applyFilters(){
  var q=document.getElementById('searchED').value.trim(),ad=document.getElementById('filterAD').value,fr=document.getElementById('filterResult').value;
  var qe=null,qa=null;if(q){var m=q.match(/(\d+)\s*[\/ ]\s*(\d+)/);if(m){qe=+m[1];qa=+m[2];}else qe=+q.replace(/\D/g,'');}
  S.filtered=S.rows.filter(function(r){
    if(ad&&r.ad!==+ad)return false;
    if(q&&qe!=null&&r.ed!==qe)return false;if(qa!=null&&r.ad!==qa)return false;
    if(fr==='close'&&!(r.t&&(r.wv-r.sv)/r.t<.05))return false;

  renderTable();
}

      '<td style="font-family:DM Mono,monospace;font-size:.8rem;font-weight:700;color:var(--navy)">'+pad(r.ed)+'/'+r.ad+'</td>'+
      '<td style="text-align:right;font-family:DM Mono,monospace;font-size:.8rem;color:'+NAVY+';font-weight:600">'+fmt(r.a)+'<span style="color:var(--muted);font-weight:400;font-size:.68rem"> ('+(r.t?p1(r.a/r.t):'0%')+')</span></td>'+
      '<td style="text-align:right;font-family:DM Mono,monospace;font-size:.8rem;color:#c15200;font-weight:600">'+(S.B?fmt(r.b)+'<span style="color:var(--muted);font-weight:400;font-size:.68rem"> ('+(r.t?p1(r.b/r.t):'0%')+')</span>':'')+'</td>'+
      '<td style="font-family:DM Mono,monospace;font-size:.72rem;color:var(--muted)">'+fmt(r.ballots||r.t)+'</td>'+
      '<td style="min-width:180px"><div style="background:#ddd;border-radius:3px;height:14px;overflow:hidden"><div style="height:100%;width:'+bw.toFixed(0)+'%;background:'+col+';border-radius:3px"></div></div>'+
      '<div style="font-size:.65rem;color:'+col+';font-weight:700;margin-top:3px">'+(r.win?esc(r.win==='Tie'?'Tie':lastName(r.win))+(r.t&&r.win!=='Tie'?' '+p1(r.wv/r.t):''):'No votes')+'</div></td></tr>';}).join('');
}

// ---- district history: how the board's districts changed, 2006 to today ----
var DH={data:null,office:'council',term:null,map:null,layer:null,cb:null,geo:{},pal:['#0d1b4b','#f47920','#2d6a4f','#8e2b20','#7b6cd0','#b8860b','#2e7d8f','#c2508f']};
var DHNAME={council:'Council District',assembly:'Assembly District',senate:'State Senate District',congress:'Congressional District'};
var DHSHORT={council:'CD',assembly:'AD',senate:'SD',congress:'NY-'};
function dhLabel(o,d){return o==='congress'?'NY-'+d:DHSHORT[o]+' '+d;}
function dhMembers(row,d){var ms=row.members[String(d)]||[];return ms.map(function(m){return m.name+(m.type==='special'?' (special, '+m.elected.slice(0,4)+')':'')+(m.from&&m.to&&(m.from.slice(0,4)!==row.served.slice(0,4)||m.to.slice(0,4)!==row.served.slice(-4))?' ('+m.from.slice(0,4)+'–'+m.to.slice(0,4)+')':'');});}
function renderDistricts(){
  if(!DH.data){j('/data/districthistory/overlap.json').then(function(d){DH.data=d;renderDistricts();});return;}
  if(DH.cb===S.cb)return;DH.cb=S.cb;
  var cb=S.cb,code=cbCode(cb),d=DH.data;
  document.getElementById('dhTitle').textContent=code+'’s districts since 2006';
  document.getElementById('dhJump').innerHTML='How '+esc(code)+'’s Council, Assembly, State Senate and Congressional districts changed since 2006 &darr;';
  document.getElementById('dhSub').textContent='Which Council, Assembly, State Senate and Congressional districts cover '+code+' in each term, who represented them, and what share of the board’s '+fmt(d.boardPop[cb]||0)+' residents (2020 census) lives in each. Lines come from the Department of City Planning district file for each election; members from the City Council roster and New York State Board of Elections results. Districts holding under half a percent of the board’s residents are left out.';
  // summary
  var sum='';
  d.offices.forEach(function(o){
    var runs=[];o.rows.forEach(function(r){var n=(r.cbs[cb]||[]).length;var last=runs[runs.length-1];if(last&&last.n===n)last.to=r.served.slice(-4);else runs.push({n:n,from:r.served.slice(0,4),to:r.served.slice(-4)});});
    var cur=runs[runs.length-1];
    var hist=runs.slice(0,-1).reverse().map(function(x){return x.n+' in '+x.from+'–'+x.to;}).join(', ');
    sum+='<div class="wm-stat"><span class="wm-stat-l">'+esc(o.label)+'</span><span class="wm-stat-v">'+cur.n+' district'+(cur.n===1?'':'s')+' since '+cur.from+'</span>'+(hist?'<span style="display:block;font-size:.72rem;color:var(--muted);margin-top:3px">'+hist+'</span>':'')+'</div>';
  });
  document.getElementById('dhSummary').innerHTML=sum;
  // tables
  var t='';
  d.offices.forEach(function(o){
    t+='<div class="dh-h">'+esc(o.label)+'</div><div style="overflow-x:auto"><table class="dh-tbl"><thead><tr><th>Term</th><th>Districts covering '+esc(code)+'</th><th class="r">Count</th></tr></thead><tbody>';
    o.rows.slice().reverse().forEach(function(r,ri){
      var list=r.cbs[cb]||[];
      t+='<tr data-o="'+o.key+'" data-e="'+r.election+'"><td style="white-space:nowrap"><b style="color:var(--navy)">'+esc(r.served)+'</b><div style="font-size:.68rem;color:var(--muted);font-family:DM Mono,monospace">elected '+r.election+'</div></td><td>'+
        list.map(function(x,i){var ms=dhMembers(r,x[0]);return '<div class="dh-chip"><b>'+esc(dhLabel(o.key,x[0]))+'</b><span>'+(ms.length?esc(ms.join(', ')):'')+'</span><div class="dh-bar"><i style="width:'+(x[1]*100).toFixed(1)+'%;background:'+DH.pal[i%DH.pal.length]+'"></i></div><span style="font-family:DM Mono,monospace;font-size:.66rem;color:var(--muted)">'+(x[1]*100).toFixed(1)+'% of residents</span></div>';}).join('')+
        '</td><td class="dh-n" style="text-align:right">'+list.length+'</td></tr>';
    });
    t+='</tbody></table></div>';
  });
  var tb=document.getElementById('dhTables');tb.innerHTML=t;
  [].forEach.call(tb.querySelectorAll('tr[data-o]'),function(tr){tr.onclick=function(){DH.office=tr.dataset.o;DH.term=+tr.dataset.e;dhControls();dhDraw();document.getElementById('dhMap').scrollIntoView({behavior:'smooth',block:'center'});};});
  dhControls();dhDraw();
}
function dhOffice(){return DH.data.offices.filter(function(o){return o.key===DH.office;})[0];}
function dhControls(){
  var offs=document.getElementById('dhOffs');
  offs.innerHTML=DH.data.offices.map(function(o){return '<button class="dh-off'+(o.key===DH.office?' on':'')+'" data-k="'+o.key+'">'+esc(o.label)+'</button>';}).join('');
  [].forEach.call(offs.querySelectorAll('.dh-off'),function(b){b.onclick=function(){DH.office=b.dataset.k;DH.term=null;dhControls();dhDraw();};});
  var o=dhOffice(),sel=document.getElementById('dhTerm');
  if(DH.term==null||!o.rows.some(function(r){return r.election===DH.term;}))DH.term=o.rows[o.rows.length-1].election;
  sel.innerHTML=o.rows.slice().reverse().map(function(r){return '<option value="'+r.election+'">'+esc(r.served)+' (elected '+r.election+')</option>';}).join('');
  sel.value=String(DH.term);sel.onchange=function(){DH.term=+sel.value;dhDraw();};
  [].forEach.call(document.querySelectorAll('#dhTables tr[data-o]'),function(tr){tr.classList.toggle('cur',tr.dataset.o===DH.office&&+tr.dataset.e===DH.term);});
}
function dhDraw(){
  var o=dhOffice(),r=o.rows.filter(function(x){return x.election===DH.term;})[0],cb=S.cb;
  [].forEach.call(document.querySelectorAll('#dhTables tr[data-o]'),function(tr){tr.classList.toggle('cur',tr.dataset.o===DH.office&&+tr.dataset.e===DH.term);});
  if(!DH.map){DH.map=L.map('dhMap',{zoomSnap:.25,scrollWheelZoom:false});L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_2hyw_1_9cda1572a3817275ed412c0e',{maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(DH.map);}
  var list=r.cbs[cb]||[],col={};list.forEach(function(x,i){col[x[0]]=DH.pal[i%DH.pal.length];});
  var go=function(fc){
    if(DH.layer)DH.map.removeLayer(DH.layer);
    var board=S.cdGeo.features.filter(function(f){return f.properties.c===cb;})[0];
    var lbls=[];
    var dl=L.geoJSON(fc,{filter:function(f){return col[f.properties.d]!=null;},style:function(f){return {color:'#fff',weight:2,fillColor:col[f.properties.d],fillOpacity:.38};},
      onEachFeature:function(f,l){var ms=dhMembers(r,f.properties.d);l.bindTooltip('<strong>'+esc(dhLabel(o.key,f.properties.d))+'</strong>'+(ms.length?'<br>'+esc(ms.join(', ')):''),{sticky:true});
        lbls.push(L.marker(l.getBounds().getCenter(),{icon:L.divIcon({className:'dh-lbl',html:esc(dhLabel(o.key,f.properties.d)),iconSize:[60,14]}),interactive:false}));}});
    var bl=board?L.geoJSON(board,{interactive:false,style:{color:ORANGE,weight:3.5,fill:false}}):null;
    DH.layer=L.featureGroup([dl].concat(bl?[bl]:[]).concat(lbls)).addTo(DH.map);
    if(bl)DH.map.fitBounds(bl.getBounds(),{padding:[30,30]});
  };
  if(DH.geo[r.geo])go(DH.geo[r.geo]);else j('/data/districthistory/'+r.geo).then(function(t){DH.geo[r.geo]=topojson.feature(t,t.objects[Object.keys(t.objects)[0]]);go(DH.geo[r.geo]);});
  var code=cbCode(cb);
  document.getElementById('dhDetail').innerHTML='<div class="eyebrow">'+esc(o.label)+' · '+esc(r.served)+'</div><h4>'+list.length+' district'+(list.length===1?'':'s')+' in '+esc(code)+'</h4>'+
    list.map(function(x){var ms=dhMembers(r,x[0]);return '<div class="wm-chip" style="align-items:flex-start"><span class="wm-dot" style="background:'+col[x[0]]+';margin-top:3px"></span><span><strong>'+esc(dhLabel(o.key,x[0]))+'</strong> · '+(x[1]*100).toFixed(1)+'% of residents'+(ms.length?'<br><span style="font-weight:400">'+esc(ms.join(', '))+'</span>':'')+'</span></div>';}).join('')+
    '<div class="wm-note">The orange outline is '+esc(code)+'. Lines are the Department of City Planning '+esc(o.label)+' file used for the '+r.election+' election (release '+esc(r.release)+'). Pick another term or office above, or tap a row in the tables below.</div>';
}

// address lookup
function pip(pt,ring){var x=pt[0],y=pt[1],ins=false;for(var i=0,k=ring.length-1;i<ring.length;k=i++){var xi=ring[i][0],yi=ring[i][1],xj=ring[k][0],yj=ring[k][1];if(((yi>y)!==(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi))ins=!ins;}return ins;}
function inGeom(pt,g){var ps=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(var p=0;p<ps.length;p++){if(pip(pt,ps[p][0])){var hole=false;for(var h=1;h<ps[p].length;h++)if(pip(pt,ps[p][h]))hole=true;if(!hole)return true;}}return false;}
function lookup(){
  var q=document.getElementById('addrInput').value.trim(),out=document.getElementById('edAddrResult');if(!q)return;
  out.textContent='Looking up…';
  fetch('https://geosearch.planninglabs.nyc/v2/search?size=1&text='+encodeURIComponent(q)).then(function(r){return r.json();}).then(function(d){
    if(!d.features||!d.features.length){out.textContent='Address not found.';return;}
    var f=d.features[0],co=f.geometry.coordinates,fc=S.geo[S.idx.release],hit=null;
    for(var i=0;i<fc.features.length;i++){if(inGeom(co,fc.features[i].geometry)){hit=fc.features[i];break;}}
    if(!hit){out.textContent='That address is not inside an election district on this election’s map.';return;}
    var e=hit.properties.e,cb=S.ed2cd[S.idx.release][e];
    var label=esc(f.properties.label||q)+' is in ED '+pad(+e.slice(-3))+' of AD '+e.slice(0,-3)+(cb?', '+cbCode(cb):'')+'.';
    var go=function(){
      out.innerHTML=label+(S.c&&S.c.eds[e]?'':' This contest was not on the ballot there.');
      document.getElementById('searchED').value='';document.getElementById('filterAD').value='';document.getElementById('filterResult').value='';
      S.filtered=S.rows.slice();renderTable(e);
      var row=document.getElementById('ed-'+e);if(row)row.scrollIntoView({behavior:'smooth',block:'center'});
      var w=document.getElementById('edMapWrap');w.style.display='block';
      if(!S.edMap){S.edMap=L.map('edMap',{scrollWheelZoom:false});L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_2hyw_1_9cda1572a3817275ed412c0e',{maxZoom:19}).addTo(S.edMap);}
      if(S.edLay)S.edMap.removeLayer(S.edLay);
      S.edLay=L.featureGroup([L.geoJSON(hit,{style:{color:ORANGE,weight:3,fillColor:ORANGE,fillOpacity:.18}}),L.circleMarker([co[1],co[0]],{radius:6,color:'#fff',weight:2,fillColor:NAVY,fillOpacity:1})]).addTo(S.edMap);
      setTimeout(function(){S.edMap.invalidateSize();S.edMap.fitBounds(S.edLay.getBounds(),{padding:[20,20],maxZoom:17});},50);
    };
    if(cb&&cb!==S.cb&&isCB(cb)){S.cb=cb;document.getElementById('selCB').value=cb;
      var still=S.c&&contestsInCB().some(function(x){return x.id===S.c.id;});
      var wait=setInterval(function(){if(S.c&&S.cb===cb&&document.getElementById('barsLbl').textContent.indexOf(cbCode(cb))===0){clearInterval(wait);go();}},150);
      setTimeout(function(){clearInterval(wait);},8000);
      buildTabs(still?S.c.id:null);
    } else go();
  }).catch(function(){out.textContent='Address lookup failed.';});
}
document.getElementById('addrBtn').onclick=lookup;
document.getElementById('addrInput').addEventListener('keydown',function(e){if(e.key==='Enter')lookup();});

function coverage(){
  var E=S.cat.elections,n=E.reduce(function(a,e){return a+e.contests;},0);
  var el=document.getElementById('coverage');
  el.innerHTML=fmt(E.length)+' elections and '+fmt(n)+' contests: every primary, general and special election the NYC Board of Elections has published by election district, starting in 2014, plus the November 2012 general election (President, U.S. Senate, Congress, State Senate and Assembly). Before 2014 the Board of Elections publishes results only by Assembly district, so earlier elections cannot be shown by election district. Ranked choice primaries show first choices counted from the Board of Elections cast vote records. Community board totals add up every election district in the board, using the Department of City Planning election district map closest to each election.';
  j(BASE+'audit.json').then(function(a){
    var seen={},li=[];(a.boe_unreadable_files||[]).forEach(function(f){var m=f.file.replace(/^\d{11}/,'').replace(/ EDLevel\.csv$/,'');var k=f.election.slice(0,8)+m.replace(/^(Citywide|New York|Bronx|Kings|Queens|Richmond|Crossover) /,'');if(seen[k])return;seen[k]=1;li.push(f.election.slice(0,4)+'-'+f.election.slice(4,6)+'-'+f.election.slice(6,8)+': '+m);});
    if(li.length)el.innerHTML+='<br><br>Missing because the Board of Elections download links are broken ('+li.length+'): '+li.map(esc).join('; ')+'.';
  });
}
})();
</script>
