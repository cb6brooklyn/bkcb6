<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#0d1b4b}
body{display:flex;flex-direction:column}
.top-bar{background:#0d1b4b;border-bottom:3px solid #f47920;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-shrink:0}
.top-bar h1{font-size:.92rem;font-weight:700;color:#fff;white-space:nowrap;flex-shrink:0}
.top-bar h1 span{color:#f47920}
.back-link{font-size:.7rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.45);text-decoration:none;white-space:nowrap;margin-left:auto}
.back-link:hover{color:#f47920}
.pick-bar,.layer-bar{padding:8px 14px;background:#0d1b4b;border-bottom:1px solid rgba(255,255,255,.1);display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-shrink:0}
.lbl{font-size:.58rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.45);margin-right:2px}
.tbtn,.lbtn{padding:5px 13px;font-size:.76rem;font-family:'DM Sans',sans-serif;font-weight:700;border:1.5px solid rgba(255,255,255,.25);border-radius:20px;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;transition:all .15s;white-space:nowrap}
.tbtn.on{background:#f47920;border-color:#f47920;color:#fff}
.lbtn.on{background:var(--pc);border-color:var(--pc);color:#fff}
#place{padding:6px 10px;font-size:.8rem;font-family:'DM Sans',sans-serif;font-weight:600;border:1.5px solid rgba(255,255,255,.25);border-radius:6px;background:#0d1b4b;color:#fff;min-width:210px;max-width:100%}
#place:disabled{opacity:.35}
#map{flex:1 1 auto;min-height:260px}
.stats{background:#f8f7f4;border-top:3px solid #f47920;flex-shrink:0;max-height:47vh;overflow-y:auto}
.st-head{padding:9px 14px 4px;display:flex;flex-wrap:wrap;gap:8px;align-items:baseline}
.st-title{font-size:1.02rem;font-weight:700;color:#0d1b4b}
.st-sub{font-size:.72rem;font-family:'DM Mono',monospace;color:#6b6760}
.st-sub a{color:#f47920;text-decoration:none;font-weight:500}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;padding:6px 14px 10px}
.kpi{background:#fff;border:1.5px solid #e5e2db;border-radius:8px;padding:8px 10px}
.kpi .n{font-size:1.32rem;font-weight:700;color:#0d1b4b;line-height:1.1;font-family:'DM Mono',monospace}
.kpi .k{font-size:.6rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.05em;color:#6b6760;margin-top:2px}
.kpi .d{font-size:.68rem;font-weight:600;margin-top:3px;display:block}
.up{color:#b91c1c}.down{color:#15803d}.flat{color:#6b6760}
.blk{padding:0 14px 12px}
.blk h3{font-size:.62rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:#6b6760;margin-bottom:6px}
.mrow{display:grid;grid-template-columns:118px 1fr 52px;gap:8px;align-items:center;font-size:.76rem;color:#333;margin-bottom:4px}
.mrow .bar{height:11px;background:#e5e2db;border-radius:3px;overflow:hidden}
.mrow .bar i{display:block;height:100%;background:#f47920}
.mrow .v{text-align:right;font-family:'DM Mono',monospace;color:#0d1b4b;font-weight:500}
.yrs{display:flex;gap:5px;align-items:flex-end}
.yr{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.yr i{display:block;width:100%;background:#0d1b4b;border-radius:2px 2px 0 0;min-height:2px}
.yr.part i{background:#9aa0b8}
.yr b{font-size:.56rem;font-family:'DM Mono',monospace;color:#6b6760;font-weight:400}
.yr em{font-size:.58rem;font-family:'DM Mono',monospace;color:#0d1b4b;font-style:normal}
.svc{font-size:.74rem;color:#333;line-height:1.7}
.svc b{color:#0d1b4b;font-family:'DM Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em}
.meth{padding:0 14px 14px;font-size:.66rem;color:#6b6760;line-height:1.55}
.leaflet-tooltip.mlbl{background:transparent;border:none;box-shadow:none;padding:0;font-family:'DM Mono',monospace;font-weight:500;color:#0d1b4b;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 3px #fff}
.leaflet-tooltip.mlbl:before{display:none}
.leaflet-tooltip.mlbl.pct{font-size:.72rem;color:#1d4ed8}
.leaflet-tooltip.mlbl.sec{font-size:.6rem;color:#6d28d9}
.leaflet-tooltip.mlbl.cd{font-size:.62rem;color:#3f3c37}
.leaflet-tooltip.mlbl.bat{font-size:.62rem;color:#b91c1c}
.leaflet-tooltip.mlbl.dsny{font-size:.58rem;color:#15803d}
</style>

<body>
<div class="top-bar">
  <h1>BKCB6 <span>Public Safety Hub</span></h1>
  <a class="back-link" href="/">← bkcb6.app</a>
</div>
<div class="pick-bar">
  <span class="lbl">View</span>
  <button class="tbtn on" id="lvl-city">Citywide</button>
  <button class="tbtn" id="lvl-boro">Borough</button>
  <button class="tbtn" id="lvl-cd">Community District</button>
  <button class="tbtn" id="lvl-pct">Precinct</button>
  <button class="tbtn" id="lvl-sec">Sector</button>
  <select id="place" disabled><option>Citywide</option></select>
</div>
<div class="layer-bar">
  <span class="lbl">Layers</span>
  <button class="lbtn on" id="btn-pct" style="--pc:#1d4ed8">🚔 Precincts</button>
  <button class="lbtn" id="btn-sec" style="--pc:#7c3aed">🎯 Sectors</button>
  <button class="lbtn" id="btn-bat" style="--pc:#dc2626">🚒 FDNY Battalions</button>
  <button class="lbtn" id="btn-house" style="--pc:#b91c1c">🏠 Firehouses</button>
  <button class="lbtn" id="btn-dsny" style="--pc:#15803d">🗑 DSNY Sections</button>
  <button class="lbtn on" id="btn-cd" style="--pc:#6b6760">🗺 District Lines</button>
  <button class="lbtn on" id="btn-lab" style="--pc:#f47920">🏷 Labels</button>
</div>
<div id="map"></div>
<div class="stats" id="stats"><div class="st-head"><span class="st-title">Loading…</span></div></div>

<script>
var BORO={'1':'Manhattan','2':'Bronx','3':'Brooklyn','4':'Queens','5':'Staten Island'};
var BCODE={'1':'MN','2':'BX','3':'BK','4':'QN','5':'SI'};
var MAJN={MUR:'Murder',RAP:'Rape',ROB:'Robbery',ASL:'Felony assault',BUR:'Burglary',GLA:'Grand larceny',GLM:'Grand larceny auto'};
var MAJO=['MUR','RAP','ROB','ASL','BUR','GLA','GLM'];
var YEARS=['2019','2020','2021','2022','2023','2024','2025','2026'];
var PARTIAL='2026';
function REAL_CD(c){var b=c.charAt(0),n=parseInt(c.slice(1),10);
  if(b==='1'||b==='2')return n>=1&&n<=12;
  if(b==='3')return n>=1&&n<=18;
  if(b==='4')return n>=1&&n<=14;
  if(b==='5')return n>=1&&n<=3;
  return false;}

var map=L.map('map',{scrollWheelZoom:true,preferCanvas:true}).setView([40.706,-73.955],10);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);

var D={},LYR={},LAB={},XW=null,CDL=null,ST=null,PBORO={},selLayer=null,labelsOn=true;
var VIS={pct:true,sec:false,bat:false,house:false,dsny:false,cd:true};
var MINZ={pct:0,sec:13,cd:0,bat:12,dsny:13};
var state={lvl:'city',key:''};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return (n||0).toLocaleString('en-US');}
function ord(n){n=parseInt(n,10);var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);}
function cdCode(c){return BCODE[c.charAt(0)]+'CB'+parseInt(c.slice(1),10);}
function cdName(c){
  if(!REAL_CD(c))return 'Joint Interest Area '+c;
  var r=CDL&&CDL[cdCode(c)];
  return cdCode(c)+(r&&r.cn&&r.cn.length?' · '+r.cn.slice(0,3).join(', '):'');
}
function getJSON(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u);return r.json();});}

/* ---------- stats ---------- */
function blank(){return {f:0,m:0,v:0,maj:{}};}
function addTo(a,b){
  if(!b)return a;
  a.f+=b.f||0;a.m+=b.m||0;a.v+=b.v||0;
  var mj=b.maj||{};
  for(var k in mj){a.maj[k]=(a.maj[k]||0)+mj[k];}
  return a;
}
function statKeys(lvl,key){
  if(lvl==='cd')return ['C'+key];
  if(lvl==='pct')return ['P'+key];
  if(lvl==='sec')return ['S'+key];
  var out=[];
  for(var k in ST){
    if(k.charAt(0)!=='P')continue;
    if(lvl==='city'){out.push(k);continue;}
    if(PBORO[k.slice(1)]===key)out.push(k);
  }
  return out;
}
function seriesFor(lvl,key){
  var keys=statKeys(lvl,key),out={};
  YEARS.forEach(function(y){
    var a=blank();
    keys.forEach(function(k){if(ST[k]&&ST[k][y])addTo(a,ST[k][y]);});
    out[y]=a;
  });
  return out;
}
function tot(s){return s.f+s.m+s.v;}
function majTot(s){var n=0;MAJO.forEach(function(m){n+=s.maj[m]||0;});return n;}
function delta(cur,prev){
  if(!prev)return '<span class="d flat">no 2024 baseline</span>';
  var d=((cur-prev)/prev)*100;
  var cls=d>0.5?'up':(d<-0.5?'down':'flat');
  return '<span class="d '+cls+'">'+(d>0?'+':'')+d.toFixed(1)+'% vs 2024</span>';
}

function servesList(lvl,key){
  if(!XW)return '';
  function within(tbl,test){
    var o=[];
    for(var k in tbl){for(var c in tbl[k]){if(test(c)){o.push(k);break;}}}
    return o.sort(function(a,b){return String(a).localeCompare(String(b),undefined,{numeric:true});});
  }
  var test;
  if(lvl==='cd')test=function(c){return c===key;};
  else if(lvl==='boro')test=function(c){return c.charAt(0)===key;};
  else if(lvl==='city')test=function(){return true;};
  else return '';
  var p=within(XW.pct,test),s=within(XW.sec,test),b=within(XW.bat,test),d=within(XW.dsny,test);
  var out=[];
  if(p.length)out.push('<b>NYPD</b> '+(p.length>22?p.length+' precincts':p.map(ord).join(', ')));
  if(s.length)out.push('<b>Sectors</b> '+(s.length>16?s.length+' patrol sectors':s.join(', ')));
  if(b.length)out.push('<b>FDNY</b> '+(b.length>16?b.length+' battalions':'Battalion '+b.join(', ')));
  if(d.length)out.push('<b>DSNY</b> '+(d.length>12?d.length+' sections':d.join(', ')));
  return out.join('<br>');
}

function titleFor(lvl,key){
  if(lvl==='city')return 'New York City';
  if(lvl==='boro')return BORO[key];
  if(lvl==='cd')return cdName(key);
  if(lvl==='pct')return ord(key)+' Precinct';
  if(lvl==='sec')return 'Patrol Sector '+key;
  return '';
}
function subFor(lvl,key){
  if(lvl==='city')return '5 boroughs · 59 community districts · 78 precincts · 303 patrol sectors';
  if(lvl==='boro'){
    var n=0;
    for(var k in CDL){if(CDL[k].boro===BORO[key])n++;}
    return n+' community districts';
  }
  if(lvl==='cd'){
    var r=CDL[cdCode(key)];
    return (r?r.boro+' Community District '+r.num:'')+
      ' &nbsp; <a href="/cb-'+BCODE[key.charAt(0)].toLowerCase()+'-'+parseInt(key.slice(1),10)+'.html">District page →</a>';
  }
  if(lvl==='pct'){
    var a=XW&&XW.pct[key]?Object.keys(XW.pct[key]).filter(REAL_CD).map(cdCode):[];
    return 'Covers '+a.join(', ');
  }
  if(lvl==='sec'){
    var b=XW&&XW.sec[key]?Object.keys(XW.sec[key]).filter(REAL_CD).map(cdCode):[];
    return ord(key.replace(/[A-Z]+$/,''))+' Precinct · '+b.join(', ');
  }
  return '';
}

function renderStats(lvl,key){
  var el=document.getElementById('stats');
  if(!ST){el.innerHTML='<div class="st-head"><span class="st-title">Loading…</span></div>';return;}
  var ser=seriesFor(lvl,key);
  var cur=ser['2025'],prev=ser['2024'],ytd=ser['2026'];
  var h='';
  h+='<div class="st-head"><span class="st-title">'+esc(titleFor(lvl,key))+'</span><span class="st-sub">'+subFor(lvl,key)+'</span></div>';
  h+='<div class="kpis">';
  h+='<div class="kpi"><div class="n">'+fmt(tot(cur))+'</div><div class="k">All complaints 2025</div>'+delta(tot(cur),tot(prev))+'</div>';
  h+='<div class="kpi"><div class="n">'+fmt(majTot(cur))+'</div><div class="k">Major felonies 2025</div>'+delta(majTot(cur),majTot(prev))+'</div>';
  h+='<div class="kpi"><div class="n">'+fmt(cur.f)+'</div><div class="k">Felonies</div>'+delta(cur.f,prev.f)+'</div>';
  h+='<div class="kpi"><div class="n">'+fmt(cur.m)+'</div><div class="k">Misdemeanors</div>'+delta(cur.m,prev.m)+'</div>';
  h+='<div class="kpi"><div class="n">'+fmt(cur.v)+'</div><div class="k">Violations</div>'+delta(cur.v,prev.v)+'</div>';
  h+='<div class="kpi"><div class="n">'+fmt(tot(ytd))+'</div><div class="k">2026 to date</div><span class="d flat">partial year</span></div>';
  h+='</div>';

  var mx=1;MAJO.forEach(function(m){mx=Math.max(mx,cur.maj[m]||0);});
  h+='<div class="blk"><h3>Seven major felonies, 2025</h3>';
  MAJO.forEach(function(m){
    var v=cur.maj[m]||0;
    h+='<div class="mrow"><span>'+MAJN[m]+'</span><span class="bar"><i style="width:'+(v/mx*100).toFixed(1)+'%"></i></span><span class="v">'+fmt(v)+'</span></div>';
  });
  h+='</div>';

  var mxy=1;YEARS.forEach(function(y){mxy=Math.max(mxy,tot(ser[y]));});
  h+='<div class="blk"><h3>All complaints by year</h3><div class="yrs">';
  YEARS.forEach(function(y){
    var v=tot(ser[y]);
    h+='<div class="yr'+(y===PARTIAL?' part':'')+'"><em>'+fmt(v)+'</em><i style="height:'+Math.max(2,v/mxy*46).toFixed(1)+'px"></i><b>'+y.slice(2)+'</b></div>';
  });
  h+='</div></div>';

  var svc=servesList(lvl,key);
  if(svc)h+='<div class="blk"><h3>Who serves this area</h3><div class="svc">'+svc+'</div></div>';

  h+='<div class="meth">Complaints reported to the NYPD, from NYC Open Data. Every complaint is placed by its own latitude and longitude inside the precinct, sector, and community district polygon it falls in, so district counts are exact rather than estimated from precinct totals. 2026 is a partial year and is not comparable to a full one. A complaint is a report, not a conviction, and reporting rates themselves change over time. Counts are raw and not adjusted for population, so a larger area records more complaints than a smaller one at the same level of risk.</div>';
  el.innerHTML=h;
}

/* ---------- map layers ---------- */
function statOf(prefix,k){var r=ST&&ST[prefix+k];return r&&r['2025']?r['2025']:null;}
function tipStat(prefix,k){
  var s=statOf(prefix,k);
  if(!s)return '';
  return '<br><span style="font-size:.7rem;color:#333">2025: '+fmt(tot(s))+' complaints · '+fmt(majTot(s))+' major felonies</span>';
}
function pctColor(p){var pal=['#1d4ed8','#2563eb','#3b82f6','#1e40af','#1746a2'];return pal[(parseInt(p,10)||0)%pal.length];}

function buildPct(){
  return L.geoJSON(D.pct,{
    style:function(f){var c=pctColor(f.properties.precinct);return{color:c,weight:1.4,fillColor:c,fillOpacity:.10};},
    onEachFeature:function(f,l){
      var p=String(f.properties.precinct);
      l.bindTooltip('<b>🚔 '+ord(p)+' Precinct</b>'+tipStat('P',p),{sticky:true,opacity:1});
      l.on('click',function(e){L.DomEvent.stop(e);select('pct',p);});
    }});
}
function buildSec(){
  return L.geoJSON(D.sec,{
    style:function(){return{color:'#7c3aed',weight:1,fillColor:'#7c3aed',fillOpacity:.08};},
    onEachFeature:function(f,l){
      var s=String(f.properties.sector||''),p=String(f.properties.pct||'').replace(/^0+/,'');
      l.bindTooltip('<b>🎯 Sector '+esc(s)+'</b><br>'+ord(p)+' Precinct'+tipStat('S',s),{sticky:true,opacity:1});
      l.on('click',function(e){L.DomEvent.stop(e);select('sec',s);});
    }});
}
function buildBat(){
  return L.geoJSON(D.bat,{
    style:function(){return{color:'#dc2626',weight:1.2,fillColor:'#dc2626',fillOpacity:.07};},
    onEachFeature:function(f,l){l.bindTooltip('<b>🚒 FDNY Battalion '+esc(f.properties.fire_bn)+'</b>',{sticky:true,opacity:1});}});
}
function buildHouse(){
  return L.geoJSON(D.house,{
    pointToLayer:function(f,ll){return L.marker(ll,{icon:L.divIcon({className:'',html:'<div style="font-size:15px;line-height:15px">🚒</div>',iconSize:[15,15],iconAnchor:[7,7]})});},
    onEachFeature:function(f,l){
      var p=f.properties;
      l.bindTooltip('<b>'+esc(p.name)+'</b><br>'+esc(p.address)+'<br>'+esc(p.borough)+' · CD '+esc(p.cb),{sticky:true,opacity:1});
    }});
}
function buildDsny(){
  return L.geoJSON(D.dsny,{
    style:function(){return{color:'#15803d',weight:1,fillColor:'#15803d',fillOpacity:.07};},
    onEachFeature:function(f,l){l.bindTooltip('<b>🗑 DSNY Section '+esc(f.properties.section)+'</b><br>District '+esc(f.properties.district),{sticky:true,opacity:1});}});
}
function buildCd(){
  return L.geoJSON(D.cd,{
    filter:function(f){return REAL_CD(f.properties.c);},
    style:function(){return{color:'#6b6760',weight:1.2,fill:false,dashArray:'3 3'};},
    onEachFeature:function(f,l){
      var c=f.properties.c;
      l.bindTooltip('<b>'+esc(cdName(c))+'</b>'+tipStat('C',c),{sticky:true,opacity:1});
      l.on('click',function(e){L.DomEvent.stop(e);select('cd',c);});
    }});
}
var BUILD={pct:buildPct,sec:buildSec,bat:buildBat,house:buildHouse,dsny:buildDsny,cd:buildCd};
var SRC={pct:'/data/police-precincts-lite.geojson',sec:'/data/nypd-sectors-lite.geojson',
  bat:'/data/fire-battalions-lite.geojson',house:'/data/fdny_firehouses.geojson',
  dsny:'/data/dsny-sections-lite.geojson',cd:'/data/cd-boundaries-lite.geojson'};

/* ---------- labels ---------- */
var LABTXT={
  pct:function(p){return ord(p.precinct);},
  sec:function(p){return p.sector;},
  cd:function(p){return REAL_CD(p.c)?cdCode(p.c):null;},
  bat:function(p){return 'Bn '+p.fire_bn;},
  dsny:function(p){return p.section;}
};
function buildLabels(k){
  var g=L.layerGroup(),feats=(D[k]&&D[k].features)||[];
  feats.forEach(function(f){
    var txt=LABTXT[k](f.properties);
    if(!txt)return;
    var b;
    try{b=L.geoJSON(f).getBounds();}catch(e){return;}
    if(!b||!b.isValid())return;
    L.marker(b.getCenter(),{interactive:false,keyboard:false,icon:L.divIcon({className:'',html:'',iconSize:[0,0]})})
      .bindTooltip(String(txt),{permanent:true,direction:'center',className:'mlbl '+k,opacity:1}).addTo(g);
  });
  return g;
}
function refreshLabels(){
  var z=map.getZoom();
  ['pct','sec','cd','bat','dsny'].forEach(function(k){
    var want=labelsOn&&VIS[k]&&D[k]&&z>=MINZ[k];
    if(want){
      if(!LAB[k])LAB[k]=buildLabels(k);
      if(!map.hasLayer(LAB[k]))LAB[k].addTo(map);
    }else if(LAB[k]&&map.hasLayer(LAB[k])){
      map.removeLayer(LAB[k]);
    }
  });
}
map.on('zoomend',refreshLabels);

function ensure(k){
  if(LYR[k])return Promise.resolve(LYR[k]);
  if(D[k]){LYR[k]=BUILD[k]();return Promise.resolve(LYR[k]);}
  return getJSON(SRC[k]).then(function(j){D[k]=j;LYR[k]=BUILD[k]();return LYR[k];});
}
function applyVis(k){
  if(!VIS[k]){
    if(LYR[k]&&map.hasLayer(LYR[k]))map.removeLayer(LYR[k]);
    refreshLabels();
    return Promise.resolve();
  }
  return ensure(k).then(function(l){if(!map.hasLayer(l))l.addTo(map);order();refreshLabels();});
}
function order(){
  ['bat','dsny','pct','sec','cd'].forEach(function(k){if(LYR[k]&&map.hasLayer(LYR[k])&&LYR[k].bringToFront)LYR[k].bringToFront();});
  if(selLayer&&selLayer.bringToFront)selLayer.bringToFront();
  if(LYR.house&&map.hasLayer(LYR.house)&&LYR.house.bringToFront)LYR.house.bringToFront();
}
['pct','sec','bat','house','dsny','cd'].forEach(function(k){
  document.getElementById('btn-'+k).onclick=function(){VIS[k]=!VIS[k];this.classList.toggle('on');applyVis(k);};
});
document.getElementById('btn-lab').onclick=function(){labelsOn=!labelsOn;this.classList.toggle('on');refreshLabels();};

/* ---------- selection ---------- */
function featuresFor(lvl,key){
  if(lvl==='city')return null;
  if(lvl==='boro')return (D.cd.features||[]).filter(function(f){return f.properties.c.charAt(0)===key;});
  if(lvl==='cd')return (D.cd.features||[]).filter(function(f){return f.properties.c===key;});
  if(lvl==='pct')return (D.pct.features||[]).filter(function(f){return String(f.properties.precinct)===key;});
  if(lvl==='sec')return (D.sec.features||[]).filter(function(f){return String(f.properties.sector)===key;});
  return null;
}
function needFor(lvl){return lvl==='pct'?'pct':(lvl==='sec'?'sec':'cd');}
function drawSel(lvl,key){
  if(selLayer){map.removeLayer(selLayer);selLayer=null;}
  if(lvl==='city'){map.setView([40.706,-73.955],10);refreshLabels();return;}
  var feats=featuresFor(lvl,key);
  if(!feats||!feats.length)return;
  selLayer=L.geoJSON({type:'FeatureCollection',features:feats},{interactive:false,
    style:function(){return{color:'#f47920',weight:3,fill:false,dashArray:'6 3'};}}).addTo(map);
  try{map.fitBounds(selLayer.getBounds(),{padding:[24,24]});}catch(e){}
  order();refreshLabels();
}
function select(lvl,key,skipUi){
  state.lvl=lvl;state.key=key;
  ensure(needFor(lvl)).then(function(){
    drawSel(lvl,key);
    renderStats(lvl,key);
    if(!skipUi)syncUi();
    var q=lvl==='city'?'':'?'+(lvl==='boro'?'boro':lvl)+'='+encodeURIComponent(key);
    try{history.replaceState(null,'',location.pathname+q);}catch(e){}
  });
}

/* ---------- pickers ---------- */
var sel=document.getElementById('place');
function optionsFor(lvl){
  if(lvl==='city')return [['','Citywide']];
  if(lvl==='boro'){var o=[];for(var b in BORO)o.push([b,BORO[b]]);return o;}
  if(lvl==='cd'){
    var cs=(D.cd.features||[]).map(function(f){return f.properties.c;}).filter(REAL_CD);
    cs.sort();
    return cs.map(function(c){return [c,cdName(c)];});
  }
  if(lvl==='pct'){
    var ps=(D.pct.features||[]).map(function(f){return String(f.properties.precinct);});
    ps.sort(function(a,b){return a-b;});
    return ps.map(function(p){return [p,ord(p)+' Precinct'];});
  }
  if(lvl==='sec'){
    var ss=(D.sec.features||[]).map(function(f){return String(f.properties.sector);});
    ss.sort();
    return ss.map(function(s){return [s,'Sector '+s+' ('+ord(s.replace(/[A-Z]+$/,''))+' Pct)'];});
  }
  return [];
}
function fillSelect(lvl){
  return ensure(needFor(lvl)).then(function(){
    var opts=optionsFor(lvl);
    sel.innerHTML='';
    opts.forEach(function(o){var e=document.createElement('option');e.value=o[0];e.textContent=o[1];sel.appendChild(e);});
    sel.disabled=(lvl==='city');
    if(state.key)sel.value=state.key;
  });
}
function syncUi(){
  ['city','boro','cd','pct','sec'].forEach(function(l){
    document.getElementById('lvl-'+l).classList.toggle('on',l===state.lvl);
  });
  return fillSelect(state.lvl);
}
['city','boro','cd','pct','sec'].forEach(function(l){
  document.getElementById('lvl-'+l).onclick=function(){
    state.lvl=l;state.key='';
    syncUi().then(function(){
      if(l==='city')select('city','',true);
      else if(sel.options.length)select(l,sel.options[0].value,true);
    });
  };
});
sel.onchange=function(){select(state.lvl,sel.value,true);};

/* ---------- boot ---------- */
Promise.all([
  getJSON('/data/cd-boundaries-lite.geojson'),
  getJSON('/data/police-precincts-lite.geojson'),
  getJSON('/data/safety-crosswalk.json'),
  getJSON('/data/cd-lookup.json'),
  getJSON('/data/safety-stats.json')
]).then(function(r){
  D.cd=r[0];D.pct=r[1];XW=r[2];CDL=r[3];ST=r[4];
  for(var p in XW.pct){
    var best=null,bv=-1;
    for(var c in XW.pct[p]){if(XW.pct[p][c]>bv){bv=XW.pct[p][c];best=c.charAt(0);}}
    PBORO[p]=best;
  }
  LYR.cd=buildCd();LYR.pct=buildPct();
  LYR.pct.addTo(map);LYR.cd.addTo(map);
  order();refreshLabels();

  var q=new URLSearchParams(location.search);
  var lvl='city',key='';
  if(q.get('cd')){lvl='cd';key=q.get('cd');}
  else if(q.get('pct')){lvl='pct';key=String(parseInt(q.get('pct'),10));}
  else if(q.get('sec')||q.get('sector')){lvl='sec';key=(q.get('sec')||q.get('sector')).toUpperCase();}
  else if(q.get('boro')){
    var v=q.get('boro').toUpperCase();
    for(var b in BCODE){if(BCODE[b]===v||b===v)key=b;}
    if(key)lvl='boro';
  }
  state.lvl=lvl;state.key=key;
  syncUi();
  select(lvl,key,true);
}).catch(function(e){
  document.getElementById('stats').innerHTML='<div class="st-head"><span class="st-title">Could not load data</span><span class="st-sub">'+esc(e.message)+'</span></div>';
});
</script>
