<!DOCTYPE html>
<html lang="en">
<head><meta name="apple-itunes-app" content="app-id=6813967208">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Search bkcb6.app</title>
<meta name="description" content="Search every page on bkcb6.app: Brooklyn Community Board 6 meetings, elections, land use, transportation, parks, schools, services, and every community district in New York City. Or look up any NYC address.">
<link rel="icon" href="/cb6-logo.png">
<link rel="canonical" href="https://bkcb6.app/search/">
<meta property="og:title" content="Search bkcb6.app">
<meta property="og:description" content="Every page on bkcb6.app, and any NYC address.">
<meta property="og:image" content="https://bkcb6.app/og-cb6.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--navy:#0d1b4b;--orange:#f47920;--ink:#0d1b4b;--muted:#5b6478;--line:#e3e7f2;--bg:#f5f6fa;color-scheme:only light}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:860px;margin:0 auto;padding:18px 16px 60px}
  h1{font-size:26px;margin:6px 0 4px;letter-spacing:-.01em}
  .lead{color:var(--muted);margin:0 0 14px;font-size:15px}
  form.big{display:flex;gap:8px;margin:0 0 10px}
  form.big input{flex:1;height:48px;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:inherit;font-size:17px;color:var(--ink);background:#fff;outline:0;-webkit-appearance:none}
  form.big input:focus{border-color:var(--orange);box-shadow:0 0 0 3px rgba(244,121,32,.25)}
  form.big button{height:48px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:600 15px "DM Sans",system-ui,sans-serif;padding:0 18px;cursor:pointer}
  .addr{display:block;background:#fff4ea;border:1.5px solid #ffd7b5;border-radius:12px;padding:12px 14px;color:var(--ink);text-decoration:none;margin:0 0 14px}
  .addr b{color:var(--orange)}
  .addr small{display:block;color:var(--muted);margin-top:2px}
  .count{font-family:"DM Mono",ui-monospace,monospace;font-size:13px;color:var(--muted);margin:14px 0 6px}
  .sec{background:#fff;border:1px solid var(--line);border-radius:14px;margin:0 0 12px;overflow:hidden}
  .sec h2{margin:0;padding:10px 14px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--orange);display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}
  .sec h2 a{color:var(--navy);text-decoration:none;font-size:12px;letter-spacing:0;text-transform:none;font-weight:600}
  .sec h2 a:hover{color:var(--orange)}
  .sec a.r{display:block;padding:10px 14px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  .sec a.r:last-child{border-bottom:0}
  .sec a.r:hover{background:#f3f5fb}
  .sec .t{font-weight:600;font-size:15px}
  .sec .d{font-size:13px;color:var(--muted);margin-top:2px}
  .sec .u{font-family:"DM Mono",ui-monospace,monospace;font-size:11px;color:#8a92a8;margin-top:3px;word-break:break-all}
  .sec button.more{display:block;width:100%;border:0;background:#f3f5fb;color:var(--navy);font:600 13px "DM Sans",system-ui,sans-serif;padding:10px;cursor:pointer}
  .hubs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:12px 0 0}
  .hubs a{display:block;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
  .hubs a span{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:2px}
  .hubs a:hover{border-color:var(--orange)}
  .note{color:var(--muted);font-size:14px;padding:14px;background:#fff;border:1px solid var(--line);border-radius:14px}
  .tips{color:var(--muted);font-size:13px;margin-top:18px}
  .tips code{font-family:"DM Mono",ui-monospace,monospace;background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px}
</style>
</head>
<body>
<main>
  <h1>Search bkcb6.app</h1>
  <p class="lead">Every page on the site, or any address in New York City.</p>
  <form class="big" id="f" action="/search/" method="get" autocomplete="off">
    <input type="search" name="q" id="q" placeholder="Try: early voting, Gowanus, PS 29, 250 Baltic Street" aria-label="Search" enterkeyhint="search" autofocus>
    <button type="submit">Search</button>
  </form>
  <div id="out"></div>
  <p class="tips">Type an address like <code>250 Baltic Street</code> to see its districts, zoning, representatives and what is nearby. Block pages (every block in New York City) are found by address, not by name.</p>
</main>
<script src="/assets/site-bar.js?v=1"></script>
<script>
(function(){
  var out=document.getElementById('out'),inp=document.getElementById('q'),f=document.getElementById('f');
  var S=window.CB6Search; var PER=8;
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function hubs(idx){
    var h='<div class="hubs">';
    for(var i=0;i<idx.names.length;i++){ if(idx.names[i]==='More')continue; var n=0; for(var j=0;j<idx.pages.length;j++) if(idx.pages[j].s===idx.names[i]) n++;
      h+='<a href="'+esc(idx.hubs[i])+'">'+esc(idx.names[i])+'<span>'+n+' pages</span></a>'; }
    h+='<a href="/blocks/">Blocks<span>every block, by address</span></a></div>';
    return h;
  }
  function run(q){
    q=(q||'').trim(); inp.value=q;
    document.title=q?('“'+q+'” · Search bkcb6.app'):'Search bkcb6.app';
    try{history.replaceState(null,'',q?'/search/?q='+encodeURIComponent(q):'/search/')}catch(e){}
    if(!S){out.innerHTML='<div class="note">Search is not available on this page.</div>';return}
    out.innerHTML='<div class="note">Loading the site index…</div>';
    S.load().then(function(idx){
      if(!idx){out.innerHTML='<div class="note">The site index could not be loaded. Check the connection and try again.</div>';return}
      if(!q){out.innerHTML='<div class="count">'+idx.pages.length.toLocaleString()+' pages, by section</div>'+hubs(idx);return}
      var h='';
      if(S.isAddress(q)) h+='<a class="addr" href="/citywide-search.html?address='+encodeURIComponent(q)+'"><b>Look up the address</b> '+esc(q)+'<small>Community board, election district, zoning, who represents it, parks, transit and schools nearby</small></a>';
      var res=S.search(q,400);
      if(!res.length){ out.innerHTML=h+'<div class="note">No page matches “'+esc(q)+'”. Try one word, a neighborhood, a school, a street, or an address.</div>'+hubs(idx); return; }
      var groups={},order=[];
      res.forEach(function(p){ if(!groups[p.s]){groups[p.s]=[];order.push(p.s)} groups[p.s].push(p); });
      h+='<div class="count">'+res.length+(res.length>=400?'+':'')+' pages for “'+esc(q)+'”</div>';
      order.forEach(function(s){
        var g=groups[s];
        h+='<div class="sec" data-s="'+esc(s)+'"><h2>'+esc(s)+' <span>'+g.length+'</span><a href="'+esc(S.hubOf(s))+'">All '+esc(s)+' ›</a></h2>';
        g.forEach(function(p,i){ h+='<a class="r" href="'+esc(p.u)+'"'+(i>=PER?' hidden':'')+'><div class="t">'+esc(p.t)+'</div>'+(p.d?'<div class="d">'+esc(p.d)+'</div>':'')+'<div class="u">bkcb6.app'+esc(p.u)+'</div></a>'; });
        if(g.length>PER) h+='<button class="more" type="button">Show all '+g.length+' in '+esc(s)+'</button>';
        h+='</div>';
      });
      out.innerHTML=h;
      out.querySelectorAll('button.more').forEach(function(b){ b.addEventListener('click',function(){ b.parentNode.querySelectorAll('a.r[hidden]').forEach(function(a){a.hidden=false}); b.remove(); }); });
    });
  }
  f.addEventListener('submit',function(e){ e.preventDefault(); run(inp.value); });
  var t; inp.addEventListener('input',function(){ clearTimeout(t); t=setTimeout(function(){run(inp.value)},180); });
  var m=/[?&]q=([^&]*)/.exec(location.search); run(m?decodeURIComponent(m[1].replace(/\+/g,' ')):'');
})();
</script>
</body>
</html>
