function entranceHtml(s,cls){
  var out='';
  if(s.voter_entrance){out+='<div class="row"><b>Entrance</b>'+esc(s.voter_entrance)+'</div>';}
  if(s.handicap_entrance && s.handicap_entrance!==s.voter_entrance){out+='<div class="row"><b>Accessible entrance</b>'+esc(s.handicap_entrance)+'</div>';}
  return out;
}

var pollIcon=function(){return L.divIcon({className:'poll-marker',html:'<div class="poll-pin"><span>&#9733;</span></div>',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]});};

var markers=[];
SITES.forEach(function(s,i){
  var pop='<div class="pop-name">'+esc(s.site_name)+'</div>'+
          '<div class="pop-addr">'+esc(s.address)+'</div>'+
          '<div class="pop-zip">'+esc(s.city)+', NY '+esc(s.zip_code)+'</div>'+
          '<div class="pop-ent">'+entranceHtml(s)+'</div>';
  var m=L.marker([s.lat,s.lon],{icon:pollIcon()}).addTo(map).bindPopup(pop);
  markers[i]=m;
});

// Directory
var grid=document.getElementById('dir-grid');
document.getElementById('dir-count').textContent=SITES.length+' sites';
SITES.forEach(function(s,i){
  var c=document.createElement('div');c.className='card';
  c.innerHTML='<h3>'+esc(s.site_name)+'</h3>'+
    '<div class="addr">'+esc(s.address)+'</div>'+
    '<div class="zip">'+esc(s.city)+', NY '+esc(s.zip_code)+'</div>'+
    '<div class="ent">'+entranceHtml(s)+'</div>';
  c.style.cursor='pointer';
  c.addEventListener('click',function(){
    map.setView([s.lat,s.lon],16,{animate:true});
    markers[i].openPopup();
    document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'});
  });
  grid.appendChild(c);
});
</script>
</body>
</html>
