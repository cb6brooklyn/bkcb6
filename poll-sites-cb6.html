<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#0d1b4b;color:#fff}
body{display:flex;flex-direction:column;min-height:100vh}

/* ── top bar ── */
.top-bar{background:#0d1b4b;border-bottom:3px solid #f47920;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-shrink:0}
.top-bar h1{font-size:.92rem;font-weight:700;color:#fff;white-space:nowrap;flex-shrink:0}
.top-bar h1 span{color:#f47920}
.back-link{font-size:.7rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.45);text-decoration:none;white-space:nowrap;margin-left:auto}
.back-link:hover{color:#f47920}

/* ── search bar ── */
.search-bar{background:#0d1b4b;padding:10px 14px 10px;display:flex;gap:7px;align-items:stretch;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.1)}
.search-bar input{flex:1;font-family:'DM Sans',sans-serif;font-size:.88rem;padding:9px 13px;border:none;border-radius:7px;background:rgba(255,255,255,.13);color:#fff;outline:none;min-width:0}
.search-bar input::placeholder{color:rgba(255,255,255,.4)}
.search-bar input:focus{background:rgba(255,255,255,.2)}
.search-bar button{padding:9px 18px;background:#f47920;color:#fff;border:none;border-radius:7px;font-family:'DM Sans',sans-serif;font-size:.84rem;font-weight:700;cursor:pointer;white-space:nowrap;flex-shrink:0}
.search-bar button:hover{background:#d4631a}
.search-bar button:disabled{background:rgba(255,255,255,.2);cursor:default}

/* ── result panel ── */
.result-bar{background:#0d1b4b;padding:0 14px;overflow:hidden;max-height:0;transition:max-height .25s ease,padding .25s ease;flex-shrink:0}
.result-bar.open{max-height:220px;padding:10px 14px 12px}
.result-inner{background:rgba(255,255,255,.07);border-left:4px solid #f47920;border-radius:0 8px 8px 0;padding:10px 14px}
.result-inner .r-addr{font-size:.78rem;color:rgba(255,255,255,.55);font-family:'DM Mono',monospace;margin-bottom:5px}
.result-inner .r-site{font-size:1rem;font-weight:700;color:#fff;margin-bottom:1px}
.result-inner .r-street{font-size:.86rem;font-weight:600;color:#f47920}
.result-inner .r-zip{font-size:.72rem;color:rgba(255,255,255,.5);font-family:'DM Mono',monospace;margin-bottom:7px}
.result-inner .r-ent{font-size:.77rem;color:rgba(255,255,255,.8);line-height:1.5}
.result-inner .r-ent b{font-family:'DM Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;color:#f47920;display:block;font-weight:500}
.result-inner .r-ent .row+.row{margin-top:4px}
.result-inner .r-ed{font-size:.62rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.3);margin-top:6px}
.result-error{font-size:.82rem;color:#fbbf24;padding:8px 0 4px}

/* ── map ── */
#map{flex:1;min-height:320px}

/* ── note bar ── */
.note-bar{padding:5px 14px;font-size:.65rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.3);background:#0d1b4b;flex-shrink:0}
.note-bar a{color:#f47920;text-decoration:none}

/* ── directory ── */
.dir-wrap{background:#fafaf8;color:#0d1b4b;padding:16px 14px 30px;flex-shrink:0}
.dir-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px;margin:0 auto 12px;max-width:1100px}
.dir-head h2{font-size:1.05rem;font-weight:900;color:#0d1b4b}
.dir-head .count{font-size:.72rem;font-family:'DM Mono',monospace;color:#f47920}
.dir-grid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:10px}
.card{background:#fff;border:1px solid #e5e2db;border-left:4px solid #f47920;border-radius:8px;padding:12px 14px;box-shadow:0 1px 4px rgba(13,27,75,.06);cursor:pointer;transition:box-shadow .12s}
.card:hover{box-shadow:0 3px 12px rgba(13,27,75,.14)}
.card.active{border-left-color:#0d1b4b;box-shadow:0 0 0 2px #0d1b4b}
.card h3{font-size:.92rem;font-weight:700;color:#0d1b4b;margin-bottom:2px}
.card .addr{font-size:.82rem;color:#333;font-weight:600}
.card .zip{font-size:.72rem;color:#888;font-family:'DM Mono',monospace;margin-bottom:7px}
.card .ent{font-size:.76rem;color:#444;line-height:1.45;margin-top:5px}
.card .ent b{font-family:'DM Mono',monospace;font-size:.62rem;text-transform:uppercase;letter-spacing:.05em;color:#f47920;display:block;margin-bottom:1px;font-weight:500}
.card .ent .row+.row{margin-top:5px}

/* ── leaflet popup ── */
.leaflet-popup-content{font-family:'DM Sans',sans-serif;margin:11px 13px;line-height:1.4}
.pop-name{font-size:.92rem;font-weight:700;color:#0d1b4b}
.pop-addr{font-size:.8rem;color:#333;font-weight:600;margin-top:1px}
.pop-zip{font-size:.7rem;color:#888;font-family:'DM Mono',monospace}
.pop-ent{font-size:.75rem;color:#444;line-height:1.4;margin-top:6px}
.pop-ent b{font-family:'DM Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.05em;color:#f47920;display:block;font-weight:500}
.pop-ent .row+.row{margin-top:4px}

/* ── markers ── */
.poll-marker{background:transparent;border:0}
.poll-pin{width:26px;height:26px;display:grid;place-items:center;border-radius:50% 50% 50% 0;background:#f47920;border:2px solid #fff;box-shadow:0 2px 6px rgba(13,27,75,.4);transform:rotate(-45deg);font-size:13px}
.poll-pin span{transform:rotate(45deg);line-height:1}
.addr-marker{background:transparent;border:0}
.addr-pin{width:22px;height:22px;display:grid;place-items:center;border-radius:50% 50% 50% 0;background:#0d1b4b;border:2px solid #fff;box-shadow:0 2px 6px rgba(13,27,75,.5);transform:rotate(-45deg);font-size:11px}
.addr-pin span{transform:rotate(45deg);line-height:1}
.cb6-boundary-label{background:transparent;border:0;pointer-events:none}
.cb6-boundary-label-text{display:inline-block;color:#f47920;font-family:'DM Sans',Arial,sans-serif;font-size:1.45rem;font-weight:900;letter-spacing:-.035em;line-height:1;text-shadow:-1.25px -1.25px 0 rgba(255,255,255,.95),1.25px -1.25px 0 rgba(255,255,255,.95),-1.25px 1.25px 0 rgba(255,255,255,.95),1.25px 1.25px 0 rgba(255,255,255,.95),0 2px 3px rgba(13,27,75,.16);white-space:nowrap}
</style>

var GEOCLIENT_KEY = 'b913bdfb9c47466589d0f08c99c75b21';

/* ── Map init ── */
var map = L.map('map',{scrollWheelZoom:true,zoomSnap:.25,zoomDelta:.25}).setView([40.6771,-73.992],13.5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);

var boundaryLayer = L.geoJSON(BOUNDARY,{style:{color:'#f47920',weight:3,fill:true,fillColor:'#f47920',fillOpacity:.06}}).addTo(map);
map.fitBounds(boundaryLayer.getBounds(),{padding:[24,24]});

/* boundary label */
try{
  var b=boundaryLayer.getBounds();
  L.marker([b.getNorth()-0.004,(b.getWest()+b.getEast())/2+0.012],{
    icon:L.divIcon({className:'cb6-boundary-label',html:'<div class="cb6-boundary-label-text">BKCB6</div>',iconSize:null,iconAnchor:[30,8]}),
    interactive:false
  }).addTo(map);
}catch(e){}

/* ── ED layer ── */
var activeEdLayer = null;
var edLayer = L.geoJSON(ED_DATA,{
  style:function(f){
    return {color:'#0d1b4b',weight:.6,fill:true,fillColor:'#0d1b4b',fillOpacity:.04};
  },
  onEachFeature:function(f,layer){
    var site=f.properties.site;
    var ed=f.properties.ed_label;
    if(!site){
      layer.bindPopup('<div class="pop-name">'+esc(ed)+'</div><div class="pop-addr" style="color:#888">No poll site assigned</div>');
      return;
    }
    var html=popupHtml(site,ed);
    layer.bindPopup(html,{maxWidth:280});
    layer.on('click',function(){highlightEd(layer,site);});
  }
}).addTo(map);

/* ── Poll site markers ── */
var siteMarkers = {};
var pollIcon = L.divIcon({className:'poll-marker',html:'<div class="poll-pin"><span>&#9733;</span></div>',iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24]});

CB6_SITES.forEach(function(s,i){
  if(!s.lat||!s.lon) return;
  var m=L.marker([s.lat,s.lon],{icon:pollIcon}).addTo(map);
  m.bindPopup(popupHtml(s),{maxWidth:280});
  siteMarkers[s.site_number]=m;
  siteMarkers[i]=m; // also by index for directory
});

/* ── Address search marker ── */
var addrMarker = null;
var addrIcon = L.divIcon({className:'addr-marker',html:'<div class="addr-pin"><span>&#x25cf;</span></div>',iconSize:[22,22],iconAnchor:[11,22],popupAnchor:[0,-20]});

/* ── Search ── */
var searchBtn = document.getElementById('search-btn');
var addrInput = document.getElementById('addr-input');
addrInput.addEventListener('keydown',function(e){if(e.key==='Enter') doSearch();});
searchBtn.addEventListener('click',doSearch);

function doSearch(){
  var raw=addrInput.value.trim();
  if(!raw) return;
  searchBtn.disabled=true;
  searchBtn.textContent='Searching…';
  /* Geoclient: try /address endpoint first */
  var parts=parseAddr(raw);
  var url='https://api.nyc.gov/geo/geoclient/v1/address.json?houseNumber='+encodeURIComponent(parts.num)+'&street='+encodeURIComponent(parts.street)+'&borough=Brooklyn&app_key='+GEOCLIENT_KEY;
  fetch(url).then(function(r){return r.json();}).then(function(data){
    var a=data.address;
    if(!a||((!a.latitude||!a.longitude)&&!a.latitudeInternalLabel)){
      showError('Address not found. Try a full street address within CB6.');
      resetBtn(); return;
    }
    var lat=parseFloat(a.latitude||a.latitudeInternalLabel);
    var lon=parseFloat(a.longitude||a.longitudeInternalLabel);
    onGeocode(raw,lat,lon);
    resetBtn();
  }).catch(function(){
    showError('Geocoder unavailable. Try again.');
    resetBtn();
  });
}

function onGeocode(rawAddr, lat, lon){
  /* drop address pin */
  if(addrMarker){map.removeLayer(addrMarker);}
  addrMarker=L.marker([lat,lon],{icon:addrIcon}).addTo(map);

  /* find ED by point-in-polygon */
  var found=null;
  ED_DATA.features.forEach(function(f){
    if(found) return;
    if(pointInGeoJSONFeature(lon,lat,f)) found=f;
  });

  if(!found){
    showError('That address isn\u2019t within CB6. Try an address in Park Slope, Carroll Gardens, Cobble Hill, Red Hook, Gowanus, or Columbia Street Waterfront.');
    map.setView([lat,lon],15,{animate:true});
    return;
  }

  var site=found.properties.site;
  if(!site){
    showResult(null, rawAddr, found.properties.ed_label);
    map.setView([lat,lon],15,{animate:true});
    return;
  }

  /* highlight ED polygon */
  if(activeEdLayer){map.removeLayer(activeEdLayer);}
  activeEdLayer=L.geoJSON(found,{style:{color:'#f47920',weight:2,fillColor:'#f47920',fillOpacity:.18}}).addTo(map);

  /* fly to site */
  map.setView([site.lat||lat, site.lon||lon],15,{animate:true});

  /* open site marker popup if we have a match */
  var sn=site.site_number;
  if(siteMarkers[sn]) siteMarkers[sn].openPopup();

  showResult(site, rawAddr, found.properties.ed_label);
  highlightCard(sn);
}

function showResult(site, rawAddr, edLabel){
  var bar=document.getElementById('result-bar');
  var inner=document.getElementById('result-inner');
  bar.classList.add('open');
  if(!site){
    inner.innerHTML='<div class="result-error">Election district '+esc(edLabel)+' has no poll site assigned in the BOE data.</div>';
    return;
  }
  var ve=site.voter_entrance; var he=site.handicap_entrance;
  var entHtml='';
  if(ve) entHtml+='<div class="row"><b>Entrance</b>'+esc(ve)+'</div>';
  if(he && he!==ve) entHtml+='<div class="row"><b>Accessible entrance</b>'+esc(he)+'</div>';
  inner.innerHTML=
    '<div class="r-addr">Your address: '+esc(rawAddr)+'</div>'+
    '<div class="r-site">'+esc(site.site_name)+'</div>'+
    '<div class="r-street">'+esc(site.address)+'</div>'+
    '<div class="r-zip">'+esc(site.city)+', NY '+esc(site.zip_code)+'</div>'+
    (entHtml?'<div class="r-ent">'+entHtml+'</div>':'')+
    '<div class="r-ed">'+esc(edLabel)+'</div>';
}

function showError(msg){
  var bar=document.getElementById('result-bar');
  var inner=document.getElementById('result-inner');
  bar.classList.add('open');
  inner.innerHTML='<div class="result-error">'+esc(msg)+'</div>';
  if(activeEdLayer){map.removeLayer(activeEdLayer);activeEdLayer=null;}
}

function resetBtn(){
  searchBtn.disabled=false;
  searchBtn.textContent='Find My Site';
}

/* ── Directory ── */
var cardEls={};
var grid=document.getElementById('dir-grid');
CB6_SITES.forEach(function(s,i){
  var c=document.createElement('div');c.className='card';
  var ve=s.voter_entrance; var he=s.handicap_entrance;
  var entHtml='';
  if(ve) entHtml+='<div class="row"><b>Entrance</b>'+esc(ve)+'</div>';
  if(he && he!==ve) entHtml+='<div class="row"><b>Accessible entrance</b>'+esc(he)+'</div>';
  c.innerHTML='<h3>'+esc(s.site_name)+'</h3>'+
    '<div class="addr">'+esc(s.address)+'</div>'+
    '<div class="zip">'+esc(s.city)+', NY '+esc(s.zip_code)+'</div>'+
    (entHtml?'<div class="ent">'+entHtml+'</div>':'');
  c.addEventListener('click',function(){
    if(s.lat&&s.lon){
      map.setView([s.lat,s.lon],15,{animate:true});
      if(siteMarkers[s.site_number]) siteMarkers[s.site_number].openPopup();
    }
    document.getElementById('map').scrollIntoView({behavior:'smooth',block:'start'});
  });
  cardEls[s.site_number]=c;
  grid.appendChild(c);
});

function highlightCard(siteNum){
  Object.values(cardEls).forEach(function(c){c.classList.remove('active');});
  if(cardEls[siteNum]) cardEls[siteNum].classList.add('active');
}

function highlightEd(layer, site){
  if(activeEdLayer){map.removeLayer(activeEdLayer);activeEdLayer=null;}
  // highlight handled via popup
  if(site && siteMarkers[site.site_number]) siteMarkers[site.site_number].openPopup();
  if(site) highlightCard(site.site_number);
}

/* ── Helpers ── */
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function popupHtml(site,edLabel){
  var ve=site.voter_entrance; var he=site.handicap_entrance;
  var entHtml='';
  if(ve) entHtml+='<div class="row"><b>Entrance</b>'+esc(ve)+'</div>';
  if(he && he!==ve) entHtml+='<div class="row"><b>Accessible entrance</b>'+esc(he)+'</div>';
  return '<div class="pop-name">'+esc(site.site_name)+'</div>'+
         '<div class="pop-addr">'+esc(site.address)+'</div>'+
         '<div class="pop-zip">'+esc(site.city)+', NY '+esc(site.zip_code)+'</div>'+
         (entHtml?'<div class="pop-ent">'+entHtml+'</div>':'')+
         (edLabel?'<div style="font-size:.62rem;color:#aaa;font-family:\'DM Mono\',monospace;margin-top:5px">'+esc(edLabel)+'</div>':'');
}

function parseAddr(raw){
  var m=raw.match(/^(\d+[A-Za-z]?)\s+(.+)/);
  if(m) return {num:m[1],street:m[2]};
  return {num:'',street:raw};
}

/* ── PiP (ray casting) ── */
function pointInGeoJSONFeature(lon,lat,feature){
  var geom=feature.geometry;
  if(geom.type==='Polygon') return pipPolygon(lon,lat,geom.coordinates);
  if(geom.type==='MultiPolygon'){
    return geom.coordinates.some(function(poly){return pipPolygon(lon,lat,poly);});
  }
  return false;
}
function pipPolygon(lon,lat,rings){
  return rings.some(function(ring,i){
    var inside=raycast(lon,lat,ring);
    if(i===0) return inside;
    return !inside; // holes
  });
}
function raycast(lon,lat,ring){
  var inside=false;
  for(var i=0,j=ring.length-1;i<ring.length;j=i++){
    var xi=ring[i][0],yi=ring[i][1];
    var xj=ring[j][0],yj=ring[j][1];
    var inter=((yi>lat)!==(yj>lat))&&(lon<(xj-xi)*(lat-yi)/(yj-yi)+xi);
    if(inter) inside=!inside;
  }
  return inside;
