<!DOCTYPE html>
<html lang="en"><head><meta name="apple-itunes-app" content="app-id=6813967208"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Every profile &mdash; bkcb6.app</title>
<meta name="description" content="Every organization, agency, elected official, school, park, facility and business with a profile on bkcb6.app, as a directory of logos to flip through.">
<link rel="canonical" href="https://bkcb6.app/profiles/">
<meta property="og:site_name" content="Brooklyn Community Board 6"><meta property="og:type" content="website">
<meta property="og:title" content="Every profile &mdash; bkcb6.app">
<meta property="og:description" content="Every organization, agency, elected official, school, park, facility and business with a profile on bkcb6.app.">
<meta property="og:url" content="https://bkcb6.app/profiles/">
<meta property="og:image" content="https://bkcb6.app/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920;--muted:#6b6760;--border:#e5e2db;--off:#f8f7f4}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',sans-serif;background:#fff;color:var(--navy)}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 40px}
.kick{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#6b6760;margin-bottom:6px}
h1{margin:0 0 8px;font-size:1.5rem;color:var(--navy);font-family:'DM Sans',sans-serif}
.lede{margin:0 0 16px;color:#4b5563;line-height:1.6;font-size:.95rem}
.search{display:flex;gap:8px;margin:0 0 12px}
.search input{flex:1;font:inherit;font-size:1rem;padding:11px 14px;border:1px solid #d6d3d1;border-radius:10px;color:var(--navy);background:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 10px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-size:.82rem;font-weight:700;padding:8px 13px;border-radius:999px;border:1px solid #d6d3d1;background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
.chips.sub .chip{font-weight:500;font-size:.78rem;padding:6px 11px}
.chips.sub .chip.on{background:var(--orange);border-color:var(--orange)}
.chips.where .chip.on{background:#0f766e;border-color:#0f766e}
.chips .lab{flex:0 0 auto;align-self:center;font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.ghead{grid-column:1/-1;margin:10px 0 0;font-family:'DM Mono',monospace;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);padding-bottom:6px}
.ghead:first-child{margin-top:0}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 12px;font-family:'DM Mono',monospace;font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.flip{display:flex;gap:8px}
.flip button{font:inherit;font-family:'DM Sans',sans-serif;font-size:.9rem;font-weight:700;letter-spacing:0;text-transform:none;padding:9px 16px;border-radius:10px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
.flip button:disabled{opacity:.3;cursor:default}
/* the tiles: exactly the Community-Based Organizations grid on gowanus.html */
.cbo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.cbo-tile{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;background:#fff;border:1px solid #d6d3d1;border-radius:12px;overflow:hidden;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.cbo-tile:hover,.cbo-tile:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);border-color:#a8a29e;outline:none}
.cbo-tile img{display:block;width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box}
@media (max-width:640px){.cbo-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
/* a profile with no logo: its name in the same tile */
.cbo-name{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;width:100%;height:100%;padding:14px;color:var(--navy);font-weight:800;font-size:1rem;line-height:1.2;overflow:hidden}
.cbo-name small{display:block;margin-top:8px;font-family:'DM Mono',monospace;font-weight:500;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
.foot{margin-top:18px}
</style>
</head><body><script src="/assets/site-bar.js?v=1" defer></script>
<div class="wrap">
  <div class="kick">bkcb6.app directory</div>
  <h1>Every profile</h1>
  <p class="lede">3,853 organizations, agencies, elected officials, schools, parks, facilities and businesses with a profile. Tap any logo to open its profile. Flip through a page at a time, pick a section, or search.</p>
  <div class="search"><input id="q" type="search" placeholder="Name, district (AD 44, CB6), agency, park or address" autocomplete="off" aria-label="Search the directory"></div>
  <div class="chips" id="groups" role="tablist" aria-label="Sections"></div>
  <div class="chips sub" id="topics" aria-label="Topics"></div>
  <div class="chips sub where" id="wheres" aria-label="Where"></div>
  <div class="bar"><span id="where"></span><span class="flip"><button type="button" id="prev" aria-label="Previous page">&lsaquo; Prev</button><button type="button" id="next" aria-label="Next page">Next &rsaquo;</button></span></div>
  <div class="cbo-grid" id="grid" aria-live="polite"></div>
  <div class="bar foot"><span id="where2"></span><span class="flip"><button type="button" id="prev2" aria-label="Previous page">&lsaquo; Prev</button><button type="button" id="next2" aria-label="Next page">Next &rsaquo;</button></span></div>
</div>
<script>
window.cboNoLogo = function (img) { var s = document.createElement('span'); s.className = 'cbo-name'; s.textContent = img.alt; img.replaceWith(s); };
(function () {
  var D = null, g = 0, t = -1, w = -1, p = 0, q = '', PER = 24;
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  // Search: every word typed has to match the start of a word in the name, the section, the kind, the borough or
  // neighborhood, the page address or the tile's keywords (district numbers, short forms such as AD 44, CM, CB6, BP, DA),
  // in any order. Names that match come first, then the rest; a section chip narrows the results.
  var gq = -1, IDX = null;
  var SYN = { cm: 'council', councilmember: 'council', councilman: 'council', councilwoman: 'council', am: 'assembly', assemblymember: 'assembly',
    assemblyman: 'assembly', assemblywoman: 'assembly', sen: 'senat', senator: 'senat', senate: 'senat', congressman: 'congress',
    congresswoman: 'congress', rep: 'congress', representative: 'congress', bk: 'brooklyn', bklyn: 'brooklyn', bx: 'bronx', mn: 'manhattan',
    qns: 'queens', si: 'staten', nyc: 'new york city', st: 'st', ave: 'avenue', av: 'avenue', pl: 'place', blvd: 'boulevard', pkwy: 'parkway',
    dept: 'department', doe: 'education', dot: 'transportation', dsny: 'sanitation', nypd: 'police', fdny: 'fire', hpd: 'housing preservation',
    dob: 'buildings', dep: 'environmental protection', dcp: 'city planning', mta: 'transportation authority', '&': 'and' };
  function norm(x) { return String(x || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/&/g, ' and ').replace(/['\u2019.]/g, '').replace(/[^a-z0-9]+/g, ' ').trim(); }
  function index() {
    IDX = D.tiles.map(function (x) {
      var G = D.groups[x[3]], wh = (x[6] || []).map(function (i) { return (G.where || [])[i] || ''; }).join(' ');
      var slug = String(x[1] || '').replace(/^https?:\/\/[^/]+/, '').replace(/\.html$/, '').replace(/[\/_-]+/g, ' ');
      return { n: ' ' + norm(x[0]) + ' ', k: ' ' + norm(x[7] || '') + ' ', h: ' ' + norm([x[0], G.name, G.topics[x[4]] || '', wh, slug, x[7] || ''].join(' ')) + ' ' };
    });
  }
  function words(qq) { return norm(qq).split(' ').filter(Boolean).map(function (w) { return SYN[w] ? norm(SYN[w]) : w; }); }
  // a word of one or two letters, or a number, has to be a whole word (DA, AD, 44); longer words can be the start of one
  function hit1(hay, w) { return w.length < 3 || /^\d+$/.test(w) ? hay.indexOf(' ' + w + ' ') > -1 : hay.indexOf(' ' + w) > -1; }
  function hits(hay, ws) { return ws.every(function (w) { return hit1(hay, w); }); }
  function found() {
    if (!IDX) index();
    var ws = words(q), qn = ' ' + norm(q);
    if (!ws.length) return [];
    var r = [];
    D.tiles.forEach(function (x, i) {
      var I = IDX[i];
      if (!hits(I.h, ws)) return;
      var sc = I.n === qn + ' ' ? 7 : I.n.indexOf(qn + ' ') === 0 ? 6 : I.n.indexOf(qn) === 0 ? 5 : ws.every(function (w) { return I.k.indexOf(' ' + w + ' ') > -1; }) ? 4.5 : I.n.indexOf(qn) > -1 ? 4 : hits(I.n, ws) ? 3 : 1;
      r.push([sc, i, x]);
    });
    r.sort(function (a, b) { return b[0] - a[0] || a[2][3] - b[2][3] || a[1] - b[1]; });
    return r.map(function (y) { return y[2]; });
  }
  function list() {
    if (q) { var F = found(); return gq < 0 ? F : F.filter(function (x) { return x[3] === gq; }); }
    return D.tiles.filter(function (x) { return x[3] === g && (t < 0 || x[4] === t) && (w < 0 || x[6].indexOf(w) > -1); });
  }
  // In the apps this page is served from the app's pack. Profiles the pack carries (scripts/directory_offline.py)
  // open from the pack, offline; every other profile opens the live page on bkcb6.app.
  var INAPP = !/^https?:$/.test(location.protocol);
  var PACKED = ['park', 'school', 'nypd-sector', 'biz', 'subway', 'citibike', 'library', 'firehouse', 'food-place', 'culture-place', 'poll-site', 'lift-site', 'childcare', 'vaccine-site', 'agencies'];
  function link(h) {
    if (!INAPP || !h || h.charAt(0) !== '/') return h;
    var seg = h.split('/')[1] || '';
    if (PACKED.indexOf(seg) > -1) return h.replace(/\/$/, '/index.html') + (h.indexOf('?') > -1 ? '&' : '?') + 'app=1&from=dir';
    return 'https://bkcb6.app' + h + (h.indexOf('?') > -1 ? '&' : '?') + 'app=1&from=dir';   // ?app=1: the live page drops the website's own bars
  }
  function tile(x) {
    var a = '<a class="cbo-tile" href="' + esc(link(x[1])) + '"' + (x[5] ? ' target="_blank" rel="noopener noreferrer"' : '') + ' aria-label="' + esc(x[0]) + '" title="' + esc(x[0]) + '">';
    var topic = D.groups[x[3]].topics[x[4]] || D.groups[x[3]].name;
    return a + (x[2] ? '<img src="' + esc(x[2]) + '" alt="' + esc(x[0]) + '" loading="lazy" onerror="cboNoLogo(this)">'
                      : '<span class="cbo-name">' + esc(x[0]) + '<small>' + esc(topic) + '</small></span>') + '</a>';
  }
  function chips() {
    var F = q ? found() : null;
    $('groups').innerHTML = (q ? '<button type="button" class="chip' + (gq < 0 ? ' on' : '') + '" data-g="-1">All results (' + F.length + ')</button>' : '') + D.groups.map(function (x, i) {
      var n = (F || D.tiles).filter(function (y) { return y[3] === i; }).length;
      if (q && !n) return '';
      return '<button type="button" class="chip' + ((q ? i === gq : i === g) ? ' on' : '') + '" data-g="' + i + '">' + esc(x.name) + ' (' + n + ')</button>';
    }).join('');
    var ts = D.groups[g].topics;
    $('topics').innerHTML = q || ts.length < 2 ? '' : ['<button type="button" class="chip' + (t < 0 ? ' on' : '') + '" data-t="-1">All</button>'].concat(ts.map(function (x, i) {
      return '<button type="button" class="chip' + (i === t ? ' on' : '') + '" data-t="' + i + '">' + esc(x) + '</button>';
    })).join('');
    var ws = D.groups[g].where || [];
    $('wheres').innerHTML = q || ws.length < 2 ? '' : ['<span class="lab">' + esc(D.groups[g].whereLabel) + '</span><button type="button" class="chip' + (w < 0 ? ' on' : '') + '" data-w="-1">All</button>'].concat(ws.map(function (x, i) {
      return '<button type="button" class="chip' + (i === w ? ' on' : '') + '" data-w="' + i + '">' + esc(x) + '</button>';
    })).join('');
  }
  function draw(keepScroll) {
    var L = list(), pages = Math.max(1, Math.ceil(L.length / PER));
    if (p >= pages) p = pages - 1; if (p < 0) p = 0;
    var last = null, h = '';
    L.slice(p * PER, p * PER + PER).forEach(function (x) {
      var k = x[3] + '.' + x[4];
      if (k !== last) { last = k; h += '<div class="ghead">' + esc((q ? D.groups[x[3]].name + ' · ' : '') + (D.groups[x[3]].topics[x[4]] || D.groups[x[3]].name) + (w > -1 && !q ? ' · ' + D.groups[g].where[w] : '')) + '</div>'; }
      h += tile(x);
    });
    $('grid').innerHTML = L.length ? h : '<div class="empty" style="grid-column:1/-1">Nothing matches.</div>';
    var lab = (q ? L.length + (gq > -1 ? ' in ' + D.groups[gq].name : '') + ' matching \u201c' + q + '\u201d' : (D.groups[g].name + (t > -1 ? ' · ' + D.groups[g].topics[t] : '') + (w > -1 ? ' · ' + D.groups[g].where[w] : '') + ' · ' + L.length)) + ' · page ' + (p + 1) + ' of ' + pages;
    $('where').textContent = lab; $('where2').textContent = 'Page ' + (p + 1) + ' of ' + pages;
    ['prev', 'prev2'].forEach(function (id) { $(id).disabled = p === 0; });
    ['next', 'next2'].forEach(function (id) { $(id).disabled = p >= pages - 1; });
    chips();
    try { history.replaceState(null, '', '#' + (q ? 'q=' + encodeURIComponent(q) : 'g=' + g + (t > -1 ? '&t=' + t : '') + (w > -1 ? '&w=' + w : '')) + (p ? '&p=' + (p + 1) : '')); } catch (e) {}
    if (!keepScroll) { var r = $('groups').getBoundingClientRect(); if (r.top < 0) window.scrollBy(0, r.top - 10); }
  }
  function flip(d) { p += d; draw(); }
  $('prev').onclick = $('prev2').onclick = function () { flip(-1); };
  $('next').onclick = $('next2').onclick = function () { flip(1); };
  $('groups').onclick = function (e) { var b = e.target.closest('[data-g]'); if (!b) return; if (q) { gq = +b.dataset.g; p = 0; draw(true); return; } g = +b.dataset.g; t = -1; w = -1; p = 0; draw(true); };
  $('topics').onclick = function (e) { var b = e.target.closest('[data-t]'); if (!b) return; t = +b.dataset.t; p = 0; draw(true); };
  $('wheres').onclick = function (e) { var b = e.target.closest('[data-w]'); if (!b) return; w = +b.dataset.w; p = 0; draw(true); };
  $('q').oninput = function () { q = this.value.trim(); gq = -1; p = 0; draw(true); };
  document.addEventListener('keydown', function (e) { if (e.target.tagName === 'INPUT') return; if (e.key === 'ArrowRight') flip(1); if (e.key === 'ArrowLeft') flip(-1); });
  var sx = null, sy = null;
  $('grid').addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  $('grid').addEventListener('touchend', function (e) {
    if (sx === null) return; var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy; sx = null;
    if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { var L = list(); if (dx < 0 && (p + 1) * PER < L.length) flip(1); else if (dx > 0 && p > 0) flip(-1); }
  }, { passive: true });
  fetch('/profiles/tiles.json?v=174789').then(function (r) { return r.json(); }).then(function (d) {
    D = d;
    var h = new URLSearchParams(location.hash.slice(1));
    if (h.get('q')) { q = h.get('q'); $('q').value = q; }
    if (h.get('g') && D.groups[+h.get('g')]) g = +h.get('g');
    if (h.get('t') && D.groups[g].topics[+h.get('t')] !== undefined) t = +h.get('t');
    if (h.get('w') && (D.groups[g].where || [])[+h.get('w')] !== undefined) w = +h.get('w');
    if (h.get('p')) p = (+h.get('p') || 1) - 1;
    draw(true);
  }).catch(function () { $('grid').innerHTML = '<div class="empty" style="grid-column:1/-1">The directory did not load. Check your connection and reload.</div>'; });
})();
</script>
</body></html>
