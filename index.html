<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CB6 & Beyond</title>
<meta name="description" content="Brooklyn Community Board 6 — Park Slope, Gowanus, Carroll Gardens, Red Hook, Cobble Hill, Columbia Street Waterfront District. Plus every Community Board across NYC.">

<link rel="icon" href="cb6-logo.png">
<link rel="apple-touch-icon" href="cb6-logo.png">

<meta property="og:site_name" content="CB6 & Beyond">
<meta property="og:title" content="CB6 & Beyond">
<meta property="og:description" content="Brooklyn Community Board 6 plus every Community Board across NYC.">
<meta property="og:image" content="https://bkcb6.app/og-cb6.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://bkcb6.app/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bkcb6.app/og-cb6.png">

<style>
  :root{
    --navy:#06024d;
    --orange:#f47920;
    --text:#fff;
    --muted:rgba(255,255,255,.65);
    color-scheme:only light;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{background-color:#06024d !important;min-height:100%}
  body{
    font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;
    background-color:#06024d !important;
    color:var(--text);
    min-height:100vh;
    width:100%;
    padding:14px 18px 40px;
    border:3px solid var(--orange);
    -webkit-font-smoothing:antialiased;
  }

  .hero-link{
    display:block;
    margin:0 0 26px;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.4);
    transition:transform .15s ease;
  }
  .hero-link:hover{transform:translateY(-2px)}
  .hero-link:active{transform:scale(.985)}
  .hero-link img{
    display:block;
    width:100%;
    height:auto;
  }

  .divider{
    height:3px;
    background:var(--orange);
    margin:0 0 16px;
  }
  .beyond-label{
    color:var(--orange);
    font-size:1.05rem;
    font-weight:800;
    letter-spacing:1.5px;
    margin-bottom:14px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    width:100%;
  }
  .boro-card{
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    cursor:pointer;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    transition:transform .15s ease;
    text-decoration:none;
    color:inherit;
    display:block;
  }
  .boro-card:hover{transform:translateY(-2px)}
  .boro-card:active{transform:scale(.97)}
  .boro-card img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  .action-block{
    margin-top:28px;
  }
  .action-block .divider{
    margin:0 0 26px;
  }
  .action-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:14px;
  }
  .action-row.single{
    grid-template-columns:1fr;
    max-width:calc(50% - 7px);
    margin-left:auto;
    margin-right:auto;
  }
  .action-btn{
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--orange);
    color:var(--navy);
    text-decoration:none;
    font-weight:800;
    font-size:1.4rem;
    letter-spacing:.5px;
    padding:18px 16px;
    border-radius:14px;
    box-shadow:0 4px 12px rgba(0,0,0,.3);
    transition:transform .15s ease;
    text-align:center;
  }
  .action-btn:hover{transform:translateY(-2px)}
  .action-btn:active{transform:scale(.97)}

  .footer{
    margin-top:40px;
    padding-top:20px;
    border-top:1px solid rgba(255,255,255,.12);
    text-align:center;
    color:var(--muted);
    font-size:.78rem;
    line-height:1.55;
    font-weight:500;
  }
  .footer .credit{
    color:#fff;
    font-weight:700;
    margin-top:6px;
  }

  @media(min-width:520px){
    body{max-width:480px;margin:0 auto;border-left:none;border-right:none}
  }
</style>
</head>
<body>

  <a class="hero-link" href="welcome.html">
    <img src="app-home/hero-button.png" alt="CB6 — Brooklyn Community Board 6">
  </a>

  <div class="divider"></div>
  <div class="beyond-label">&amp; BEYOND</div>

  <div class="grid">
    <a class="boro-card" href="https://bkcb6.app/brooklyn.html?v=2b15250#sec-cbgrid">
      <img src="app-home/btn-bk.png" alt="Brooklyn — 18 CB Districts">
    </a>
    <a class="boro-card" href="https://bkcb6.app/manhattan.html?v=2b15250#sec-cbgrid">
      <img src="app-home/btn-mn.png" alt="Manhattan — 12 CB Districts">
    </a>
    <a class="boro-card" href="https://bkcb6.app/queens.html?v=2b15250#sec-cbgrid">
      <img src="app-home/btn-qn.png" alt="Queens — 14 CB Districts">
    </a>
    <a class="boro-card" href="https://bkcb6.app/bronx.html?v=2b15250#sec-cbgrid">
      <img src="app-home/btn-bx.png" alt="The Bronx — 12 CB Districts">
    </a>
    <a class="boro-card" href="https://bkcb6.app/statenisland.html?v=2b15250#sec-cbgrid">
      <img src="app-home/btn-si.png" alt="Staten Island — 3 CB Districts">
    </a>
    <a class="boro-card" href="https://bkcb6.app/citywide-search.html?v=1#citywide-search-title">
      <img src="app-home/btn-nyc.png" alt="Citywide — 59 CB Districts">
    </a>
  </div>

  <div class="action-block">
    <div class="divider"></div>
    <div class="action-row">
      <a class="action-btn" href="glossary.html">Glossary</a>
      <a class="action-btn" href="landuse-review.html">Guides</a>
    </div>
    <div class="action-row single">
      <a class="action-btn" href="jeopardy-land-use.html">Games</a>
    </div>
  </div>

  <div class="footer">
    This app does not collect any data.
    <div class="credit">Designed by Mike Racioppo</div>
    <div style="margin-top:10px"><a href="privacy.html" style="color:rgba(255,255,255,.6);text-decoration:underline;font-size:.72rem">Privacy Policy</a></div>
  </div>

</body>
</html>
