<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Open space profile from New Yorkers for Parks &mdash; bkcb6.app</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>:root{color-scheme:light}body{margin:0;background:#f8f7f4;font-family:"DM Sans",sans-serif;color:#2b2a27}.w{padding:10px 12px 24px}.off{padding:16px;color:#6b6760}</style>
</head><body><div class="w" id="w"></div>
<script>
/* In the apps: ?cb=306 (a community board's borocd), ?cd=BK06 or ?cc=39. Images and numbers load from bkcb6.app. */
window.NY4P_BASE='https://bkcb6.app';
(function(){var q=new URLSearchParams(location.search),cd=q.get('cd'),cb=q.get('cb'),cc=q.get('cc');
if(cb){var b={1:'MN',2:'BX',3:'BK',4:'QN',5:'SI'}[cb.charAt(0)];if(b)cd=b+cb.slice(1);}
var w=document.getElementById('w');if(!cd&&!cc){w.innerHTML='<div class="off">No district given.</div>';return}
if(navigator.onLine===false){w.innerHTML='<div class="off">The profile loads from bkcb6.app and needs a connection.</div>';return}
var el=document.createElement('div');el.setAttribute('data-ny4p','');el.setAttribute('data-open','');if(cd)el.setAttribute('data-cd',cd);else el.setAttribute('data-cc',cc);w.appendChild(el);
var s=document.createElement('script');s.src='https://bkcb6.app/assets/ny4p-embed.js?v=20261114';document.body.appendChild(s);})();
</script></body></html>
