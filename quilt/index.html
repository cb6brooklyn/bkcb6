<!DOCTYPE html>
<html lang="en"><head><meta name="apple-itunes-app" content="app-id=6813967208"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Quilt &mdash; bkcb6.app</title>
<meta name="description" content="Every logo in the bkcb6.app Directory, stitched into one quilt. Tap a square and it pops out to its profile.">
<link rel="canonical" href="https://bkcb6.app/quilt/">
<meta property="og:site_name" content="Brooklyn Community Board 6"><meta property="og:type" content="website">
<meta property="og:title" content="The Quilt &mdash; bkcb6.app">
<meta property="og:description" content="Every logo in the Directory as one quilt. Tap a square to open its profile.">
<meta property="og:url" content="https://bkcb6.app/quilt/"><meta property="og:image" content="https://bkcb6.app/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920;--muted:#6b6760;--border:#e5e2db;--off:#f8f7f4;--sq:64px}
@media (max-width:640px){:root{--sq:46px}}
*{box-sizing:border-box}
body{margin:0;font-family:'DM Sans',sans-serif;background:var(--off);color:var(--navy)}
.wrap{max-width:1400px;margin:0 auto;padding:18px 16px 40px}
.kick{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
h1{margin:0 0 6px;font-size:1.6rem;font-weight:900}
.lede{margin:0 0 14px;color:#4b5563;line-height:1.5;font-size:.95rem;max-width:760px}
.panel{position:sticky;top:0;z-index:20;background:var(--off);padding:8px 0 10px;border-bottom:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.panel input{flex:1 1 220px;min-width:0;font:inherit;font-size:1rem;padding:10px 14px;border:1px solid #d6d3d1;border-radius:10px;color:var(--navy);background:#fff}
.panel select{flex:0 1 260px;font:inherit;font-size:.9rem;font-weight:700;padding:9px 10px;border:1px solid #d6d3d1;border-radius:10px;background:#fff;color:var(--navy)}
.btn{font:inherit;font-weight:800;font-size:.88rem;padding:9px 14px;border-radius:10px;border:1px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer;white-space:nowrap}
.btn.on{background:var(--navy);color:#fff}
.count{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:10px 0}
/* the quilt: squares edge to edge, each stitched with a dashed line inside its border */
.block{margin:0 0 18px}
.block h2{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--orange);margin:0 0 6px;font-weight:700}
.quilt{display:grid;grid-template-columns:repeat(auto-fill,var(--sq));justify-content:start;background:var(--navy);padding:6px;border-radius:8px;gap:0}
.sq{position:relative;width:var(--sq);height:var(--sq);padding:0;border:0;background:#fff;cursor:pointer;outline:2px solid var(--navy);outline-offset:-1px;transition:transform .15s ease,box-shadow .15s ease;z-index:0}
.sq:after{content:"";position:absolute;inset:3px;border:1px dashed rgba(13,27,75,.28);border-radius:2px;pointer-events:none}
.sq img{width:100%;height:100%;object-fit:contain;display:block;padding:5px}
.sq:hover,.sq:focus-visible{transform:scale(1.9);z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.35);outline-color:var(--orange)}
.empty{padding:30px;text-align:center;color:var(--muted)}
.more{display:none;margin:12px auto;}
/* the pop out */
.veil{position:fixed;inset:0;background:rgba(13,27,75,.55);z-index:100000;opacity:0;transition:opacity .25s ease;pointer-events:none}
.veil.on{opacity:1;pointer-events:auto}
.fly{position:fixed;z-index:100001;background:#fff;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.fly img.logo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:8px;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.card{position:fixed;z-index:100002;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,94vw);height:min(86vh,900px);background:#fff;border-radius:16px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:none;flex-direction:column;overflow:hidden}
.card.on{display:flex}
.card .top{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:3px solid var(--orange);background:var(--navy);color:#fff}
.card .top img{width:44px;height:44px;object-fit:contain;background:#fff;border-radius:8px;padding:3px}
.card .top b{flex:1;font-size:1.05rem;font-weight:800;line-height:1.2}
.card .top a,.card .top button{font:inherit;font-size:.8rem;font-weight:800;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.6);border-radius:8px;padding:6px 10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.card iframe{flex:1;border:0;width:100%}
.credit{margin-top:26px;text-align:center;font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.04em;color:#8a8a99}
</style>
</head><body><script src="/assets/site-bar.js?v=1" defer></script>
<a id="asb" href="https://apps.apple.com/us/app/bkcb6/id6813967208" target="_blank" rel="noopener" style="display:block;background:#0d1b4b;text-align:center;padding:8px 0;line-height:0;text-decoration:none"><img src="/appstore-badge.png" alt="Download BKCB6 on the App Store" width="121" height="40" style="height:40px;width:auto;border:0;display:inline-block"></a><script>(function(){try{var a=document.getElementById("asb"),q=/[?&]app=1\b/.test(location.search);if(q)sessionStorage.setItem("bkapp","1");if(location.protocol==="bkcb:"||q||sessionStorage.getItem("bkapp")==="1"||/^bkcb:/.test(document.referrer)){a.style.display="none"}}catch(e){}})();</script>
<div class="wrap">
<div class="kick">bkcb6.app &middot; <a href="/profiles/" style="color:inherit">The Directory</a></div>
<h1>The Quilt</h1>
<p class="lede" id="lede">Every logo in the Directory, stitched together. Tap a square and it pops out to its profile.</p>
<div class="panel">
 <input id="q" type="search" placeholder="Search names" autocomplete="off">
 <select id="sec"><option value="">Every section</option></select>
 <button class="btn on" id="bysec" type="button">By section</button>
 <button class="btn" id="mix" type="button">Mixed</button>
</div>
<div class="count" id="count"></div>
<div id="out"></div>
<button class="btn more" id="more" type="button"></button>
<div class="credit">Designed and developed by Mike Racioppo</div>
</div>
<div class="veil" id="veil"></div>
<div class="card" id="card" role="dialog" aria-modal="true"><div class="top"><img id="cimg" alt=""><b id="cname"></b><a id="copen" href="#" target="_blank" rel="noopener">Full page</a><button id="cclose" type="button">Close</button></div><iframe id="cframe" title="Profile"></iframe></div>
<script>
const $=id=>document.getElementById(id);
const ICON=c=>'/app/data/civic/icons/'+c+'.png';
let D,E=[],mode='sec',shown=0;const PAGE=2400;
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function shuffle(a){const r=a.slice();let s=20261115;for(let i=r.length-1;i>0;i--){s=(s*1103515245+12345)%2147483648;const j=s%(i+1);[r[i],r[j]]=[r[j],r[i]]}return r}
function list(){
 const q=$('q').value.trim().toLowerCase(),sec=$('sec').value;
 return E.filter(e=>(sec===''||e.ss.includes(+sec))&&(!q||e.n.toLowerCase().includes(q)))}
function sq(e){return '<button class="sq" type="button" data-i="'+e.i+'" title="'+esc(e.n)+'"><img loading="lazy" decoding="async" src="'+ICON(e.c)+'" alt="'+esc(e.n)+'"></button>'}
function draw(reset){
 const r=list();if(reset)shown=PAGE;
 $('count').textContent=r.length.toLocaleString()+' squares';
 let h='';
 if(mode==='sec'){
  let left=shown;const sec=$('sec').value;
  D.sections.forEach((s,si)=>{if(left<=0)return;const b=r.filter(e=>sec!==''?true:e.s===si);if(sec!==''&&String(si)!==sec)return;if(!b.length)return;const part=b.slice(0,left);left-=part.length;
   h+='<div class="block"><h2>'+esc(s.n)+' &middot; '+b.length.toLocaleString()+'</h2><div class="quilt">'+part.map(sq).join('')+'</div></div>'});
 }else{h='<div class="quilt">'+shuffle(r).slice(0,shown).map(sq).join('')+'</div>'}
 $('out').innerHTML=r.length?h:'<div class="empty">Nothing matches.</div>';
 const m=$('more');if(r.length>shown){m.style.display='block';m.textContent='Show more ('+(r.length-shown).toLocaleString()+' left)'}else m.style.display='none'}
// the pop out: the square lifts off the quilt, grows to the middle of the screen, then opens into its profile
function pop(btn){
 const e=E[+btn.dataset.i],r=btn.getBoundingClientRect();
 const fly=document.createElement('div');fly.className='fly';
 Object.assign(fly.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
 fly.innerHTML='<img class="logo" src="'+ICON(e.c)+'" alt="">';document.body.appendChild(fly);
 $('veil').classList.add('on');
 const big=Math.min(260,window.innerWidth*.6);
 requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(fly.style,{left:(window.innerWidth-big)/2+'px',top:(window.innerHeight-big)/2+'px',width:big+'px',height:big+'px',borderRadius:'18px'})));
 setTimeout(()=>{
  $('cimg').src=ICON(e.c);$('cname').textContent=e.n;$('copen').href=e.h;$('cframe').src=e.h+(e.h.includes('?')?'&':'?')+'app=1';
  $('card').classList.add('on');fly.style.opacity='0';setTimeout(()=>fly.remove(),250)},420);
 history.replaceState(null,'','#'+encodeURIComponent(e.h));
}
function close(){$('card').classList.remove('on');$('veil').classList.remove('on');$('cframe').src='about:blank';history.replaceState(null,'',location.pathname)}
$('out').addEventListener('click',ev=>{const b=ev.target.closest('.sq');if(b)pop(b)});
$('veil').onclick=close;$('cclose').onclick=close;document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close()});
$('q').oninput=()=>draw(true);$('sec').onchange=()=>draw(true);
$('bysec').onclick=()=>{mode='sec';$('bysec').classList.add('on');$('mix').classList.remove('on');draw(true)};
$('mix').onclick=()=>{mode='mix';$('mix').classList.add('on');$('bysec').classList.remove('on');draw(true)};
$('more').onclick=()=>{shown+=PAGE;draw(false)};
fetch('/profiles/dir.json').then(r=>r.json()).then(d=>{D=d;
 // every profile with a logo of its own (not a lettered placeholder); a profile listed in several sections keeps its first
 const seen=new Set();
 d.E.forEach(x=>{if(String(x[2]).startsWith('dir-k-')||seen.has(x[1]))return;seen.add(x[1]);const ss=[...new Set(x[3].map(v=>Math.floor(v/1000)))];E.push({i:E.length,n:x[0],h:x[1],c:x[2],s:ss.length?Math.min(...ss):-1,ss})});
 d.sections.forEach((s,i)=>{if(E.some(e=>e.ss.includes(i))){const o=document.createElement('option');o.value=i;o.textContent=s.n;$('sec').appendChild(o)}});
 $('lede').textContent='All '+E.length.toLocaleString()+' logos in the Directory, stitched together. Tap a square and it pops out to its profile.';
 draw(true);
 const h=decodeURIComponent(location.hash.slice(1));if(h){const i=E.findIndex(e=>e.h===h);if(i>=0){const b=document.querySelector('.sq[data-i="'+i+'"]');if(b){b.scrollIntoView({block:'center'});setTimeout(()=>pop(b),300)}}}
});
</script>
</body></html>
