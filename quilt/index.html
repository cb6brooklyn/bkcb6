<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Quilt &mdash; bkcb6.app</title>
<meta name="description" content="Every logo in the bkcb6.app Directory as one quilt. Tap a square to open its profile.">
<link rel="canonical" href="https://bkcb6.app/quilt/">
<meta property="og:title" content="The Quilt &mdash; bkcb6.app"><meta property="og:url" content="https://bkcb6.app/quilt/"><meta property="og:image" content="https://bkcb6.app/og-image.png">
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#fff}
.quilt{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:0}
@media (max-width:640px){.quilt{grid-template-columns:repeat(4,1fr)}}
.sq{display:block;width:100%;min-width:0;aspect-ratio:1;padding:0;margin:0;border:0;background:#fff;cursor:pointer;overflow:hidden;position:relative}
/* each tile picture has a white margin around its frame: cropped off so the frames touch */
.sq img{position:absolute;left:-5.3%;top:-5.3%;width:110.6%;height:110.6%;object-fit:cover;display:block}
.veil{position:fixed;inset:0;background:rgba(13,27,75,.55);z-index:100000;opacity:0;transition:opacity .25s ease;pointer-events:none}
.veil.on{opacity:1;pointer-events:auto}
.fly{position:fixed;z-index:100001;background:#fff;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden;transition:all .35s cubic-bezier(.2,.8,.2,1)}
.fly img{position:absolute;left:-5.3%;top:-5.3%;width:110.6%;height:110.6%;object-fit:cover;display:block}
.card{position:fixed;z-index:100002;left:50%;top:50%;transform:translate(-50%,-50%);width:min(980px,94vw);height:min(88vh,900px);background:#fff;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.4);display:none;overflow:hidden}
.card.on{display:block}
.card iframe{border:0;width:100%;height:100%}
.x{position:absolute;top:8px;right:8px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(13,27,75,.85);color:#fff;font:700 20px/36px sans-serif;cursor:pointer}
</style>
</head><body>
<div class="quilt" id="quilt"></div>
<div class="veil" id="veil"></div>
<div class="card" id="card" role="dialog" aria-modal="true"><button class="x" id="x" type="button" aria-label="Close">&times;</button><iframe id="frame" title="Profile"></iframe></div>
<script>
const $=id=>document.getElementById(id);
const ICON=c=>'/app/data/civic/icons/'+c+'.png';
const E=[];
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function pop(b){
 const e=E[+b.dataset.i],r=b.getBoundingClientRect(),fly=document.createElement('div');fly.className='fly';
 Object.assign(fly.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});
 fly.innerHTML='<img src="'+ICON(e.c)+'" alt="">';document.body.appendChild(fly);$('veil').classList.add('on');
 const big=Math.min(280,window.innerWidth*.6);
 requestAnimationFrame(()=>requestAnimationFrame(()=>Object.assign(fly.style,{left:(innerWidth-big)/2+'px',top:(innerHeight-big)/2+'px',width:big+'px',height:big+'px',borderRadius:'14px'})));
 setTimeout(()=>{$('frame').src=e.h+(e.h.includes('?')?'&':'?')+'app=1';$('card').classList.add('on');fly.style.opacity='0';setTimeout(()=>fly.remove(),250)},420)}
function close(){$('card').classList.remove('on');$('veil').classList.remove('on');$('frame').src='about:blank'}
$('quilt').addEventListener('click',ev=>{const b=ev.target.closest('.sq');if(b)pop(b)});
$('veil').onclick=close;$('x').onclick=close;document.addEventListener('keydown',ev=>{if(ev.key==='Escape')close()});
fetch('/profiles/dir.json').then(r=>r.json()).then(d=>{
 const seen=new Set();
 d.E.forEach(x=>{if(String(x[2]).startsWith('dir-k-')||seen.has(x[1]))return;seen.add(x[1]);E.push({n:x[0],h:x[1],c:x[2]})});
 $('quilt').innerHTML=E.map((e,i)=>'<button class="sq" type="button" data-i="'+i+'" title="'+esc(e.n)+'"><img loading="lazy" decoding="async" src="'+ICON(e.c)+'" alt="'+esc(e.n)+'"></button>').join('');
});
</script>
</body></html>
