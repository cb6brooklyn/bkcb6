<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Manhattan CB4 — Election Districts — bkcb6.app</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#0d1b4b;color:#fff}
body{display:flex;flex-direction:column}
.top-bar{background:#0d1b4b;border-bottom:3px solid #f47920;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;flex-shrink:0}
.top-bar h1{font-size:.95rem;font-weight:700;color:#fff;white-space:nowrap}
.top-bar h1 span{color:#f47920}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1}
.map-btn{padding:5px 11px;font-size:.72rem;font-family:'DM Sans',sans-serif;font-weight:600;border:1px solid rgba(255,255,255,.3);border-radius:20px;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s;white-space:nowrap}
.map-btn:hover{border-color:#fff;color:#fff}
.map-btn.active{background:#f47920;color:#fff;border-color:#f47920}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.li{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:rgba(255,255,255,.8)}
.ls{width:11px;height:11px;border-radius:2px;display:inline-block;flex-shrink:0}
.lg{width:46px;height:11px;border-radius:2px;display:inline-block;flex-shrink:0}
.leg-label{font-size:.6rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);margin-right:4px}
#map{flex:1;min-height:0}
.back-link{font-size:.72rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.5);text-decoration:none;white-space:nowrap}
.back-link:hover{color:#f47920}
.source{font-size:.65rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.35);padding:4px 16px;flex-shrink:0;background:#0d1b4b}
</style>
</head>
<body>
<div class="top-bar">
  <h1>Manhattan <span>CB4</span> — Election Districts</h1>
  <div class="controls">
    <button class="map-btn active" onclick="setMode('mayor',this)">Mayor</button>
    <button class="map-btn" onclick="setMode('q2',this)">Q2</button>
    <button class="map-btn" onclick="setMode('q3',this)">Q3</button>
    <button class="map-btn" onclick="setMode('q4',this)">Q4</button>
  </div>
  <a class="back-link" href="javascript:history.back()">← Back</a>
</div>
<div class="search-row" style="display:flex;gap:6px;align-items:center;padding:8px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;position:relative">
  <input id="addr" type="text" placeholder="Search an address to find its Election District…" autocomplete="off"
    style="flex:1;font-family:'DM Sans',sans-serif;font-size:.8rem;padding:7px 11px;border:none;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;outline:none"
    onkeydown="if(event.key==='Enter')edSearch()"/>
  <button onclick="edSearch()" style="padding:7px 14px;background:#f47920;color:#fff;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap">Search</button>
  <button onclick="edLocate()" title="Use my location" style="padding:7px 11px;background:transparent;color:rgba(255,255,255,.75);border:1px solid rgba(255,255,255,.3);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;white-space:nowrap">📍</button>
  <button onclick="edClear()" id="ed-clear" style="display:none;padding:7px 10px;background:transparent;color:rgba(255,255,255,.6);border:1px solid rgba(255,255,255,.3);border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.8rem;cursor:pointer;white-space:nowrap">Clear</button>
</div>
<div class="legend" id="legend"></div>
<div id="map"></div>
<div class="source">Source: NYC Board of Elections, 2025 General Election &nbsp;|&nbsp; Shading intensity = margin of victory &nbsp;|&nbsp; bkcb6.app</div>
<script>
var map = L.map('map', {scrollWheelZoom:true}).setView([40.71,-73.95], 12);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png',{attribution:'&copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);
var labelPane=map.createPane('labels');labelPane.style.zIndex=650;labelPane.style.pointerEvents='none';
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_only_labels/{z}/{x}/{y}{r}.png',{subdomains:'abcd',maxZoom:19,pane:'labels'}).addTo(map);

var mode='mayor', geoLayer=null, labelGroup=null, data=null;
var NODATA='#d4d0c8';

// base hues
var H={ mamdani:'#0d1b4b', cuomo:'#f47920', sliwa:'#cc0000', yes:'#0d1b4b', no:'#f47920' };

function lerp(hex,t){ // blend toward white as t->0 (t in 0..1 = intensity)
  var r=parseInt(hex.substr(1,2),16),g=parseInt(hex.substr(3,2),16),b=parseInt(hex.substr(5,2),16);
  var f=0.30+0.70*t; // floor so faint wins still visible
  r=Math.round(255-(255-r)*f); g=Math.round(255-(255-g)*f); b=Math.round(255-(255-b)*f);
  return 'rgb('+r+','+g+','+b+')';
}

var MODE_META={
  mayor:{winner:'general_mayor_winner',text:'general_mayor',label:'2025 General — Mayor'},
  q2:{winner:'question_2_winner',text:'question_2',label:'2025 General — Q2: Fast-Track Affordable Housing'},
  q3:{winner:'question_3_winner',text:'question_3',label:'2025 General — Q3: Simplify Housing & Infrastructure Review'},
  q4:{winner:'question_4_winner',text:'question_4',label:'2025 General — Q4: Affordable Housing Appeals Board'}
};

function getFill(p){
  if(mode==='mayor'){
    var w=(p.general_mayor_winner||'').toLowerCase();
    var m=p.mayor_margin; var t=(m==null)?0.5:Math.max(0,Math.min(1,m/60));
    if(w.indexOf('mamdani')>=0) return lerp(H.mamdani,t);
    if(w.indexOf('cuomo')>=0)   return lerp(H.cuomo,t);
    if(w.indexOf('sliwa')>=0)   return lerp(H.sliwa,t);
    return NODATA;
  } else {
    var q=mode.charAt(1); var w2=(p['question_'+q+'_winner']||'').toLowerCase();
    var y=p['q'+q+'_yes']; // Yes share
    if(w2===''){return NODATA;}
    var marg, base;
    if(w2.indexOf('yes')>=0||w2.indexOf('approve')>=0){ base=H.yes; marg=(y==null?50:y)-50; }
    else { base=H.no; marg=50-(y==null?50:y); }
    var t=Math.max(0,Math.min(1,Math.abs(marg)/40));
    return lerp(base,t);
  }
}

function getTooltip(p){
  var meta=MODE_META[mode];
  return '<div style="font-family:DM Sans,sans-serif;max-width:270px">'+
    '<div style="font-weight:700;font-size:.88rem;color:#0d1b4b;border-bottom:2px solid #f47920;padding-bottom:4px;margin-bottom:7px">'+(p.popup_title||p.ed_label||('ED '+p.elect_dist))+'</div>'+
    '<div style="font-size:.72rem;color:#888;font-weight:600;margin-bottom:4px">'+meta.label+'</div>'+
    '<div style="font-size:.78rem;color:#222;line-height:1.45">'+(p[meta.text]||'No results reported for this district.')+'</div>'+
    '</div>';
}

function drawLayer(){
  if(geoLayer)map.removeLayer(geoLayer);
  if(labelGroup)map.removeLayer(labelGroup);
  labelGroup=L.layerGroup();
  geoLayer=L.geoJSON(data,{
    style:function(f){return {fillColor:getFill(f.properties),fillOpacity:0.82,color:'#fff',weight:1.3};},
    onEachFeature:function(f,lyr){
      lyr.bindTooltip(getTooltip(f.properties),{sticky:true,opacity:1,maxWidth:280});
      lyr.on('mouseover',function(){lyr.setStyle({fillOpacity:.95,weight:2.5,color:'#0d1b4b'});});
      lyr.on('mouseout',function(){geoLayer.resetStyle(lyr);});
      var c=lyr.getBounds().getCenter();
      var sl=(f.properties.ed_label||'').replace(/AD \d+ ED /,'ED ');
      L.marker(c,{icon:L.divIcon({className:'',html:'<div style="font-size:9px;font-family:DM Mono,monospace;color:#fff;text-shadow:0 0 3px rgba(0,0,0,.9),0 0 3px rgba(0,0,0,.9);font-weight:700;white-space:nowrap;line-height:1">'+sl+'</div>',iconAnchor:[16,6]}),interactive:false}).addTo(labelGroup);
    }
  }).addTo(map);
  map.fitBounds(geoLayer.getBounds(),{padding:[20,20]});
  refreshLabels();
}
var LABEL_ZOOM=14;
function refreshLabels(){
  if(!labelGroup)return;
  if(map.getZoom()>=LABEL_ZOOM){ if(!map.hasLayer(labelGroup))labelGroup.addTo(map); }
  else { if(map.hasLayer(labelGroup))map.removeLayer(labelGroup); }
}
map.on("zoomend",refreshLabels);

function updateLegend(){
  var html='';
  if(mode==='mayor'){
    html='<span class="leg-label">Winner · darker = bigger margin</span>'+
      '<span class="li"><span class="lg" style="background:linear-gradient(90deg,'+lerp(H.mamdani,0.1)+','+lerp(H.mamdani,1)+')"></span>Mamdani</span>'+
      '<span class="li"><span class="lg" style="background:linear-gradient(90deg,'+lerp(H.cuomo,0.1)+','+lerp(H.cuomo,1)+')"></span>Cuomo</span>'+
      '<span class="li"><span class="ls" style="background:'+H.sliwa+'"></span>Sliwa</span>'+
      '<span class="li"><span class="ls" style="background:'+NODATA+'"></span>No data</span>';
  } else {
    html='<span class="leg-label">Winner · darker = bigger margin</span>'+
      '<span class="li"><span class="lg" style="background:linear-gradient(90deg,'+lerp(H.yes,0.1)+','+lerp(H.yes,1)+')"></span>Yes / Approve</span>'+
      '<span class="li"><span class="lg" style="background:linear-gradient(90deg,'+lerp(H.no,0.1)+','+lerp(H.no,1)+')"></span>No / Disapprove</span>'+
      '<span class="li"><span class="ls" style="background:'+NODATA+'"></span>No data</span>';
  }
  document.getElementById('legend').innerHTML=html;
}

function setMode(m,btn){mode=m;document.querySelectorAll('.map-btn').forEach(function(b){b.classList.remove('active');});btn.classList.add('active');if(data){drawLayer();updateLegend();}}

// ---- CB label (clearer CB identification on the map) ----
var CB_NAME='Manhattan CB4';
var cbLabel=null;
function drawCBOutline(){
  try{
    if(cbLabel)map.removeLayer(cbLabel);
    var b=geoLayer.getBounds();
    var c=b.getCenter();
    (function(){
      if(window._cbBadge){try{map.removeControl(window._cbBadge);}catch(e){}}
      var Badge=L.Control.extend({options:{position:'topright'},onAdd:function(){
        var d=L.DomUtil.create('div','');
        d.style.cssText='font-family:DM Sans,sans-serif;font-weight:800;font-size:.95rem;color:#0d1b4b;background:rgba(255,255,255,.94);border:2px solid #f47920;border-radius:7px;padding:3px 10px;white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.25);margin-top:6px;pointer-events:none';
        d.textContent=CB_NAME; return d;
      }});
      window._cbBadge=new Badge(); map.addControl(window._cbBadge);
    })();
  }catch(e){}
}
function ptInRing(pt,ring){var x=pt[0],y=pt[1],inside=false;for(var i=0,j=ring.length-1;i<ring.length;j=i++){var xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];var hit=((yi>y)!=(yj>y))&&(x<(xj-xi)*(y-yi)/(yj-yi)+xi);if(hit)inside=!inside;}return inside;}
function ptInFeature(pt,geom){if(geom.type==="Polygon"){if(!ptInRing(pt,geom.coordinates[0]))return false;for(var h=1;h<geom.coordinates.length;h++){if(ptInRing(pt,geom.coordinates[h]))return false;}return true;}if(geom.type==="MultiPolygon"){for(var p=0;p<geom.coordinates.length;p++){var poly=geom.coordinates[p];if(ptInRing(pt,poly[0])){var inHole=false;for(var hh=1;hh<poly.length;hh++){if(ptInRing(pt,poly[hh]))inHole=true;}if(!inHole)return true;}}}return false;}
function findED(lng,lat){if(!data)return null;for(var i=0;i<data.features.length;i++){if(ptInFeature([lng,lat],data.features[i].geometry))return data.features[i];}return null;}
var searchMarker=null;
function edClear(){if(searchMarker){map.removeLayer(searchMarker);searchMarker=null;}document.getElementById("addr").value="";document.getElementById("ed-clear").style.display="none";if(geoLayer)map.fitBounds(geoLayer.getBounds(),{padding:[20,20]});}
async function edSearch(){var addr=document.getElementById("addr").value.trim();if(!addr)return;var lat=null,lng=null,lbl=addr;try{var r=await fetch("https://geosearch.planninglabs.nyc/v2/search?text="+encodeURIComponent(addr+" Manhattan New York")+"&size=1");var d=await r.json();if(d.features&&d.features.length){lng=d.features[0].geometry.coordinates[0];lat=d.features[0].geometry.coordinates[1];lbl=(d.features[0].properties||{}).label||addr;}}catch(e){}if(lat==null){alert("Address not found. Try including the street number.");return;}showEDResult(lat,lng,lbl);}
function edLocate(){if(!navigator.geolocation){alert("Location is not available on this device.");return;}navigator.geolocation.getCurrentPosition(function(pos){showEDResult(pos.coords.latitude,pos.coords.longitude,"Your location");},function(){alert("Could not get your location. You can type an address instead.");},{enableHighAccuracy:true,timeout:8000});}
function showEDResult(lat,lng,lbl){if(searchMarker)map.removeLayer(searchMarker);searchMarker=L.circleMarker([lat,lng],{radius:8,fillColor:"#f47920",color:"#fff",weight:2.5,fillOpacity:1,zIndexOffset:5000}).addTo(map);map.setView([lat,lng],15);document.getElementById("ed-clear").style.display="";var ed=findED(lng,lat);var meta=MODE_META[mode];var html;if(ed){var p=ed.properties;html='<div style="font-family:DM Sans,sans-serif;max-width:270px">'+'<div style="font-weight:700;font-size:.8rem;color:#0d1b4b;margin-bottom:2px">'+escapeH(lbl)+'</div>'+'<div style="font-weight:700;font-size:.86rem;color:#0d1b4b;border-bottom:2px solid #f47920;padding-bottom:4px;margin-bottom:7px">'+(p.popup_title||p.ed_label||("ED "+p.elect_dist))+'</div>'+'<div style="font-size:.72rem;color:#888;font-weight:600;margin-bottom:4px">'+meta.label+'</div>'+'<div style="font-size:.78rem;color:#222;line-height:1.45">'+(p[meta.text]||"No results reported for this district.")+'</div>'+'</div>';}else{html='<div style="font-family:DM Sans,sans-serif;max-width:240px"><div style="font-weight:700;font-size:.8rem;color:#0d1b4b">'+escapeH(lbl)+'</div><div style="font-size:.76rem;color:#c81e1e;margin-top:4px">This location falls outside '+CB_NAME+'.</div></div>';}searchMarker.bindPopup(html,{maxWidth:280}).openPopup();}
function escapeH(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}

fetch('data/mn-cb4-ed.geojson').then(function(r){return r.json();}).then(function(d){data=d;drawLayer();drawCBOutline();updateLegend();});
</script>
</body>
</html>
