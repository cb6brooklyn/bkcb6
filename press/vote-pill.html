<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voting today</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;height:100%;background:#f8f7f4;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:'DM Sans',-apple-system,system-ui,sans-serif}
#pill{display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px);box-sizing:border-box;padding:8px 18px 8px 12px;border-radius:999px;background:#0d1b4b;color:#fff;text-decoration:none;border:2px solid #f47920;-webkit-tap-highlight-color:transparent}
#pill.closed{background:#fff;color:#0d1b4b}
img{width:34px;height:34px;border-radius:50%;flex:none}
.t{display:flex;flex-direction:column;min-width:0}
.l1{font-weight:700;font-size:15px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l2{font-weight:500;font-size:12.5px;line-height:1.25;color:#f9b98a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#pill.closed .l2{color:#c4560c}
.hide{display:none}
</style>
</head><body>
<a id="pill" class="hide" href="https://bkcb6.app/elections.html"><img src="https://bkcb6.app/voted-bkcb6-2026.png" alt=""><span class="t"><span class="l1" id="l1"></span><span class="l2" id="l2"></span></span></a>
<script>
// The schedule is the app's own election file (civic/november2026.json, earlyVoting.days); the copy below is used only when it can't be read.
var DAYS=[["2026-10-24",9,17],["2026-10-25",9,17],["2026-10-26",9,17],["2026-10-27",10,20],["2026-10-28",10,20],["2026-10-29",8,16],["2026-10-30",9,17],["2026-10-31",9,17],["2026-11-01",9,17]];
var ED=["2026-11-03",6,21];
var MON={Jan:1,Feb:2,Mar:3,Apr:4,May:5,Jun:6,Jul:7,Aug:8,Sep:9,Oct:10,Nov:11,Dec:12};
function h24(t){var m=t.trim().match(/^(\d+)\s*(AM|PM)$/);if(!m)return null;var h=+m[1]%12;return m[2]=='PM'?h+12:h}
function ymd(t){var m=t.match(/([A-Z][a-z]{2})[a-z]*\s+(\d+)/);if(!m||!MON[m[1]])return null;return '2026-'+String(MON[m[1]]).padStart(2,'0')+'-'+String(+m[2]).padStart(2,'0')}
fetch('https://bkcb6.app/app/data/civic/november2026.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){
  var ev=[],ed=null;(d.earlyVoting&&d.earlyVoting.days||[]).forEach(function(x){var dd=ymd(x.date),hh=(x.hours||'').split(' to ');var o=h24(hh[0]||''),c=h24(hh[1]||'');if(!dd||o==null||c==null)return;if(x.isElectionDay)ed=[dd,o,c];else ev.push([dd,o,c])});
  if(ev.length){DAYS=ev}if(ed){ED=ed}render();
}).catch(function(){});
function nyNow(){var p={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});return {d:p.year+'-'+p.month+'-'+p.day,m:(+p.hour)*60+(+p.minute)}}
function hr(h){var s=h%12||12;return s+(h<12?' AM':' PM')}
function left(mins){var h=Math.floor(mins/60),m=mins%60;return h&&!m?h+'h':(h?h+'h ':'')+m+'m'}
function plural(n,w){return n+' '+w+(n==1?'':'s')}
function render(){
  var n=nyNow(),a=document.getElementById('pill'),l1=document.getElementById('l1'),l2=document.getElementById('l2');
  var i=-1;for(var k=0;k<DAYS.length;k++)if(DAYS[k][0]==n.d)i=k;
  var t1='',t2='',closed=false;
  if(i>=0){
    var o=DAYS[i][1]*60,c=DAYS[i][2]*60,rem=DAYS.length-i;
    if(n.m<o){t1='Early voting opens today at '+hr(DAYS[i][1]);closed=true}
    else if(n.m<c){t1='Early voting is open · '+left(c-n.m)+' left today'}
    else{t1='Early voting closed for today';closed=true;rem=rem-1}
    if(rem>0){t2=(n.m>=c?'Opens tomorrow at '+hr(DAYS[i+1][1])+' · ':'Until '+hr(DAYS[i][2])+' · ')+plural(rem,'day')+' of early voting left'}
    else{t2='Last day was today · Election Day is Tuesday, Nov 3, 6 AM to 9 PM'}
  }else if(n.d=='2026-11-02'){t1='No voting today · Election Day is tomorrow';t2='Tuesday, Nov 3, 6 AM to 9 PM';closed=true}
  else if(n.d==ED[0]){
    if(n.m<ED[1]*60){t1='Election Day · polls open at 6 AM';t2='Open until 9 PM';closed=true}
    else if(n.m<ED[2]*60){t1='Election Day · polls open · '+left(ED[2]*60-n.m)+' left';t2='Open until 9 PM · in line by 9 PM, you can vote'}
  }
  if(!t1){a.className='hide';return}
  l1.textContent=t1;l2.textContent=t2;a.className=closed?'closed':'';
}
(function(){var t=new URLSearchParams(location.search).get('to');if(t&&/^[a-z0-9\/._-]+$/i.test(t))document.getElementById('pill').href='https://bkcb6.app/'+t})();
(function(){var g=new URLSearchParams(location.search).get('img');var I={bk:'voted-bk-2026.png'};if(I[g])document.querySelector('#pill img').src='https://bkcb6.app/'+I[g]})();
render();setInterval(render,30000);
</script>
</body></html>
