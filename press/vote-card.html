<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Election Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0;background:#f8f7f4;overflow:hidden}
body{padding:4px 10px;font-family:'DM Sans',-apple-system,system-ui,sans-serif}
.vt{display:block;background:#0d1b4b;color:#fff;text-decoration:none;border:2px solid #f47920;border-radius:14px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .15s ease;font-family:'DM Sans','Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
.vt:hover{transform:translateY(-2px)}.vt:active{transform:scale(.985)}
.vt-strip{background:#f47920;color:#0d1b4b;font-size:.95rem;font-weight:600;line-height:1.35;padding:9px 14px}
.vt-strip b{font-weight:800}
.vt-body{display:flex;align-items:center;gap:14px;padding:13px 14px 15px}
.vt-body img{width:70px;height:70px;flex:none;border-radius:50%}
.vt-text{min-width:0}
.vt-h{font-size:clamp(1.12rem,3.8vw,1.5rem);font-weight:800;line-height:1.12;letter-spacing:-.01em;color:#fff}
.vt-s{font-size:.84rem;font-weight:500;line-height:1.4;color:rgba(255,255,255,.8);margin:6px 0 10px}
.vt-btn{display:inline-block;background:#fff;color:#0d1b4b;font-size:.86rem;font-weight:800;line-height:1;padding:10px 14px;border-radius:999px}
.vt.gone{display:none}
.vt{box-shadow:none}
.vt-strip{font-size:.88rem;padding:7px 12px}
.vt-body{gap:12px;padding:10px 12px 12px}
.vt-body img{width:56px;height:56px}
.vt-h{font-size:1.05rem}
.vt-s{display:none}
.vt-btn{font-size:.8rem;padding:8px 12px;margin-top:8px}
</style>
</head><body>
<a class="vt" id="vote-top" href="https://bkcb6.app/vote/">
  <div class="vt-strip"><b>Election Day is Tuesday, November 3.</b> Polls are open 6 AM to 9 PM.</div>
  <div class="vt-body">
    <img src="https://bkcb6.app/electionexplainer/stickers/bkcb6.png" alt="" width="70" height="70">
    <div class="vt-text">
      <div class="vt-h">Where you vote, who is running and what is on your ballot</div>
      <div class="vt-s">Type your address for your poll site, your districts, every race and the five City Charter questions.</div>
      <span class="vt-btn">Your poll site and your ballot &rsaquo;</span>
    </div>
  </div>
</a>
<script>(function(){try{var p={};new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});if(p.year+'-'+p.month+'-'+p.day>'2026-11-03')document.getElementById('vote-top').className+=' gone'}catch(e){}})();</script>
</body></html>
