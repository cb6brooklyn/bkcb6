<!DOCTYPE html>
<html lang="en">
<head>
<base href="/">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Brooklyn 311 complaints mapped by community district, live from NYC Open Data. Pick a time window and a complaint type and see where the calls come from.">
<meta property="og:site_name" content="Brooklyn Civic">
<meta property="og:title" content="Brooklyn 311 — Brooklyn Civic">
<meta property="og:description" content="Where 311 complaints come from across Brooklyn, by community district.">
<meta property="og:url" content="https://bkcb6.app/bk/311.html">
<meta property="og:image" content="https://bkcb6.app/brooklyn-seal.png">
<meta name="twitter:card" content="summary">
<title>Brooklyn 311 — Brooklyn Civic</title>
<link rel="icon" href="/brooklyn-seal.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500;600;700;800;900&display=swap');
:root{--navy:#1a3a6b;--gold:#f2c84b;--pale:#c7d3e1;--off:#f7f6f2;--border:#dfdbd3;--muted:#5b6675}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--navy);display:flex;flex-direction:column}
a{color:inherit;text-decoration:none}
.appbar{display:flex;align-items:center;gap:9px;background:var(--navy);border-bottom:4px solid var(--gold);padding:9px 14px;flex-shrink:0}
.appbar img{width:28px;height:28px}
.appbar .nm{color:#fff;font-weight:900;font-size:.95rem}
.appbar .dir{margin-left:auto;color:var(--gold);font-family:'DM Mono',monospace;font-size:.63rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em}
.head{background:var(--navy);padding:0 14px 12px;flex-shrink:0}
.head h1{color:#fff;font-size:1.14rem;font-weight:900;display:flex;align-items:center;gap:9px}
.head h1 img{width:30px;height:30px;background:#fff;border-radius:5px;padding:2px}
.head p{color:rgba(255,255,255,.72);font-size:.8rem;margin-top:5px;max-width:760px}
.ctrl{background:var(--navy);padding:0 14px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-shrink:0}
.ctrl label{font-family:'DM Mono',monospace;font-size:.58rem;text-transform:uppercase;letter-spacing:.07em;color:rgba(255,255,255,.6)}
.ctrl select{padding:7px 9px;border:1.5px solid rgba(255,255,255,.3);border-radius:7px;background:#fff;color:var(--navy);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;max-width:100%}
.ctrl select:focus{outline:none;border-color:var(--gold)}
.legend{background:var(--pale);padding:6px 14px;display:flex;flex-wrap:wrap;gap:9px;align-items:center;font-size:.72rem;flex-shrink:0;border-bottom:1px solid #b3c2d4}
.legend b{font-family:'DM Mono',monospace;font-size:.6rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.sw{display:inline-block;width:16px;height:11px;border-radius:2px;border:1px solid rgba(0,0,0,.15)}
#map{flex:1;min-height:300px}
.status{background:var(--navy);color:rgba(255,255,255,.82);font-family:'DM Mono',monospace;font-size:.7rem;padding:7px 14px;flex-shrink:0}
.panel{background:#fff;border-top:3px solid var(--gold);padding:12px 14px;max-height:42vh;overflow-y:auto;flex-shrink:0}
.panel h2{font-size:1rem;font-weight:900;margin-bottom:3px}
.panel .sub{font-family:'DM Mono',monospace;font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:9px}
.rows{display:grid;gap:5px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px;font-size:.82rem;padding:5px 0;border-bottom:1px solid #f0efed}
.row .bar{grid-column:1/3;height:5px;border-radius:3px;background:var(--gold)}
.row b{font-family:'DM Mono',monospace;font-weight:700}
.cdlabel{background:none;border:0;box-shadow:none;font-family:'DM Sans',sans-serif;font-weight:900;font-size:12px;color:#12305c;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 4px #fff}
.cdlabel:before{display:none}
@media(max-width:700px){.head h1{font-size:1rem}.ctrl select{flex:1 1 130px}}
</style>
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "b6e9b47ba0cf416388d72db8edaf4198"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
<div class="appbar">
  <a href="/bk/" style="display:flex;align-items:center;gap:9px"><img src="/brooklyn-seal.png" alt=""><span class="nm">Brooklyn Civic</span></a>
  <a class="dir" href="/bk/directory.html">Directory</a>
</div>
<div class="head">
  <h1><img src="/assets/agency-logos/311.png" alt="311">Brooklyn 311</h1>
  <p>Where complaints come from, by community district. Pick a window and a complaint type, then tap a district.</p>
</div>
<div class="ctrl">
  <label for="win">Window</label>
  <select id="win">
    <option value="7">Last 7 days</option>
    <option value="30" selected>Last 30 days</option>
    <option value="90">Last 90 days</option>
    <option value="365">Last 12 months</option>
  </select>
  <label for="typ">Complaint type</label>
  <select id="typ"><option value="">All types</option></select>
</div>
<div class="legend" id="legend"><b>Complaints per district</b></div>
<div id="map"></div>
<div class="status" id="status">Loading Brooklyn 311…</div>
<div class="panel" id="panel" hidden></div>
<script>
var TOKEN='HvFoIfzodzpRML7a1104Ca2tM';
var API='https://data.cityofnewyork.us/resource/erm2-nwe9.json';
var HOODS={1:'Greenpoint · Williamsburg',2:'Brooklyn Heights · Fort Greene · DUMBO',3:'Bedford-Stuyvesant',4:'Bushwick',5:'East New York · Cypress Hills',6:'Park Slope · Carroll Gardens · Cobble Hill · Red Hook · Gowanus · Columbia Street Waterfront District',7:'Sunset Park · Windsor Terrace',8:'Crown Heights North · Prospect Heights',9:'Crown Heights South · Prospect Lefferts Gardens',10:'Bay Ridge · Dyker Heights',11:'Bensonhurst · Bath Beach',12:'Borough Park · Kensington · Ocean Parkway',13:'Coney Island · Brighton Beach · Sea Gate',14:'Flatbush · Midwood',15:'Sheepshead Bay · Gerritsen Beach',16:'Brownsville',17:'East Flatbush · Farragut · Rugby',18:'Canarsie · Flatlands'};
var RAMP=['#eef2f7','#cfdcea','#a9c2dc','#7fa4cb','#5183b6','#2f639b','#1a3a6b'];
var map,cdLayer,counts={},maxN=0,boundaries=null;

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function fmt(n){return Number(n).toLocaleString('en-US');}
function sinceISO(days){var d=new Date(Date.now()-days*86400000);return d.toISOString().slice(0,19);}
function where(){
  var days=document.getElementById('win').value;
  var t=document.getElementById('typ').value;
  var w="borough='BROOKLYN' AND created_date>'"+sinceISO(days)+"'";
  if(t) w+=" AND complaint_type='"+t.replace(/'/g,"''")+"'";
  return w;
}
function q(params){
  return fetch(API+'?'+params+'&$$app_token='+TOKEN).then(function(r){
    if(!r.ok) throw new Error('311 API '+r.status);
    return r.json();
  });
}
function cdFromBoard(s){
  var m=String(s||'').match(/^(\d+)\s+BROOKLYN$/);
  return m?parseInt(m[1],10):null;
}
function colorFor(n){
  if(!maxN||!n) return RAMP[0];
  var i=Math.min(RAMP.length-1, Math.max(1, Math.ceil(n/maxN*(RAMP.length-1))));
  return RAMP[i];
}
function styleFor(f){
  var n=counts[f.properties.cd]||0;
  return {color:'#1a3a6b',weight:1.6,opacity:.9,fillColor:colorFor(n),fillOpacity:.82};
}
function drawLegend(){
  var el=document.getElementById('legend');
  var html='<b>Complaints per district</b>';
  if(maxN){
    var step=Math.ceil(maxN/(RAMP.length-1));
    for(var i=1;i<RAMP.length;i++){
      var lo=(i===1?0:step*(i-1)+1), hi=step*i;
      html+='<span><span class="sw" style="background:'+RAMP[i]+'"></span> '+fmt(lo)+'–'+fmt(hi)+'</span>';
    }
  }
  el.innerHTML=html;
}
function paint(){
  if(!cdLayer) return;
  cdLayer.setStyle(styleFor);
  cdLayer.eachLayer(function(l){
    var cd=l.feature.properties.cd, n=counts[cd]||0;
    if(l.getTooltip()) l.setTooltipContent('<span>BKCB'+cd+'<br>'+fmt(n)+'</span>');
  });
  drawLegend();
}
async function loadCounts(){
  var st=document.getElementById('status');
  st.textContent='Counting Brooklyn 311 complaints…';
  counts={};maxN=0;
  try{
    var rows=await q('$select=community_board,count(1) AS n&$where='+encodeURIComponent(where())+'&$group=community_board&$order=n DESC&$limit=30');
    var total=0;
    rows.forEach(function(r){
      var cd=cdFromBoard(r.community_board);
      if(!cd||cd>18) return;
      var n=parseInt(r.n,10)||0;
      counts[cd]=n; total+=n;
      if(n>maxN) maxN=n;
    });
    paint();
    var t=document.getElementById('typ').value;
    st.textContent=fmt(total)+' complaints across Brooklyn'+(t?' for '+t:'')+' in the last '+document.getElementById('win').value+' days. Tap a district for its breakdown.';
  }catch(e){
    st.textContent='311 data did not load. Try again in a moment.';
  }
}
async function loadTypes(){
  try{
    var rows=await q('$select=complaint_type,count(1) AS n&$where='+encodeURIComponent("borough='BROOKLYN' AND created_date>'"+sinceISO(90)+"'")+'&$group=complaint_type&$order=n DESC&$limit=40');
    var sel=document.getElementById('typ');
    rows.forEach(function(r){
      if(!r.complaint_type) return;
      var o=document.createElement('option');
      o.value=r.complaint_type; o.textContent=r.complaint_type+' ('+fmt(r.n)+')';
      sel.appendChild(o);
    });
  }catch(e){}
}
async function showDistrict(cd){
  var p=document.getElementById('panel');
  p.hidden=false;
  p.innerHTML='<h2>Brooklyn Community Board '+cd+'</h2><div class="sub">Loading…</div>';
  try{
    var w=where().replace("borough='BROOKLYN'","community_board='"+(cd<10?'0'+cd:cd)+" BROOKLYN'");
    var rows=await q('$select=complaint_type,count(1) AS n&$where='+encodeURIComponent(w)+'&$group=complaint_type&$order=n DESC&$limit=12');
    var top=rows.length?parseInt(rows[0].n,10):0;
    var html='<h2>Brooklyn Community Board '+cd+'</h2><div class="sub">'+esc(HOODS[cd]||'')+' · '+fmt(counts[cd]||0)+' complaints</div><div class="rows">';
    rows.forEach(function(r){
      var n=parseInt(r.n,10)||0;
      html+='<div class="row"><span>'+esc(r.complaint_type)+'</span><b>'+fmt(n)+'</b>'
          + '<span class="bar" style="width:'+(top?Math.max(3,n/top*100):0)+'%"></span></div>';
    });
    html+='</div><p style="margin-top:10px"><a href="/bk/cb-bk-'+cd+'.html" style="font-family:\'DM Mono\',monospace;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#1a3a6b">Open the BKCB'+cd+' profile &rarr;</a></p>';
    p.innerHTML=html;
  }catch(e){
    p.innerHTML='<h2>Brooklyn Community Board '+cd+'</h2><div class="sub">That breakdown did not load.</div>';
  }
}
function initMap(){
  map=L.map('map',{scrollWheelZoom:true}).setView([40.6489,-73.95],11);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key=cb1_2hyw_1_9cda1572a3817275ed412c0e',{maxZoom:19,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
  fetch('/bk/data/bk-cd-boundaries.geojson').then(function(r){return r.json();}).then(function(j){
    boundaries=j;
    cdLayer=L.geoJSON(j,{
      style:styleFor,
      onEachFeature:function(f,l){
        var cd=f.properties.cd;
        l.bindTooltip('<span>BKCB'+cd+'</span>',{permanent:true,direction:'center',className:'cdlabel',opacity:1,interactive:false});
        l.on('click',function(){showDistrict(cd);});
        l.on('mouseover',function(){l.setStyle({weight:3.2,color:'#f2c84b'});});
        l.on('mouseout',function(){l.setStyle({weight:1.6,color:'#1a3a6b'});});
      }
    }).addTo(map);
    try{map.fitBounds(cdLayer.getBounds(),{padding:[12,12]});}catch(e){}
    loadCounts();
  }).catch(function(){
    document.getElementById('status').textContent='District boundaries did not load.';
  });
}
document.getElementById('win').addEventListener('change',loadCounts);
document.getElementById('typ').addEventListener('change',loadCounts);
initMap();
loadTypes();
</script>
</body>
</html>
