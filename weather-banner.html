<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CB6 Weather Banner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&family=DM+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920}
html,body{margin:0;padding:0;height:100%;background:transparent;font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{container-type:size;width:100%;height:100%}
a.bn{box-sizing:border-box;display:flex;align-items:center;gap:3cqw;width:100%;height:100%;padding:0 3.2cqw 0 3.6cqw;background:var(--navy);border:max(3px,.5cqw) solid var(--orange);border-radius:1.6cqw;color:#fff;text-decoration:none;overflow:hidden}
.logo{flex:none;height:66cqh;aspect-ratio:1;border-radius:1cqw;background:#fff url("cb6-logo-square.png") center/contain no-repeat;border:max(2px,.3cqw) solid var(--orange)}
.txt{flex:1;min-width:0}
.k{font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--orange);font-size:1.8cqw;line-height:1.2}
.t{font-weight:800;font-size:3.4cqw;line-height:1.1;margin:.9cqw 0 .9cqw;letter-spacing:-.01em}
.s{font-weight:500;font-size:1.85cqw;line-height:1.25;color:#dfe4f5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.u{font-family:"DM Mono",ui-monospace,monospace;font-weight:500;color:var(--orange);font-size:1.9cqw;margin-top:.7cqw}
.arrow{flex:none;width:8cqw;height:8cqw;border-radius:50%;background:var(--orange);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:6.5cqw;font-weight:800;line-height:1;padding-bottom:.5cqw;box-sizing:border-box}
.alert .k{color:#fff;background:#b3260a;display:inline-block;padding:.35cqw 1cqw;border-radius:.5cqw}
</style>
</head>
<body>
<div class="wrap">
<a class="bn" id="bn" href="https://bkcb6.app/weather" target="_blank" rel="noopener">
  <span class="logo" role="img" aria-label="CB6"></span>
  <span class="txt">
    <div class="k" id="k">CB6 Weather &amp; Safety</div>
    <div class="t" id="t">Live weather, flood maps and transit for CB6</div>
    <div class="s" id="s">Rain totals &middot; Subway and bus status &middot; Flood maps &middot; Air quality</div>
    <div class="u">bkcb6.app/weather</div>
  </span>
  <span class="arrow" aria-hidden="true">&rsaquo;</span>
</a>
</div>
<script>
(function(){
  var bn=document.getElementById("bn"),k=document.getElementById("k"),t=document.getElementById("t");
  function apply(j){
    if(!j) return;
    var msg="";
    if(j.codeRed===true) msg=j.codeRedTitle||"Code Red in effect.";
    else if(j.tornadoWatch===true) msg=j.tornadoWatchTitle||"A Tornado Watch is in effect.";
    else if(j.floodWatch===true) msg=j.floodWatchTitle||"Flood Watch in effect.";
    else if(j.heatEmergency===true) msg=j.title||"Heat emergency in effect.";
    if(msg){ k.textContent="Weather alert · live updates"; t.textContent=msg; bn.classList.add("alert"); }
    else{ k.textContent="CB6 Weather & Safety"; t.textContent="Live weather, flood maps and transit for CB6"; bn.classList.remove("alert"); }
  }
  function load(){fetch("heat.json?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(apply).catch(function(){});}
  load(); setInterval(load,300000);
})();
</script>
</body>
</html>
