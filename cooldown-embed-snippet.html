<!-- ===== BKCB6 Cool Down embed ===== -->
<!-- Paste this wherever you want the cooldown page to appear. -->
<iframe
  id="bkcb6-cooldown"
  src="https://bkcb6.app/cooldown?embed=1"
  title="BKCB6 Cool Down"
  loading="lazy"
  style="width:100%;border:0;display:block;height:1600px;border-radius:14px;background:#fff;overflow:hidden"
  scrolling="no"></iframe>
<script>
(function(){
  var f = document.getElementById("bkcb6-cooldown");
  window.addEventListener("message", function(e){
    if (e && e.data && e.data.type === "bkcb6-explorer-height" && e.data.height) {
      f.style.height = Math.max(800, e.data.height + 24) + "px";
    }
  });
})();
</script>
<!-- ===== end embed ===== -->
