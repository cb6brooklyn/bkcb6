<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'DM Sans',sans-serif;background:#0d1b4b;color:#fff}
body{display:flex;flex-direction:column}
.top-bar{background:#0d1b4b;border-bottom:3px solid #f47920;padding:10px 14px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex-shrink:0}
.top-bar h1{font-size:.92rem;font-weight:700;color:#fff;flex-shrink:0}
.top-bar h1 span{color:#f47920}
.search-row{display:flex;gap:6px;flex:1;min-width:220px}
.search-row input{flex:1;font-family:'DM Sans',sans-serif;font-size:.83rem;padding:6px 11px;border:none;border-radius:6px;background:rgba(255,255,255,.12);color:#fff;outline:none}
.search-row input::placeholder{color:rgba(255,255,255,.4)}
.search-row button{padding:6px 14px;background:#f47920;color:#fff;border:none;border-radius:6px;font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:700;cursor:pointer;white-space:nowrap}
.back-link{font-size:.7rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.45);text-decoration:none;white-space:nowrap;flex-shrink:0}
.back-link:hover{color:#f47920}
.scope-bar{background:#0a1538;padding:7px 14px;display:flex;flex-wrap:wrap;gap:7px;align-items:center;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
.scope-bar label{font-size:.58rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:#a9b0d4}
.scope-bar select{font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;padding:5px 9px;border:1px solid rgba(255,255,255,.2);border-radius:6px;background:#fff;color:#0d1b4b;max-width:60vw}
.addr-result{display:none;padding:10px 14px;background:#fff;border-bottom:2px solid #f47920;flex-shrink:0;max-height:38vh;overflow:auto}
.toggles{padding:8px 14px;background:#f8f7f4;border-bottom:1px solid #e5e2db;display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex-shrink:0}
.toggles > span.lb{font-size:.58rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.07em;color:#888;margin-right:2px}
.trn-btn{padding:5px 11px;font-size:.72rem;font-family:'DM Sans',sans-serif;font-weight:600;border:1.5px solid #ccc;border-radius:20px;background:#fff;color:#555;cursor:pointer;transition:all .15s;white-space:nowrap}
.trn-btn:hover{border-color:var(--tc);color:var(--tc)}
.trn-btn.active{background:var(--tc);border-color:var(--tc);color:#fff}
.trn-btn.busy{opacity:.55;cursor:progress}
.trn-btn[disabled]{opacity:.34;cursor:not-allowed;border-style:dashed}
.legend-bar{padding:5px 14px;background:#fafaf8;border-bottom:1px solid #e5e2db;display:flex;flex-wrap:wrap;gap:7px;align-items:center;flex-shrink:0;min-height:26px}
.li{display:inline-flex;align-items:center;gap:4px;font-size:.71rem;color:#444}
.ls-line{display:inline-block;width:20px;height:4px;border-radius:2px;flex-shrink:0}
.ls-dot{display:inline-block;width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px #ccc;flex-shrink:0}
#map{flex:1;min-height:0;background:#eef3f8}
.status{position:absolute;left:50%;transform:translateX(-50%);top:12px;z-index:800;background:rgba(13,27,75,.93);color:#fff;font-size:.76rem;font-family:'DM Mono',monospace;padding:7px 14px;border-radius:20px;display:none;box-shadow:0 3px 14px rgba(0,0,0,.25)}
.map-shell{position:relative;flex:1;min-height:0;display:flex}
.source-bar{padding:4px 14px;font-size:.63rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.3);background:#0d1b4b;flex-shrink:0}
.source-bar a{color:#f47920;text-decoration:none}
</style>

<div class="top-bar">
  <h1 id="scope-title">Transportation <span>Map</span></h1>

<script>
(function(){
'use strict';

/* ---------- scope ---------- */
var BOROS=[{s:'mn',n:'Manhattan',d:'1',cds:12,file:'manhattan'},{s:'bx',n:'Bronx',d:'2',cds:12,file:'bronx'},{s:'bk',n:'Brooklyn',d:'3',cds:18,file:'brooklyn'},{s:'qn',n:'Queens',d:'4',cds:14,file:'queens'},{s:'si',n:'Staten Island',d:'5',cds:3,file:'statenisland'}];
var BY_SHORT={},BY_FILE={};BOROS.forEach(function(b){BY_SHORT[b.s]=b;BY_FILE[b.file]=b;});

var qs=new URLSearchParams(location.search);
var scope={level:'city',label:'New York City',short:'NYC'};
var cdParam=(qs.get('cd')||qs.get('d')||'').toLowerCase().replace(/^cb-/,'');
var boroParam=(qs.get('boro')||qs.get('borough')||'').toLowerCase().replace(/[^a-z]/g,'');
if(cdParam&&/^[a-z]{2}-\d+$/.test(cdParam)){
  var cp=cdParam.split('-'),cb=BY_SHORT[cp[0]],cn=parseInt(cp[1],10);
  if(cb&&cn>=1&&cn<=cb.cds){scope={level:'cd',short:cp[0],num:cn,boro:cb,label:cb.n+' Community Board '+cn,code:cb.d+(cn<10?'0':'')+cn,file:'transport-data/cb-'+cp[0]+'-'+cn+'.json'};}
}else if(boroParam){
  var bb=BY_FILE[boroParam]||BY_FILE[boroParam.replace('statenisland','statenisland')];
  if(!bb)BOROS.forEach(function(b){if(b.n.toLowerCase().replace(/[^a-z]/g,'')===boroParam)bb=b;});
  if(bb)scope={level:'boro',boro:bb,label:bb.n,short:bb.s,file:'transport-data/'+bb.file+'.json'};
}

/* ---------- layers ---------- */
var LAYERS=[
  {k:'speed',icon:'🛣',label:'Speed Limits',c:'#2a9d8f',src:'scoped'},
  {k:'sammys',icon:'🏫',label:"Sammy's Law 15 mph",c:'#27ae60',src:'cb6'},
  {k:'bike',icon:'🚲',label:'Bike Routes',c:'#1d4ed8',src:'scoped'},
  {k:'citi',icon:'🚴',label:'Citi Bike',c:'#0072CE',src:'city'},
  {k:'bus',icon:'🚌',label:'Bus Routes',c:'#2563eb',src:'scoped'},
  {k:'busstops',icon:'🚏',label:'Bus Stops',c:'#f59e0b',src:'scoped'},
  {k:'subrt',icon:'🚈',label:'Subway Lines',c:'#EE352E',src:'city'},
  {k:'subway',icon:'🚇',label:'Subway Stations',c:'#0d1b4b',src:'city'},
  {k:'truck',icon:'🚚',label:'Truck Routes',c:'#0d9488',src:'scoped'},
  {k:'asp',icon:'🅿️',label:'Alt Side Parking',c:'#e41a1c',src:'cb6'}
];
var LEGENDS={
  speed:[{c:'#2a9d8f',l:'20 mph',t:'line'},{c:'#4c78a8',l:'25 mph',t:'line'},{c:'#f4a261',l:'30 mph',t:'line'},{c:'#e63946',l:'35+ mph',t:'line'},{c:'#111827',l:'School Zone',t:'line'}],
  bike:[{c:'#1d4ed8',l:'Protected',t:'line'},{c:'#0f766e',l:'Greenway',t:'line'},{c:'#f59e0b',l:'Buffered',t:'line'},{c:'#6b7280',l:'Shared',t:'line'}],
  bus:[{c:'#2563eb',l:'Local',t:'line'},{c:'#c1121f',l:'SBS',t:'line'},{c:'#6a1b9a',l:'Express',t:'line'}],
  busstops:[{c:'#2563eb',l:'Local Stop',t:'dot'},{c:'#f59e0b',l:'Timepoint',t:'dot'},{c:'#c1121f',l:'CBD Stop',t:'dot'}],
  subway:[{c:'#0d1b4b',l:'Station',t:'dot'},{c:'#f47920',l:'ADA accessible',t:'dot'}],
  subrt:[{c:'#EE352E',l:'Subway line, MTA colors',t:'line'}],
  citi:[{c:'#0072CE',l:'Citi Bike station',t:'dot'}],
  truck:[{c:'#0d9488',l:'Through',t:'line'},{c:'#2563eb',l:'Local',t:'line'},{c:'#f59e0b',l:'Limited',t:'line'}],
  sammys:[{c:'#27ae60',l:'15 mph school zone',t:'line'}],
  asp:[{c:'#e41a1c',l:'Mon',t:'line'},{c:'#377eb8',l:'Tue',t:'line'},{c:'#4daf4a',l:'Wed',t:'line'},{c:'#984ea3',l:'Thu',t:'line'},{c:'#ff7f00',l:'Fri',t:'line'},{c:'#a65628',l:'Sat',t:'line'},{c:'#999999',l:'Sun',t:'line'}]
};
var isCB6=(scope.level==='cd'&&scope.short==='bk'&&scope.num===6);
var SCOPED=['speed','bike','bus','busstops','truck'];

/* ---------- map ---------- */
var map=L.map('map',{scrollWheelZoom:true,preferCanvas:true}).setView([40.7128,-73.96],11);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);

var layers={},visible={},scopedData=null,scopedPromise=null,searchMarker=null;
var subwayAll=null,citiAll=null,scopeBounds=null,scopeRing=null;

function el(id){return document.getElementById(id);}
function escH(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function status(msg){var s=el('status');if(!msg){s.style.display='none';return;}s.textContent=msg;s.style.display='block';}

/* ---------- boundary ---------- */
function loadBoundary(){
  return fetch('cd-boundaries-simple.geojson').then(function(r){return r.json();}).then(function(g){
    var feats=g.features;
    if(scope.level==='cd')feats=feats.filter(function(f){return String(f.properties.cd)===scope.code;});
    else if(scope.level==='boro')feats=feats.filter(function(f){return String(f.properties.cd).charAt(0)===scope.boro.d;});
    var fc={type:'FeatureCollection',features:feats};
    var lyr=L.geoJSON(fc,{
      style:function(){return{color:'#f47920',weight:scope.level==='city'?1.2:2.5,opacity:scope.level==='city'?.55:1,fill:scope.level==='city',fillColor:'#f47920',fillOpacity:scope.level==='city'?.03:0};},
      onEachFeature:function(f,l){
        var cd=String(f.properties.cd),bs=null;
        BOROS.forEach(function(b){if(b.d===cd.charAt(0))bs=b;});
        var num=parseInt(cd.slice(1),10);
        if(!bs)return;
        l.bindTooltip('<strong>'+escH(bs.n+' Community Board '+num)+'</strong>',{sticky:true,opacity:1});
        if(scope.level==='city')l.on('click',function(){location.href='transport-map.html?cd='+bs.s+'-'+num+'&layers='+activeKeys().join(',');});
      }
    }).addTo(map);
    scopeBounds=lyr.getBounds();
    if(scope.level!=='city')map.fitBounds(scopeBounds,{padding:[14,14]});
    else map.fitBounds(scopeBounds,{padding:[6,6]});
    if(scope.level!=='city')scopeRing=fc;
    return fc;
  });
}

function inScope(lat,lng){
  if(!scopeBounds)return true;
  var pad=scope.level==='cd'?0.006:0.02;
  return lat>=scopeBounds.getSouth()-pad&&lat<=scopeBounds.getNorth()+pad&&lng>=scopeBounds.getWest()-pad&&lng<=scopeBounds.getEast()+pad;
}
function lineInScope(f){
  if(scope.level==='city'||!scopeBounds)return true;
  var c=f.geometry.coordinates,t=f.geometry.type;
  var arr=t==='MultiLineString'?c.reduce(function(a,b){return a.concat(b);},[]):c;
  for(var i=0;i<arr.length;i+=Math.max(1,Math.floor(arr.length/12))){if(inScope(arr[i][1],arr[i][0]))return true;}
  return inScope(arr[arr.length-1][1],arr[arr.length-1][0]);
}

/* ---------- styling ---------- */
function speedC(p){var sl=parseInt(p.postvz_sl||0,10);if(sl<=20&&sl>0)return'#2a9d8f';if(sl<=25)return'#4c78a8';if(sl<=30)return'#f4a261';return'#e63946';}
function bikeC(p){var t=[p.ft_facilit,p.tf_facilit,p.facilitycl,p.allclasses,p.grnwy,p.status].join(' ').toLowerCase();if(t.indexOf('retired')!==-1)return'#ef4444';if(t.indexOf('greenway')!==-1)return'#0f766e';if(t.indexOf('protected')!==-1)return'#1d4ed8';if(t.indexOf('buffered')!==-1)return'#f59e0b';return'#6b7280';}
function busC(p){var r=String(p.route_color||'').trim();if(r&&r[0]!=='#')r='#'+r;if(/^#[0-9a-fA-F]{6}$/.test(r))return r;var t=String(p.route_type||'').toLowerCase();if(t==='sbs')return'#c1121f';if(t==='express')return'#6a1b9a';if(t==='limited')return'#f77f00';return'#2563eb';}
function stopC(p){if(String(p.is_cbd||'').toLowerCase()==='true')return'#c1121f';if(String(p.timepoint||'').toLowerCase()==='true')return'#f59e0b';return'#2563eb';}
function subC(p){var a=String(p.ada||'').toLowerCase();return(a==='true'||a==='yes'||a==='1')?'#f47920':'#0d1b4b';}
function truckC(p){var t=String(p.routetype||'').toLowerCase();if(t==='through')return'#0d9488';if(t==='local')return'#2563eb';return'#f59e0b';}
function bikeType(p){var t=[p.ft_facilit,p.tf_facilit,p.facilitycl,p.allclasses,p.grnwy].join(' ').toLowerCase();if(t.indexOf('protected')!==-1)return'Protected Bike Lane';if(t.indexOf('greenway')!==-1)return'Greenway';if(t.indexOf('buffered')!==-1)return'Buffered Bike Lane';return p.allclasses||p.ft_facilit||'Bike Route';}
var lineColors={'1':'#EE352E','2':'#EE352E','3':'#EE352E','4':'#00933C','5':'#00933C','6':'#00933C','7':'#B933AD','A':'#0039A6','C':'#0039A6','E':'#0039A6','B':'#FF6319','D':'#FF6319','F':'#FF6319','M':'#FF6319','G':'#6CBE45','J':'#996633','Z':'#996633','L':'#A7A9AC','N':'#FCCC0A','Q':'#FCCC0A','R':'#FCCC0A','W':'#FCCC0A','S':'#808183','SIR':'#0039A6'};
function lineBadges(routes){if(!routes)return'';return String(routes).split(/[\s,]+/).filter(Boolean).map(function(r){var bg=lineColors[r]||'#555';var fg=(bg==='#FCCC0A')?'#000':'#fff';return'<span style="display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:'+bg+';color:'+fg+';font-size:.65rem;font-weight:700;margin-right:2px">'+escH(r)+'</span>';}).join('');}

function buildScopedLayer(k,gj){
  if(k==='busstops'){
    return L.geoJSON(gj,{pointToLayer:function(f,ll){return L.circleMarker(ll,{radius:5,color:'#fff',weight:1.5,fillColor:stopC(f.properties||{}),fillOpacity:.95});},onEachFeature:function(f,l){var p=f.properties||{};l.bindTooltip('<strong>'+escH(p.stop_name||'Stop')+'</strong><br><span style="font-size:.75rem;color:#555">'+escH((p.routes||[]).join(', '))+'</span>',{sticky:true,opacity:1});}});
  }
  var styleFn={speed:function(f){var p=f.properties||{};return{color:speedC(p),weight:String(p.postvz_sg||'').toUpperCase()==='YES'?4:3,opacity:.9,dashArray:String(p.postvz_sg||'').toUpperCase()==='YES'?'8 4':null};},bike:function(f){return{color:bikeC(f.properties||{}),weight:3.5,opacity:.9};},bus:function(f){return{color:busC(f.properties||{}),weight:3,opacity:.8};},truck:function(f){return{color:truckC(f.properties||{}),weight:3,opacity:.85};}}[k];
  return L.geoJSON(gj,{style:styleFn,onEachFeature:function(f,l){var p=f.properties||{};var tip='';
    if(k==='speed')tip='<strong>'+escH(p.street||'')+'</strong><br><span style="font-size:.75rem;color:#555">'+escH(p.postvz_sl||'—')+' mph'+(String(p.postvz_sg||'').toUpperCase()==='YES'?' · School Zone':'')+'</span>';
    else if(k==='bike')tip='<strong>'+escH(p.street||'')+'</strong><br><span style="font-size:.75rem;color:#555">'+escH([p.status,p.ft_facilit||p.allclasses].filter(Boolean).join(' · '))+'</span>';
    else if(k==='bus')tip='<strong>'+escH(p.route_short_name||p.route_id||'')+'</strong> '+escH(p.route_long_name||'');
    else if(k==='truck')tip='<strong>'+escH(p.street||'')+'</strong><br>'+escH(p.routetype||'');
    l.bindTooltip(tip,{sticky:true,opacity:1});}});
}

/* ---------- data loaders ---------- */
function loadScoped(){
  if(scopedPromise)return scopedPromise;
  if(scope.level==='city')return Promise.reject(new Error('no citywide street file'));
  var heavy=scope.level==='boro';
  if(heavy)status('Loading '+scope.label+' street data. This one is large.');
  scopedPromise=fetch(scope.file).then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();}).then(function(d){scopedData=d;status('');return d;}).catch(function(e){status('Could not load '+scope.label+' street data.');setTimeout(function(){status('');},4000);throw e;});
  return scopedPromise;
}
function loadSubwayStations(){
  if(subwayAll)return Promise.resolve(subwayAll);
  return fetch('data/nyc-subway-stations.geojson').then(function(r){return r.json();}).then(function(d){subwayAll=d.features;return subwayAll;});
}
function loadCiti(){
  if(citiAll)return Promise.resolve(citiAll);
  return fetch('data/citibike_station_information.json').then(function(r){return r.json();}).then(function(d){citiAll=((d.data||{}).stations)||[];return citiAll;});
}

function makeLayer(k){
  if(SCOPED.indexOf(k)!==-1){
    return loadScoped().then(function(d){
      var gj=d[k];
      if(!gj||!gj.features||!gj.features.length)return null;
      return buildScopedLayer(k,gj);
    });
  }
  if(k==='subway'){
    return loadSubwayStations().then(function(feats){
      var use=feats.filter(function(f){return scope.level==='city'||inScope(f.geometry.coordinates[1],f.geometry.coordinates[0]);});
      if(!use.length)return null;
      return L.geoJSON({type:'FeatureCollection',features:use},{pointToLayer:function(f,ll){return L.circleMarker(ll,{radius:6,color:'#fff',weight:1.5,fillColor:subC(f.properties||{}),fillOpacity:.95});},onEachFeature:function(f,l){var p=f.properties||{};l.bindTooltip(lineBadges(p.daytime_routes||p.routes)+'<strong style="margin-left:3px">'+escH(p.stop_name||'Station')+'</strong>'+(p.line?'<br><span style="font-size:.72rem;color:#555">'+escH(p.line)+' Line</span>':'')+(String(p.ada)==='1'?'<br><span style="font-size:.72rem;color:#f47920">♿ ADA accessible</span>':''),{sticky:true,opacity:1});}});
    });
  }
  if(k==='subrt'){
    return fetch('data/nyc-subway-routes.geojson').then(function(r){return r.json();}).then(function(d){
      var use=d.features.filter(lineInScope);
      if(!use.length)return null;
      return L.geoJSON({type:'FeatureCollection',features:use},{style:function(f){return{color:(f.properties||{}).color||'#666',weight:3.5,opacity:.85};},onEachFeature:function(f,l){l.bindTooltip('<strong>'+escH((f.properties||{}).name||'Subway line')+'</strong>',{sticky:true,opacity:1});}});
    });
  }
  if(k==='citi'){
    return loadCiti().then(function(st){
      var use=st.filter(function(s){return scope.level==='city'||inScope(s.lat,s.lon);});
      if(!use.length)return null;
      var g=L.layerGroup();
      use.forEach(function(s){
        L.circleMarker([s.lat,s.lon],{radius:5,fillColor:'#0072CE',color:'#fff',weight:1.4,fillOpacity:.9})
         .bindTooltip('<strong>🚴 '+escH(s.name)+'</strong>'+(s.capacity?'<br><span style="font-size:.72rem;color:#555">'+s.capacity+' docks</span>':''),{sticky:true,opacity:1})
         .addTo(g);
      });
      return g;
    });
  }
  if(k==='sammys'){
    return fetch('data/cb6-sammys-15mph.geojson').then(function(r){return r.json();}).then(function(d){
      return L.geoJSON(d,{style:function(){return{color:'#27ae60',weight:5,opacity:.9};},onEachFeature:function(f,l){var p=f.properties||{};l.bindTooltip('<strong style="color:#27ae60">🏫 '+escH(p.street)+'</strong><br><span style="font-size:.72rem;color:#27ae60">'+escH(p.speed_limit||'15 MPH School Zone')+'</span>'+(p.pending_former_speed_limit?'<br><span style="font-size:.72rem;color:#888">Was: '+escH(p.pending_former_speed_limit)+'</span>':''),{sticky:true,opacity:1});}});
    });
  }
  if(k==='asp'){
    var DAYC={Mon:'#e41a1c',Tue:'#377eb8',Wed:'#4daf4a',Thu:'#984ea3',Fri:'#ff7f00',Sat:'#a65628',Sun:'#999999'};
    return fetch('data/cb6-asp-lines.geojson').then(function(r){return r.json();}).then(function(d){
      return L.geoJSON(d,{style:function(f){return{color:DAYC[(f.properties||{}).primary_day]||'#666',weight:5,opacity:.85,lineCap:'round'};},onEachFeature:function(f,l){
        var p=f.properties||{},c=DAYC[p.primary_day]||'#666';
        var susp=p.next_suspensions?String(p.next_suspensions).split(' | ').map(function(s){return'<div style="font-size:.7rem;color:#444;padding:1px 0">• '+escH(s)+'</div>';}).join(''):'<div style="font-size:.7rem;color:#888">No upcoming suspensions parsed.</div>';
        l.bindPopup('<div style="font-family:DM Sans,sans-serif;min-width:220px;max-width:290px"><div style="font-weight:700;font-size:.86rem;color:#fff;background:'+c+';padding:7px 11px;border-radius:6px 6px 0 0">🅿️ '+escH(p.schedule)+'</div><div style="padding:9px 11px;background:#fff"><div style="font-size:.8rem;color:#0d1b4b;margin-bottom:9px;line-height:1.35">'+escH(p.location)+'</div><div style="font-size:.6rem;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-bottom:4px">Next ASP suspensions</div>'+susp+'</div></div>',{maxWidth:300});
        l.bindTooltip('<strong style="color:'+c+'">🅿️ '+escH(p.schedule)+'</strong>',{sticky:true,opacity:.95});
      }});
    });
  }
  return Promise.resolve(null);
}

/* ---------- toggles ---------- */
function activeKeys(){return Object.keys(visible).filter(function(k){return visible[k];});}

function toggle(k,btn){
  if(btn.hasAttribute('disabled'))return;
  if(visible[k]){
    visible[k]=false;btn.classList.remove('active');
    if(layers[k])map.removeLayer(layers[k]);
    updateLegend();syncUrl();return;
  }
  visible[k]=true;btn.classList.add('active');
  if(layers[k]){layers[k].addTo(map);updateLegend();syncUrl();return;}
  btn.classList.add('busy');
  makeLayer(k).then(function(lyr){
    btn.classList.remove('busy');
    if(!lyr){visible[k]=false;btn.classList.remove('active');status('No '+labelFor(k)+' data in '+scope.label+'.');setTimeout(function(){status('');},3200);updateLegend();return;}
    layers[k]=lyr;
    if(visible[k])lyr.addTo(map);
    updateLegend();syncUrl();
  }).catch(function(){btn.classList.remove('busy');visible[k]=false;btn.classList.remove('active');updateLegend();});
}
function labelFor(k){var out=k;LAYERS.forEach(function(L2){if(L2.k===k)out=L2.label;});return out;}

function renderToggles(){
  var host=el('toggles');
  host.innerHTML='<span class="lb">Show</span>';
  LAYERS.forEach(function(L2){
    if(L2.src==='cb6'&&!isCB6)return;
    var btn=document.createElement('button');
    btn.className='trn-btn';btn.style.setProperty('--tc',L2.c);
    btn.textContent=L2.icon+' '+L2.label;
    btn.id='btn-'+L2.k;
    if(L2.src==='scoped'&&scope.level==='city'){
      btn.setAttribute('disabled','');
      btn.title='Street level layers load one borough or one district at a time. Pick an area above.';
    }else{
      btn.addEventListener('click',function(){toggle(L2.k,btn);});
    }
    host.appendChild(btn);
  });
}

function updateLegend(){
  var html='';
  LAYERS.forEach(function(L2){
    if(!visible[L2.k])return;
    (LEGENDS[L2.k]||[]).forEach(function(item){
      html+=item.t==='dot'?'<span class="li"><span class="ls-dot" style="background:'+item.c+'"></span>'+item.l+'</span>':'<span class="li"><span class="ls-line" style="background:'+item.c+'"></span>'+item.l+'</span>';
    });
  });
  el('legend').innerHTML=html||'<span style="font-size:.7rem;color:#aaa;font-family:DM Mono,monospace">Toggle layers above</span>';
}

function syncUrl(){
  var p=[];
  if(scope.level==='cd')p.push('cd='+scope.short+'-'+scope.num);
  else if(scope.level==='boro')p.push('boro='+scope.boro.file);
  var a=activeKeys();
  if(a.length)p.push('layers='+a.join(','));
  history.replaceState(null,'','transport-map.html'+(p.length?'?'+p.join('&'):''));
}

/* ---------- scope picker ---------- */
function renderScopePicker(){
  var sel=el('scope-sel'),h='<option value="city">All of New York City</option>';
  BOROS.forEach(function(b){
    h+='<optgroup label="'+b.n+'">';
    h+='<option value="boro:'+b.file+'">All of '+b.n+'</option>';
    for(var i=1;i<=b.cds;i++)h+='<option value="cd:'+b.s+'-'+i+'">'+b.n+' Community Board '+i+'</option>';
    h+='</optgroup>';
  });
  sel.innerHTML=h;
  sel.value=scope.level==='cd'?('cd:'+scope.short+'-'+scope.num):(scope.level==='boro'?('boro:'+scope.boro.file):'city');
  sel.addEventListener('change',function(){
    var v=this.value,a=activeKeys().filter(function(k){return k!=='asp'&&k!=='sammys';});
    var q=v==='city'?'':(v.indexOf('cd:')===0?'?cd='+v.slice(3):'?boro='+v.slice(5));
    if(a.length)q+=(q?'&':'?')+'layers='+a.join(',');
    location.href='transport-map.html'+q;
  });
}

/* ---------- address search ---------- */
function hav(la1,ln1,la2,ln2){var R=3959*5280,dLa=(la2-la1)*Math.PI/180,dLn=(ln2-ln1)*Math.PI/180,a=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLn/2)*Math.sin(dLn/2);return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function ptDist(la,ln,feat){var c=feat.geometry.coordinates,t=feat.geometry.type;if(t==='Point')return hav(la,ln,c[1],c[0]);var arr=t==='MultiLineString'?c.reduce(function(a,b){return a.concat(b);},[]):c;var best=Infinity;for(var i=0;i<arr.length;i++){var d=hav(la,ln,arr[i][1],arr[i][0]);if(d<best)best=d;}return best;}
function nearest(la,ln,feats){var best=null,bd=Infinity;(feats||[]).forEach(function(f){var d=ptDist(la,ln,f);if(d<bd){bd=d;best=f;}});return best?{feat:best,dist:Math.round(bd)}:null;}
function fmtD(ft){return ft<528?ft+' ft':(ft/5280).toFixed(2)+' mi';}
function pRow(icon,label,val){return'<tr style="border-bottom:1px solid #f0efed"><td style="padding:6px 10px 6px 0;vertical-align:top;white-space:nowrap"><span style="font-size:.85rem">'+icon+'</span><span style="font-size:.63rem;font-family:DM Mono,monospace;text-transform:uppercase;letter-spacing:.06em;color:#888;margin-left:4px">'+label+'</span></td><td style="padding:6px 0;font-size:.78rem;color:#0d1b4b;line-height:1.4">'+val+'</td></tr>';}

window.doSearch=function(){
  var addr=el('s-input').value.trim();
  if(!addr)return;
  var res=el('s-result');
  res.style.display='block';
  res.innerHTML='<span style="color:#888;font-size:.78rem;font-family:DM Mono,monospace">Searching…</span>';
  var streetP=scope.level==='city'?Promise.resolve(null):loadScoped().catch(function(){return null;});
  Promise.all([
    fetch('https://geosearch.planninglabs.nyc/v2/search?size=1&text='+encodeURIComponent(addr)).then(function(r){return r.json();}),
    loadSubwayStations(),loadCiti(),streetP
  ]).then(function(out){
    var geo=out[0];
    if(!geo.features||!geo.features.length){res.innerHTML='<span style="color:#c81e1e;font-size:.78rem">Address not found.</span>';return;}
    var f=geo.features[0],lat=f.geometry.coordinates[1],lng=f.geometry.coordinates[0],lbl=f.properties.label||addr;
    var d=out[3];
    var nSpeed=d?nearest(lat,lng,(d.speed||{}).features):null;
    var nBike=d?nearest(lat,lng,(d.bike||{}).features):null;
    var nStop=d?nearest(lat,lng,(d.busstops||{}).features):null;
    var nSub=nearest(lat,lng,out[1]);
    var citi=null,cd=Infinity;
    (out[2]||[]).forEach(function(s){var dd=hav(lat,lng,s.lat,s.lon);if(dd<cd){cd=dd;citi=s;}});
    var rows='';
    rows+=pRow('🛣','Speed',nSpeed?'<strong>'+(nSpeed.feat.properties.postvz_sl||'—')+' mph</strong> on '+escH(nSpeed.feat.properties.street||'nearby street')+(String(nSpeed.feat.properties.postvz_sg||'').toUpperCase()==='YES'?' <span style="background:#111;color:#fff;font-size:.65rem;padding:1px 5px;border-radius:3px">School Zone</span>':'')+'<br><span style="color:#888;font-size:.72rem">'+fmtD(nSpeed.dist)+' away</span>':'<span style="color:#888">Pick a borough or district to load street layers</span>');
    rows+=pRow('🚲','Bike',nBike?'<strong>'+bikeType(nBike.feat.properties)+'</strong> on '+escH(nBike.feat.properties.street||'nearby street')+'<br><span style="color:#888;font-size:.72rem">'+fmtD(nBike.dist)+' away</span>':'<span style="color:#888">—</span>');
    rows+=pRow('🚏','Bus Stop',nStop?'<strong>'+escH(nStop.feat.properties.stop_name||'Stop')+'</strong>'+(nStop.feat.properties.routes&&nStop.feat.properties.routes.length?'<br><span style="color:#555;font-size:.72rem">'+escH(nStop.feat.properties.routes.slice(0,6).join(', '))+'</span>':'')+'<br><span style="color:#888;font-size:.72rem">'+fmtD(nStop.dist)+' away</span>':'<span style="color:#888">—</span>');
    rows+=pRow('🚇','Subway',nSub?lineBadges(nSub.feat.properties.daytime_routes||nSub.feat.properties.routes)+'<strong style="margin-left:3px">'+escH(nSub.feat.properties.stop_name||'Station')+'</strong><br><span style="color:#888;font-size:.72rem">'+fmtD(nSub.dist)+' away</span>':'—');
    rows+=pRow('🚴','Citi Bike',citi?'<strong>'+escH(citi.name)+'</strong><br><span style="color:#888;font-size:.72rem">'+fmtD(Math.round(cd))+' away</span>':'—');
    if(searchMarker)map.removeLayer(searchMarker);
    searchMarker=L.marker([lat,lng],{zIndexOffset:9999}).addTo(map).bindTooltip('<strong>📍 '+escH(lbl)+'</strong>',{permanent:false,sticky:true});
    map.setView([lat,lng],16);
    res.innerHTML='<div style="font-family:DM Sans,sans-serif;font-weight:700;font-size:.82rem;color:#0d1b4b;margin-bottom:6px">📍 '+escH(lbl)+'</div><table style="border-collapse:collapse;width:100%;font-size:.78rem">'+rows+'</table>';
  }).catch(function(){res.innerHTML='<span style="color:#c81e1e;font-size:.78rem">Search failed.</span>';});
};
el('s-input').addEventListener('keydown',function(e){if(e.key==='Enter')window.doSearch();});

/* ---------- boot ---------- */
document.title=scope.label+' Transportation Map';
el('scope-title').innerHTML=escH(scope.level==='city'?'New York City':scope.label)+' <span>Transportation</span>';
if(scope.level==='cd'){
  var pl=el('profile-link');
  pl.href='cb-'+scope.short+'-'+scope.num+'.html#sec-transport';
  pl.textContent='CB'+scope.num+' profile ↗';
  pl.style.display='';
}
renderScopePicker();
renderToggles();
updateLegend();

loadBoundary().then(function(){
  var want=(qs.get('layers')||qs.get('l')||'').split(',').map(function(s){return s.trim();}).filter(Boolean);
  if(!want.length)want=scope.level==='city'?['subrt','subway']:['speed'];
  want.forEach(function(k){
    var btn=el('btn-'+k);
    if(btn&&!btn.hasAttribute('disabled')&&!visible[k])toggle(k,btn);
  });
}).catch(function(){status('Could not load district boundaries.');});
})();
</script>
