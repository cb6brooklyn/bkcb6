<div id="cb6cal">
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap');
#cb6cal{--navy:#06024D;--orange:#f47920;--line:#d9dbe6;--soft:#f4f5fa;font-family:'DM Sans',system-ui,sans-serif;color:#1a1a2e;margin:0 0 2rem}
#cb6cal *{box-sizing:border-box;font-family:inherit}
#cb6cal .c-top{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center;margin-bottom:.75rem}
#cb6cal .c-mo{font-size:1.35rem;font-weight:700;color:var(--navy);min-width:11rem;text-align:center}
#cb6cal button{cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:6px;padding:.4rem .7rem;font-size:.9rem}
#cb6cal button:hover{border-color:var(--navy)}
#cb6cal button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#cb6cal .c-sp{flex:1}
#cb6cal .c-bar{display:flex;flex-wrap:wrap;gap:.5rem;margin-bottom:.75rem;align-items:flex-start}
#cb6cal .c-q{flex:1 1 14rem;padding:.45rem .7rem;border:1px solid var(--line);border-radius:6px;font-size:.95rem}
#cb6cal details.c-dd{position:relative}
#cb6cal details.c-dd>summary{list-style:none;border:1px solid var(--line);border-radius:6px;padding:.45rem .8rem;cursor:pointer;background:#fff;color:var(--navy);font-weight:500;font-size:.95rem}
#cb6cal details.c-dd>summary::-webkit-details-marker{display:none}
#cb6cal details.c-dd[open]>summary{border-color:var(--navy)}
#cb6cal .c-panel{position:absolute;z-index:50;top:calc(100% + 4px);left:0;background:#fff;border:1px solid var(--navy);border-radius:8px;box-shadow:0 8px 24px rgba(6,2,77,.15);width:min(22rem,90vw);padding:.6rem}
#cb6cal .c-panel .c-pq{width:100%;padding:.35rem .55rem;border:1px solid var(--line);border-radius:5px;margin-bottom:.4rem;font-size:.9rem}
#cb6cal .c-panel .c-pa{display:flex;gap:.4rem;margin-bottom:.4rem}
#cb6cal .c-panel .c-pa button{font-size:.8rem;padding:.25rem .5rem}
#cb6cal .c-list-opts{max-height:18rem;overflow:auto}
#cb6cal .c-list-opts label{display:flex;align-items:center;gap:.45rem;padding:.25rem .2rem;font-size:.9rem;cursor:pointer;border-radius:4px}
#cb6cal .c-list-opts label:hover{background:var(--soft)}
#cb6cal .c-list-opts .n{margin-left:auto;font-family:'DM Mono',monospace;font-size:.78rem;color:#666}
#cb6cal .c-sw{width:.7rem;height:.7rem;border-radius:2px;flex:none}
#cb6cal .c-chips{display:flex;flex-wrap:wrap;gap:.35rem;margin-bottom:.75rem}
#cb6cal .c-chip{background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:.2rem .6rem;font-size:.8rem;cursor:pointer}
#cb6cal .c-chip:hover{border-color:var(--orange)}
#cb6cal .c-chip b{color:var(--orange);margin-left:.3rem}
#cb6cal .c-stat{font-family:'DM Mono',monospace;font-size:.8rem;color:#555;margin-bottom:.5rem}
#cb6cal .c-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
#cb6cal .c-dow{background:var(--navy);color:#fff;font-size:.78rem;font-weight:500;text-align:center;padding:.35rem 0;border-right:1px solid var(--navy)}
#cb6cal .c-day{min-height:6.5rem;border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:.25rem;overflow:hidden}
#cb6cal .c-day.out{background:#fafafa;color:#aaa}
#cb6cal .c-day.today{box-shadow:inset 0 0 0 2px var(--orange)}
#cb6cal .c-dn{font-family:'DM Mono',monospace;font-size:.78rem;margin-bottom:.2rem}
#cb6cal .c-ev{display:block;font-size:.74rem;line-height:1.25;padding:.15rem .3rem;margin-bottom:.15rem;border-radius:3px;border-left:3px solid;background:var(--soft);color:#1a1a2e;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#cb6cal .c-ev:hover{background:#e8e9f3}
#cb6cal .c-more{font-size:.72rem;color:var(--navy);cursor:pointer;background:none;border:none;padding:0 .3rem}
#cb6cal .c-li{display:flex;gap:.8rem;padding:.7rem .2rem;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
#cb6cal .c-li:hover{background:var(--soft)}
#cb6cal .c-ld{flex:none;width:4.2rem;text-align:center;font-family:'DM Mono',monospace;color:var(--navy)}
#cb6cal .c-ld b{display:block;font-size:1.4rem;font-family:'DM Sans',sans-serif}
#cb6cal .c-lt{font-weight:700;color:var(--navy)}
#cb6cal .c-lm{font-size:.85rem;color:#444;margin-top:.15rem}
#cb6cal .c-tag{display:inline-block;font-size:.72rem;padding:.05rem .45rem;border-radius:999px;margin:.25rem .25rem 0 0;border:1px solid var(--line);background:#fff}
#cb6cal .c-empty{padding:2rem;text-align:center;color:#666}
@media (max-width:700px){#cb6cal .c-day{min-height:4rem}#cb6cal .c-ev{font-size:0;height:.45rem;padding:0;margin:.1rem 0;border-left-width:0}#cb6cal .c-more{font-size:.65rem}}
</style>
<div class="c-top">
<button data-a="prev" aria-label="Previous month">&larr;</button><div class="c-mo"></div><button data-a="next" aria-label="Next month">&rarr;</button><button data-a="today">Today</button>
<span class="c-sp"></span>
<button data-v="month">Month</button><button data-v="list">List</button>
</div>
<div class="c-bar">
<input class="c-q" type="search" placeholder="Search events">
<details class="c-dd" data-f="org"><summary>Organization</summary><div class="c-panel"><input class="c-pq" placeholder="Find an organization"><div class="c-pa"><button data-all>Select all</button><button data-none>Clear</button></div><div class="c-list-opts"></div></div></details>
<details class="c-dd" data-f="cat"><summary>Category</summary><div class="c-panel"><div class="c-pa"><button data-all>Select all</button><button data-none>Clear</button></div><div class="c-list-opts"></div></div></details>
<button data-a="reset">Show everything</button>
</div>
<div class="c-chips"></div>
<div class="c-stat"></div>
<div class="c-body"></div>
<script>
(function(){
var R=document.getElementById('cb6cal');
var API='/wp-json/tribe/events/v1/events';
var COLORS={'CB6 Meetings':'#06024D','Full Board Meetings':'#06024D','Upcoming Meetings':'#06024D','Government':'#3d5aad','Elections':'#b42318','City Notices':'#6b7280','Schools':'#0e7490','Public Safety':'#1d4ed8','Community':'#2d6a4f','Civic Associations':'#15803d','Arts \x26 Culture':'#9333ea','Food \x26 Markets':'#c2410c','Parks \x26 Open Space':'#4d7c0f','Land Use':'#a16207','Uncategorized':'#9ca3af'};
var RULES=[
[/^CB6 |Community Board 6/i,'Brooklyn Community Board 6'],
[/Alternate Side|^ASP /i,'Alternate Side Parking'],
[/Early Voting|Election Day|^General:|voter reg|mail ballot|🗳/i,'NYC Board of Elections'],
[/Schools Closed|School —|Day of School|Remote Learning|Recess/i,'NYC Public Schools'],
[/City Council/i,'NYC City Council'],
[/^BKBP|Borough President/i,'Brooklyn Borough President'],
[/76th Precinct/i,'76th Precinct Community Council'],
[/78th Precinct/i,'78th Precinct Community Council'],
[/Grown-Up Bike Bus/i,'Grown-Up Bike Bus'],
[/Park Slope Farmers Market/i,'Park Slope Farmers Market'],
[/Park Slope Food Coop/i,'Park Slope Food Coop'],
[/CHiPS/i,'CHiPS'],
[/Gounardes/i,'Senator Andrew Gounardes'],
[/Jo Anne Simon/i,'Assemblymember Jo Anne Simon'],
[/Arts Gowanus/i,'Arts Gowanus'],
[/Brooklyn Folk Fest/i,'Brooklyn Folk Festival'],
[/^BMT |Brooklyn Marine Terminal/i,'Brooklyn Marine Terminal'],
[/^FAC\b/i,'Fifth Avenue Committee'],
[/^BKCM/i,'Brooklyn Conservatory of Music'],
[/^Nitehawk/i,'Nitehawk Cinema'],
[/^Winner and a Show/i,'Winner']
];
var HOSTS={'gowanusdredgers.org':'Gowanus Dredgers Canoe Club','brooklynbp.nyc.gov':'Brooklyn Borough President','chipsonline.org':'CHiPS','brooklynbridgepark.org':'Brooklyn Bridge Park','nitehawkcinema.com':'Nitehawk Cinema','theoldstonehouse.org':'Old Stone House','gowanuscanalconservancy.org':'Gowanus Canal Conservancy','pioneerworks.org':'Pioneer Works','bbg.org':'Brooklyn Botanic Garden','bklynlibrary.org':'Brooklyn Public Library','council.nyc.gov':'NYC City Council','legistar.council.nyc.gov':'NYC City Council','cssny.us':'Community Service Society','resilientredhook.com':'Resilient Red Hook','bkcm.org':'Brooklyn Conservatory of Music','winner.nyc':'Winner'};
var NOPREFIX=/^(General|Applications due|Paying for College|City of Forest Day)$/i;
function dec(s){var t=document.createElement('textarea');t.innerHTML=s||'';return t.value}
function orgOf(e,t){
 if(e.organizer?(e.organizer.length?e.organizer[0].organizer:0):0) return dec(e.organizer[0].organizer);
 for(var i=0;i<RULES.length;i++) if(RULES[i][0].test(t)) return RULES[i][1];
 var m=t.match(/^([^:—–]{2,40}):\s/); if(m){if(!NOPREFIX.test(m[1].trim())) return m[1].trim();}
 var h='';try{h=new URL(e.website).host.replace(/^www\./,'')}catch(x){}
 if(HOSTS[h]) return HOSTS[h];
 return 'Other';
}
var P=new URLSearchParams(location.search);
var now=new Date();
var S={y:now.getFullYear(),m:now.getMonth(),view:P.get('view')==='list'?'list':'month',q:P.get('q')||'',org:new Set((P.get('org')||'').split('|').filter(Boolean)),cat:new Set((P.get('cat')||'').split('|').filter(Boolean)),ev:[],cache:{}};
var pm=(P.get('month')||'').match(/^(\d{4})-(\d{2})$/); if(pm){S.y=+pm[1];S.m=+pm[2]-1}
var MO=['January','February','March','April','May','June','July','August','September','October','November','December'];
function pad(n){return (n<10?'0':'')+n}
function ymd(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function range(){var f=new Date(S.y,S.m,1);var s=new Date(f);s.setDate(1-f.getDay());var l=new Date(S.y,S.m+1,0);var e=new Date(l);e.setDate(l.getDate()+(6-l.getDay()));return [s,e]}
function load(){
 var r=range(),key=ymd(r[0]);
 if(S.cache[key]){S.ev=S.cache[key];render();return}
 R.querySelector('.c-body').innerHTML='<div class="c-empty">Loading events…</div>';
 var out=[],page=1;
 (function next(){
  fetch(API+'?per_page=50\x26page='+page+'\x26start_date='+ymd(r[0])+'%2000:00:00\x26end_date='+ymd(r[1])+'%2023:59:59').then(function(x){return x.ok?x.json():{events:[]}}).then(function(j){
   (j.events||[]).forEach(function(e){var t=dec(e.title);var cats=(e.categories||[]).map(function(c){return dec(c.name)});if(!cats.length)cats=['Uncategorized'];
    out.push({t:t,url:e.url,s:e.start_date,e:e.end_date,all:e.all_day,venue:(e.venue?e.venue.venue:0)?dec(e.venue.venue):'',org:orgOf(e,t),cats:cats})});
   if(j.next_rest_url?(j.events||[]).length:0){page++;next()} else {out.sort(function(a,b){return a.s<b.s?-1:a.s>b.s?1:0});S.cache[key]=out;S.ev=out;render()}
  }).catch(function(){R.querySelector('.c-body').innerHTML='<div class="c-empty">Events could not be loaded. Refresh to try again.</div>'});
 })();
}
function match(v){
 if(S.org.size){if(!S.org.has(v.org)) return false;}
 if(S.cat.size){if(!v.cats.some(function(c){return S.cat.has(c)})) return false;}
 if(S.q){var q=S.q.toLowerCase();if((v.t+' '+v.venue+' '+v.org).toLowerCase().indexOf(q)<0) return false}
 return true;
}
function color(v){return COLORS[v.cats[0]]||'#06024D'}
function esc(s){return String(s).replace(/[\x26<>"]/g,function(c){return {'\x26':'\x26amp;','<':'\x26lt;','>':'\x26gt;','"':'\x26quot;'}[c]})}
function tm(v){if(v.all)return 'All day';if(v.s.slice(11,16)==='00:00')return '';var h=+v.s.slice(11,13),mi=v.s.slice(14,16);return ((h%12)||12)+(mi!=='00'?':'+mi:'')+(h<12?'am':'pm')}
function inMo(v){return (+v.s.slice(0,4)===S.y)?(+v.s.slice(5,7)===S.m+1):false}
function counts(field){var c={};S.ev.filter(inMo).forEach(function(v){(field==='org'?[v.org]:v.cats).forEach(function(k){c[k]=(c[k]||0)+1})});(field==='org'?S.org:S.cat).forEach(function(k){if(!(k in c))c[k]=0});return c}
function opts(field){
 var box=R.querySelector('[data-f="'+field+'"] .c-list-opts'),c=counts(field),set=field==='org'?S.org:S.cat;
 var keys=Object.keys(c).sort(function(a,b){if(a==='Other'||a==='Uncategorized')return 1;if(b==='Other'||b==='Uncategorized')return -1;return a.localeCompare(b)});
 var fq=(R.querySelector('[data-f="'+field+'"] .c-pq')||{}).value||'';
 box.innerHTML=keys.filter(function(k){return !fq||k.toLowerCase().indexOf(fq.toLowerCase())>=0}).map(function(k){
  var sw=field==='cat'?'<span class="c-sw" style="background:'+(COLORS[k]||'#06024D')+'"></span>':'';
  return '<label><input type="checkbox" value="'+esc(k)+'"'+(set.has(k)?' checked':'')+'>'+sw+esc(k)+'<span class="n">'+c[k]+'</span></label>'}).join('');
 var sum=R.querySelector('[data-f="'+field+'"]>summary');sum.textContent=(field==='org'?'Organization':'Category')+(set.size?' ('+set.size+')':'');
}
function syncURL(){
 var p=new URLSearchParams(location.search);
 ['org','cat','q','view','month'].forEach(function(k){p.delete(k)});
 if(S.org.size)p.set('org',[].slice.call(S.org).join('|'));
 if(S.cat.size)p.set('cat',[].slice.call(S.cat).join('|'));
 if(S.q)p.set('q',S.q);
 if(S.view==='list')p.set('view','list');
 var n=new Date();if(S.y!==n.getFullYear()||S.m!==n.getMonth())p.set('month',S.y+'-'+pad(S.m+1));
 var qs=p.toString();history.replaceState(null,'',location.pathname+(qs?'?'+qs:'')+location.hash);
}
function render(){
 R.querySelector('.c-mo').textContent=MO[S.m]+' '+S.y;
 [].forEach.call(R.querySelectorAll('[data-v]'),function(b){b.classList.toggle('on',b.dataset.v===S.view)});
 opts('org');opts('cat');
 var chips=[];S.org.forEach(function(k){chips.push(['org',k])});S.cat.forEach(function(k){chips.push(['cat',k])});
 R.querySelector('.c-chips').innerHTML=chips.map(function(c){return '<span class="c-chip" data-rm="'+c[0]+'" data-k="'+esc(c[1])+'">'+esc(c[1])+'<b>×</b></span>'}).join('');
 var inMonth=S.ev.filter(function(v){return (+v.s.slice(0,4)===S.y)?(+v.s.slice(5,7)===S.m+1):false});
 var shown=inMonth.filter(match);
 R.querySelector('.c-stat').textContent=shown.length+' of '+inMonth.length+' events in '+MO[S.m]+' '+S.y;
 var b=R.querySelector('.c-body');
 if(S.view==='list'){
  b.innerHTML=shown.length?shown.map(function(v){var d=new Date(v.s.slice(0,10)+'T12:00:00');
   return '<a class="c-li" href="'+esc(v.url)+'"><div class="c-ld">'+['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+'<b>'+d.getDate()+'</b>'+MO[d.getMonth()].slice(0,3)+'</div><div><div class="c-lt">'+esc(v.t)+'</div><div class="c-lm">'+[tm(v),esc(v.venue)].filter(Boolean).join(' · ')+'</div><div><span class="c-tag">'+esc(v.org)+'</span>'+v.cats.map(function(c){return '<span class="c-tag" style="border-color:'+(COLORS[c]||'#06024D')+'">'+esc(c)+'</span>'}).join('')+'</div></div></a>'}).join(''):'<div class="c-empty">No events match these filters this month.</div>';
 } else {
  var r=range(),by={};S.ev.filter(match).forEach(function(v){var k=v.s.slice(0,10);(by[k]=by[k]||[]).push(v)});
  var h='';['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].forEach(function(d){h+='<div class="c-dow">'+d+'</div>'});
  var today=ymd(new Date());
  for(var d=new Date(r[0]);d<=r[1];d.setDate(d.getDate()+1)){
   var k=ymd(d),list=by[k]||[],out=d.getMonth()!==S.m;
   h+='<div class="c-day'+(out?' out':'')+(k===today?' today':'')+'"><div class="c-dn">'+d.getDate()+'</div>'+list.map(function(v,i){return '<a class="c-ev" data-i="'+i+'"'+(i>3?' hidden':'')+' href="'+esc(v.url)+'" title="'+esc([tm(v),v.t,v.org].filter(Boolean).join(' · '))+'" style="border-left-color:'+color(v)+'">'+(tm(v)?(v.all?'':tm(v)+' '):'')+esc(v.t)+'</a>'}).join('')+(list.length>4?'<button class="c-more">+'+(list.length-4)+' more</button>':'')+'</div>';
  }
  b.innerHTML='<div class="c-grid">'+h+'</div>';
 }
 syncURL();
}
R.addEventListener('click',function(e){
 var t=e.target,a=t.closest('[data-a]'),v=t.closest('[data-v]'),rm=t.closest('[data-rm]');
 if(a){var x=a.dataset.a;if(x==='prev'){S.m--;if(S.m<0){S.m=11;S.y--}load()}else if(x==='next'){S.m++;if(S.m>11){S.m=0;S.y++}load()}else if(x==='today'){var n=new Date();S.y=n.getFullYear();S.m=n.getMonth();load()}else if(x==='reset'){S.org.clear();S.cat.clear();S.q='';R.querySelector('.c-q').value='';render()}}
 if(v){S.view=v.dataset.v;render()}
 if(rm){(rm.dataset.rm==='org'?S.org:S.cat).delete(rm.dataset.k);render()}
 if(t.matches('.c-more')){[].forEach.call(t.parentNode.querySelectorAll('.c-ev[hidden]'),function(x){x.hidden=false});t.remove()}
 var dd=t.closest('details.c-dd');
 if(dd?(t.matches('[data-all]')||t.matches('[data-none]')):false){e.preventDefault();var set=dd.dataset.f==='org'?S.org:S.cat;if(t.matches('[data-none]'))set.clear();else [].forEach.call(dd.querySelectorAll('.c-list-opts input'),function(i){set.add(i.value)});render();dd.open=true}
 if(!t.closest('details.c-dd'))[].forEach.call(R.querySelectorAll('details.c-dd[open]'),function(x){x.open=false});
});
R.addEventListener('change',function(e){var t=e.target,dd=t.closest('details.c-dd');if(dd?t.type==='checkbox':false){var set=dd.dataset.f==='org'?S.org:S.cat;t.checked?set.add(t.value):set.delete(t.value);render();dd.open=true}});
R.addEventListener('input',function(e){var t=e.target;if(t.matches('.c-q')){S.q=t.value.trim();render()}if(t.matches('.c-pq'))opts('org')});
R.addEventListener('toggle',function(e){if(e.target.open)[].forEach.call(R.querySelectorAll('details.c-dd[open]'),function(x){if(x!==e.target)x.open=false})},true);
document.addEventListener('click',function(e){if(!R.contains(e.target))[].forEach.call(R.querySelectorAll('details.c-dd[open]'),function(x){x.open=false})});
R.querySelector('.c-q').value=S.q;
load();
})();
</script>
</div>
