  <!-- GLOSSARY + GUIDE TO REGULATIONS (data: /data/glossary.json, built by tools/build_glossary.py) -->
  <style>
  .gx-bar{padding:14px 20px 10px;background:var(--off);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
  .gx-search{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-family:'DM Sans',sans-serif;font-size:.86rem;color:var(--navy);outline:none;box-sizing:border-box;background:#fff}
  .gx-search:focus{border-color:var(--orange)}
  .gx-seg{display:flex;gap:0;margin:10px 0 2px;border:1.5px solid var(--navy);border-radius:999px;overflow:hidden;width:max-content;max-width:100%}
  .gx-seg button{border:none;background:#fff;color:var(--navy);font:700 .74rem 'DM Sans',sans-serif;padding:6px 14px;cursor:pointer}
  .gx-seg button.on{background:var(--navy);color:#fff}
  .gx-lbl{font:600 .6rem 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:10px 0 6px}
  .gx-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .gx-row::-webkit-scrollbar{display:none}
  .gx-chip{flex:none;display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1.5px solid var(--border);background:#fff;color:var(--navy);font:600 .74rem 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
  .gx-chip img{width:18px;height:18px;object-fit:contain;border-radius:3px}
  .gx-chip .n{font:500 .62rem 'DM Mono',monospace;color:var(--muted)}
  .gx-chip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .gx-chip.on .n{color:#ffd3b0}
  .gx-count{padding:8px 20px;font:500 .7rem 'DM Mono',monospace;color:var(--muted);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
  .gx-count button{border:none;background:none;color:var(--orange);font:600 .7rem 'DM Mono',monospace;cursor:pointer;padding:0}
  .gx-grp{border-bottom:1px solid var(--border);background:#fff}
  .gx-grp>summary{list-style:none;cursor:pointer;padding:14px 20px;display:flex;align-items:center;gap:10px}
  .gx-grp>summary::-webkit-details-marker{display:none}
  .gx-grp>summary .t{flex:1;font-weight:700;color:var(--navy);font-size:.95rem}
  .gx-grp>summary .c{font:500 .66rem 'DM Mono',monospace;color:var(--muted)}
  .gx-grp>summary .ch{color:var(--orange);font-weight:700;transition:transform .15s}
  .gx-grp[open]>summary .ch{transform:rotate(90deg)}
  .gx-logos{display:flex;gap:3px}
  .gx-logos img{width:20px;height:20px;object-fit:contain;border-radius:4px;background:#fff}
  .gx-sub{font:600 .6rem 'DM Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--orange);padding:10px 20px 4px;background:#faf9f6}
  .gx-e{padding:13px 20px;border-top:1px solid #f0ede8;background:#fff;scroll-margin-top:170px}
  .gx-e:target{background:#fff6ee}
  .gx-e .h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
  .gx-e .term{font-size:.9rem;font-weight:700;color:var(--navy)}
  .gx-e .aka{font-size:.72rem;color:var(--muted);margin-top:1px}
  .gx-e .d{margin-top:6px;font-size:.81rem;color:#374151;line-height:1.65}
  .gx-e .m{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .gx-ag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px 2px 3px;border-radius:999px;background:#f3f1ec;color:var(--navy);font:600 .64rem 'DM Sans',sans-serif;cursor:pointer;border:none}
  .gx-ag img{width:16px;height:16px;object-fit:contain;border-radius:3px;background:#fff}
  .gx-ag.noimg{padding-left:8px}
  .gx-src{font:500 .62rem 'DM Mono',monospace;color:var(--muted);text-decoration:none}
  .gx-src:hover{color:var(--orange)}
  .gx-area{font:600 .58rem 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:10px;background:#eef2ff;color:var(--navy);white-space:nowrap;border:none;cursor:pointer}
  .gx-r{border-left:4px solid var(--orange)}
  .gx-r .who{font:700 .6rem 'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:#fff;background:var(--orange);padding:2px 8px;border-radius:999px;white-space:nowrap}
  .gx-r .pen{margin-top:6px;font-size:.76rem;color:#9a3412;background:#fff4ec;border-radius:6px;padding:6px 9px;line-height:1.5}
  .gx-copy{border:none;background:none;color:var(--muted);cursor:pointer;font-size:.8rem;padding:0 2px}
  .gx-more{display:block;width:100%;padding:11px;border:none;border-top:1px solid #f0ede8;background:#faf9f6;color:var(--orange);font:700 .78rem 'DM Sans',sans-serif;cursor:pointer}
  .gx-empty{padding:24px 20px;text-align:center;color:#9ca3af;font-size:.84rem}
  mark{background:#ffe3c9;color:inherit;border-radius:2px}
  </style>

  <div class="gx-bar" id="gloss-top">
    <input id="gloss-search" class="gx-search" type="search" placeholder="Search terms, rules, acronyms or agencies (e.g. FAR, heat season, CO, setout)" autocomplete="off">
    <div class="gx-seg" id="gx-kind">
      <button data-k="all" class="on">Everything</button>
      <button data-k="terms">Glossary terms</button>
      <button data-k="rules">Rules &amp; regulations</button>
    </div>
    <div class="gx-lbl">By policy area</div>
    <div class="gx-row" id="gx-areas"></div>
    <div class="gx-lbl">By agency</div>
    <div class="gx-row" id="gx-agencies"></div>
  </div>
  <div class="gx-count"><span id="gloss-count">Loading the glossary…</span><button id="gx-reset" hidden>Clear filters</button></div>
  <div id="gloss-list"></div>
