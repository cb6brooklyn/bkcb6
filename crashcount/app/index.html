<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CrashCount &mdash; bkcb6.app</title>
<style>
:root{--navy:#0d1b4b;--orange:#f47920;--muted:#6b6760}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',-apple-system,system-ui,sans-serif;background:#fff;color:var(--navy)}
.h{display:flex;align-items:center;gap:10px;padding:10px 12px}
.h img{width:36px;height:36px;border-radius:8px;flex:none}
.h b{font-size:.95rem;font-weight:800}
.l{font:700 .62rem ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:10px 12px 4px}
iframe{display:block;width:100%;border:0}
.f{font-size:.78rem;color:var(--muted);padding:8px 12px 14px}
.off{margin:12px;padding:14px;border:1px solid #e5e2db;border-radius:12px;font-size:.88rem;line-height:1.45}
</style></head>
<body>
<div class="h" style="display:block;background:#111629;border-radius:12px;padding:10px 12px"><img src="../../site-icons/crashcount-wordmark.png" alt="CrashCount.nyc" style="display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border-radius:0"><b id="t" style="display:block;color:#fff;font-weight:400;font-size:.82rem;margin-top:6px">This crash map and counter are from CrashCount.nyc. They are not made by bkcb6.app or Community Board 6.</b></div>
<div id="b"></div>
<script>
(function(){
  var q=new URLSearchParams(location.search), cb=q.get('cb'), layer=q.get('layer'), id=q.get('id');
  var PATH={council:'council-district',assembly:'assembly-district',senate:'senate-district',community:'community-board',borough:'borough',citywide:'citywide',precinct:'police-precinct'};
  if(cb){layer='community';id=cb}
  var b=document.getElementById('b');
  if(!layer||!id||!PATH[layer]){b.innerHTML='<div class="off">No district given.</div>';return}
  var path=PATH[layer]+'/'+encodeURIComponent(id)+'/';
  if(navigator.onLine===false){b.innerHTML='<div class="off">CrashCount’s map and counts load from crashcount.nyc and need a connection.</div>';return}
  function fr(src,h,t){var f=document.createElement('iframe');f.src=src;f.height=h;f.title=t;return f}
  var l1=document.createElement('div');l1.className='l';l1.textContent='Crash map';b.appendChild(l1);
  b.appendChild(fr('https://crashcountnyc.com/'+path+'#crash-map',700,'CrashCount crash map'));
  var l2=document.createElement('div');l2.className='l';l2.textContent='Crash counter';b.appendChild(l2);
  b.appendChild(fr('https://crashcountnyc.com/embed/'+layer+'/'+encodeURIComponent(id)+'/',700,'CrashCount crash counter'));
  var f=document.createElement('div');f.className='f';f.textContent='From CrashCount (crashcount.nyc), from NYPD crash reports.';b.appendChild(f);
})();
</script>
</body></html>
