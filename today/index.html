<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CB6 Today">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1b4b">
<meta property="og:site_name" content="Brooklyn Community Board 6">
<meta property="og:type" content="website">
<meta property="og:title" content="Today in CB6">
<meta property="og:description" content="What is happening in Brooklyn Community Board 6 today. Meetings, street closures, filming, construction, and housing deadlines.">
<meta property="og:url" content="https://bkcb6.app/today">
<meta property="og:image" content="https://bkcb6.app/og-bkrents.png">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://bkcb6.app/og-bkrents.png">
<title>Today in CB6 — bkcb6.app</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700;900&display=swap');
:root{--navy:#0d1b4b;--navy2:#132D65;--orange:#f47920;--off:#f8f7f4;--border:#e5e2db;--muted:#6b6760;--red:#c0392b;--green:#2e6b30}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:'DM Sans',sans-serif;background:var(--navy);color:var(--navy);overflow-x:hidden}
.app{max-width:560px;margin:0 auto;min-height:100%;background:var(--off);position:relative;overflow:hidden}

/* header */
.hdr{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 16px) 18px 16px;position:relative}
.hdr:after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--orange)}
.hrow{display:flex;align-items:flex-end;gap:14px}
.dnum{font-size:3.5rem;font-weight:900;line-height:.85;letter-spacing:-.04em;color:var(--orange)}
.dmeta{flex:1;min-width:0;padding-bottom:3px}
.dow{font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.65)}
.mon{font-size:1.15rem;font-weight:900;letter-spacing:.01em;margin-top:1px}
.sub{font-size:.7rem;color:rgba(255,255,255,.6);margin-top:9px;line-height:1.45}

.alert{padding:11px 16px;background:var(--red);color:#fff;font-size:.8rem;font-weight:700;line-height:1.45;display:none}
.alert a{color:#fff}

/* tile grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px 12px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:118px;
  padding:13px;background:#fff;border:1px solid var(--border);border-radius:16px;cursor:pointer;
  text-align:left;font-family:'DM Sans',sans-serif;color:var(--navy);transition:transform .12s,box-shadow .12s;
  box-shadow:0 1px 3px rgba(13,27,75,.06)}
.tile:active{transform:scale(.97)}
.tile .ic{font-size:1.6rem;line-height:1}
.tile .lab{font-size:.86rem;font-weight:800;line-height:1.25;margin-top:auto}
.tile .cnt{font-family:'DM Mono',monospace;font-size:.66rem;color:var(--muted);font-weight:700;margin-top:3px}
.tile .badge{position:absolute;top:11px;right:11px;min-width:24px;height:24px;padding:0 7px;border-radius:12px;
  background:var(--orange);color:#fff;font-family:'DM Mono',monospace;font-size:.72rem;font-weight:700;
  display:flex;align-items:center;justify-content:center}
.tile .badge.zero{background:#e8e6e1;color:var(--muted)}
.tile .badge.hot{background:var(--red)}
.tile.wide{grid-column:1 / -1;min-height:0;flex-direction:row;align-items:center;gap:13px}
.tile.wide .ic{font-size:1.5rem}
.tile.wide .lab{margin-top:0}
.tile.stat{grid-column:1 / -1;background:var(--navy2);border-color:var(--navy2);color:#fff;min-height:0;display:block}
.tile.stat .k{font-family:'DM Mono',monospace;font-size:.54rem;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.6);font-weight:700}
.tile.stat .v{font-family:'DM Mono',monospace;font-size:1.75rem;font-weight:900;color:var(--orange);line-height:1;margin:4px 0 3px}
.tile.stat .d{font-size:.74rem;color:rgba(255,255,255,.82);line-height:1.5}

.sechd{padding:4px 14px 0;font-family:'DM Mono',monospace;font-size:.54rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
.links{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:8px 12px 26px}
.links a{display:flex;align-items:center;gap:8px;padding:12px;background:#fff;border:1px solid var(--border);
  border-radius:26px;text-decoration:none;color:var(--navy);font-size:.79rem;font-weight:700}
.links a .ic{font-size:1.1rem}

/* detail view slides over */
.detail{position:fixed;inset:0;background:var(--off);z-index:50;transform:translateX(100%);
  transition:transform .22s ease;display:flex;flex-direction:column;max-width:560px;margin:0 auto}
.detail.open{transform:translateX(0)}
.dhdr{background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
  display:flex;align-items:center;gap:11px;border-bottom:3px solid var(--orange);flex:none}
.back{width:34px;height:34px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;
  color:#fff;font-size:1.1rem;cursor:pointer;flex:none;display:flex;align-items:center;justify-content:center}
.dttl{font-size:1rem;font-weight:900;flex:1;min-width:0}
.dcnt{font-family:'DM Mono',monospace;font-size:.66rem;color:rgba(255,255,255,.6)}
.dbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom) + 24px)}

.row{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;gap:11px;align-items:flex-start;background:#fff}
.tm{font-family:'DM Mono',monospace;font-size:.68rem;font-weight:700;color:var(--orange);min-width:64px;padding-top:1px}
.bd{flex:1;min-width:0}
.bd .n{font-size:.85rem;font-weight:700;line-height:1.35}
.bd .m{font-size:.75rem;color:var(--muted);line-height:1.45;margin-top:2px}
.bd a{color:var(--navy);text-decoration:none;border-bottom:1px solid var(--orange)}
.empty{padding:22px 16px;font-family:'DM Mono',monospace;font-size:.76rem;color:#9ca3af;line-height:1.6;text-align:center}
.tag{display:inline-block;font-family:'DM Mono',monospace;font-size:.55rem;text-transform:uppercase;letter-spacing:.06em;
  padding:2px 6px;border-radius:4px;background:#eef0f4;color:var(--muted);font-weight:700;margin-right:5px}
.tag.soon{background:#fdeaea;color:var(--red)}
.tag.today{background:#fff1e5;color:var(--orange)}
.note{padding:13px 15px;font-family:'DM Mono',monospace;font-size:.66rem;color:#9ca3af;line-height:1.65;background:var(--off)}
.foot{padding:16px 14px calc(env(safe-area-inset-bottom) + 30px);font-family:'DM Mono',monospace;font-size:.62rem;
  color:#9ca3af;line-height:1.7;text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="hdr">
    <div class="hrow">
      <div class="dnum" id="dnum">&nbsp;</div>
      <div class="dmeta"><div class="dow" id="dow">&nbsp;</div><div class="mon" id="mon">&nbsp;</div></div>
    </div>
    <div class="sub">Brooklyn Community Board 6 &middot; Carroll Gardens, Cobble Hill, Columbia Waterfront, Gowanus, Park Slope, Red Hook</div>
  </div>
  <div class="alert" id="alert"></div>

  <div class="grid" id="grid">
    <button class="tile" data-k="events"><span class="badge zero" id="b-events">&middot;</span><span class="ic">&#128197;</span><span class="lab">Meetings &amp; events</span><span class="cnt" id="c-events">loading</span></button>
    <button class="tile" data-k="street"><span class="badge zero" id="b-street">&middot;</span><span class="ic">&#128679;</span><span class="lab">Streets today</span><span class="cnt" id="c-street">loading</span></button>
    <button class="tile" data-k="film"><span class="badge zero" id="b-film">&middot;</span><span class="ic">&#127916;</span><span class="lab">Filming today</span><span class="cnt" id="c-film">loading</span></button>
    <button class="tile" data-k="dob"><span class="badge zero" id="b-dob">&middot;</span><span class="ic">&#127959;</span><span class="lab">Construction</span><span class="cnt" id="c-dob">loading</span></button>
    <button class="tile wide" data-k="lot"><span class="badge zero" id="b-lot">&middot;</span><span class="ic">&#127968;</span><span class="lab">Housing lottery deadlines</span></button>
    <div class="tile stat" id="stat"><div class="k">Number of the day</div><div class="v">&mdash;</div><div class="d">Loading&hellip;</div></div>
  </div>

  <div class="sechd">Explore the district</div>
  <div class="links">
    <a href="/bkrents/"><span class="ic">&#128181;</span>Brooklyn rents</a>
    <a href="/allhousing"><span class="ic">&#127959;</span>All housing built</a>
    <a href="/lessexpensive"><span class="ic">&#127974;</span>Affordable housing</a>
    <a href="/built"><span class="ic">&#128202;</span>What got built</a>
    <a href="/housing"><span class="ic">&#128506;</span>Housing hub</a>
    <a href="/"><span class="ic">&#127968;</span>CB6 &amp; Beyond</a>
  </div>
  <div class="foot" id="foot"></div>
</div>

<div class="detail" id="detail">
  <div class="dhdr"><button class="back" id="back">&#8249;</button><div class="dttl" id="dttl"></div><div class="dcnt" id="dcnt"></div></div>
  <div class="dbody" id="dbody"></div>
</div>

<script>
(function(){
  var $=function(i){return document.getElementById(i);};
  var DOW=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
  var now=new Date();
  var todayISO=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
  $('dnum').textContent=now.getDate();
  $('dow').textContent=DOW[now.getDay()];
  $('mon').textContent=MON[now.getMonth()]+' '+now.getFullYear();

  function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function fmtTime(iso){var d=new Date(iso); if(isNaN(d))return '';var h=d.getHours(),m=d.getMinutes(),ap=h>=12?'pm':'am';h=h%12||12;return h+(m?(':'+String(m).padStart(2,'0')):'')+ap;}
  function sameDay(iso){return iso&&String(iso).slice(0,10)===todayISO;}
  function daysUntil(iso){if(!iso)return null;var d=new Date(String(iso).slice(0,10)+'T12:00:00');if(isNaN(d))return null;return Math.round((d-new Date(todayISO+'T12:00:00'))/86400000);}
  function row(t,n,m){return '<div class="row"><div class="tm">'+esc(t||'')+'</div><div class="bd"><div class="n">'+n+'</div>'+(m?'<div class="m">'+m+'</div>':'')+'</div></div>';}

  var DATA={};
  function setTile(k,count,label,hot){
    var b=$('b-'+k), c=$('c-'+k);
    if(b){ b.textContent=count; b.className='badge'+(count?(hot?' hot':''):' zero'); }
    if(c) c.textContent=label;
  }
  function open(k){
    var d=DATA[k]; if(!d) return;
    $('dttl').textContent=d.title;
    $('dcnt').textContent=d.rows.length?(d.rows.length+(d.rows.length===1?' item':' items')):'';
    $('dbody').innerHTML=(d.rows.length?d.rows.join(''):'<div class="empty">'+d.empty+'</div>')+(d.note?'<div class="note">'+d.note+'</div>':'');
    $('detail').classList.add('open');
    history.pushState({d:1},'');
  }
  function close(){ $('detail').classList.remove('open'); }
  $('back').addEventListener('click',function(){ history.back(); });
  window.addEventListener('popstate',close);
  document.querySelectorAll('.tile[data-k]').forEach(function(t){
    t.addEventListener('click',function(){ open(t.getAttribute('data-k')); });
  });

  fetch('/heat.json').then(function(r){return r.json();}).then(function(h){
    var t=h.heatEmergency?h.title:(h.floodWatch?h.floodWatchTitle:(h.tornadoWatch?h.tornadoWatchTitle:''));
    if(t){ $('alert').style.display='block'; $('alert').innerHTML=esc(t)+' <a href="/weather.html">Details</a>'; }
  }).catch(function(){});

  fetch('/data/calendar-events.json').then(function(r){return r.json();}).then(function(d){
    var up=(d.events||[]).filter(function(e){return e.date>=todayISO;}).sort(function(a,b){return a.date<b.date?-1:1;});
    var todayN=up.filter(function(e){return e.date===todayISO;}).length;
    DATA.events={title:'Meetings & events',empty:'Nothing on the board calendar right now.',
      rows:up.slice(0,25).map(function(e){
        var dd=daysUntil(e.date);
        var when=dd===0?'Today':(dd===1?'Tomorrow':MON[+e.date.slice(5,7)-1].slice(0,3)+' '+(+e.date.slice(8,10)));
        var tag=dd===0?'<span class="tag today">today</span>':'';
        var link=e.href?('<a href="'+esc(e.href)+'" target="_blank" rel="noopener">'+esc(e.label)+'</a>'):esc(e.label);
        return row(when,tag+link,[e.time,e.location].filter(Boolean).map(esc).join(' &middot; '));
      })};
    setTile('events',todayN||up.length,todayN?(todayN+' today'):(up.length+' upcoming'),todayN>0);
  }).catch(function(){ setTile('events',0,'unavailable'); });

  fetch('/data/cb6_permitted_events.json').then(function(r){return r.json();}).then(function(d){
    var t=(d.rows||[]).filter(function(e){return sameDay(e.start_datetime);}).sort(function(a,b){return a.start_datetime<b.start_datetime?-1:1;});
    DATA.street={title:'Streets today',empty:'No permitted street events in the district today.',
      rows:t.map(function(e){return row(fmtTime(e.start_datetime),esc(e.event_name),[e.event_location,e.event_agency].filter(Boolean).map(esc).join(' &middot; '));})};
    setTile('street',t.length,t.length?'permitted today':'nothing today');
  }).catch(function(){ setTile('street',0,'unavailable'); });

  fetch('/data/cb6_film_permits.json').then(function(r){return r.json();}).then(function(d){
    var t=(d.rows||[]).filter(function(e){return sameDay(e.start_datetime);}).sort(function(a,b){return a.start_datetime<b.start_datetime?-1:1;});
    DATA.film={title:'Filming today',empty:'No film permits in the district today.',
      rows:t.map(function(e){return row(fmtTime(e.start_datetime),esc(e.event_type||'Filming'),esc(e.parking_held||'').slice(0,180));})};
    setTile('film',t.length,t.length?'shoots today':'nothing today');
  }).catch(function(){ setTile('film',0,'unavailable'); });

  fetch('/data/cb6_dob_now_recent.json').then(function(r){return r.json();}).then(function(d){
    var all=(d.rows||[]).filter(function(e){return e.issued_date;}).sort(function(a,b){return a.issued_date<b.issued_date?1:-1;});
    var latest=all.length?String(all[0].issued_date).slice(0,10):null;
    DATA.dob={title:'Construction permits',empty:'No permits on record for the district.',
      note:latest?('The city publishes these on a delay. The newest permit in the district is '+Math.abs(daysUntil(latest))+' days old. '+all.length.toLocaleString()+' have been issued since January.'):'',
      rows:all.slice(0,40).map(function(e){
        var iso=String(e.issued_date).slice(0,10);
        return row(MON[+iso.slice(5,7)-1].slice(0,3)+' '+(+iso.slice(8,10)),esc((e.house_no||'')+' '+(e.street_name||'')),
          [e.work_type,e.permit_status].filter(Boolean).map(esc).join(' &middot; '));
      })};
    setTile('dob',all.length,'since January');
  }).catch(function(){ setTile('dob',0,'unavailable'); });

  fetch('/data/housing-lotteries.json').then(function(r){return r.json();}).then(function(d){
    var up=(d.lotteries||[]).map(function(l){l._d=daysUntil(l.end);return l;}).filter(function(l){return l._d!=null&&l._d>=0;}).sort(function(a,b){return a._d-b._d;});
    var soon=up.filter(function(l){return l._d<=3;}).length;
    DATA.lot={title:'Housing lottery deadlines',empty:'No open lotteries with an upcoming deadline.',
      rows:up.map(function(l){
        var when=l._d===0?'Today':(l._d===1?'Tomorrow':l._d+' days');
        return row(when,(l._d<=3?'<span class="tag soon">closing</span>':'')+((l.cb==='Brooklyn CB6')?'<span class="tag today">in CB6</span>':'')+esc(l.name),
          [l.neighborhood,l.borough,(l.units?l.units+' units':'')].filter(Boolean).map(esc).join(' &middot; '));
      })};
    setTile('lot',up.length,'',soon>0);
  }).catch(function(){ setTile('lot',0,'unavailable'); });

  Promise.all([
    fetch('/data/citywide-rents.geojson').then(function(r){return r.json();}).catch(function(){return null;}),
    fetch('/data/housing-db-cd.json').then(function(r){return r.json();}).catch(function(){return null;}),
    fetch('/data/hpd-affordable.json').then(function(r){return r.json();}).catch(function(){return null;})
  ]).then(function(a){
    var n=function(v){return Number(v).toLocaleString('en-US');}, f=[];
    if(a[0]){ var p=(a[0].features.filter(function(x){return x.properties.cb_code==='BKCB6';})[0]||{}).properties;
      if(p){ f.push({k:'Median asking rent, CB6',v:'$'+n(p.rent_1br),d:'For a one bedroom in the district.'});
             f.push({k:'Two bedroom, CB6',v:'$'+n(p.rent_2br),d:'Median asking rent across the six neighborhoods.'}); } }
    if(a[1]&&a[1].cd&&a[1].cd['BK-06']){ var c=a[1].cd['BK-06'];
      f.push({k:'Housing built in CB6 since 2010',v:n(c.total),d:'Net new units completed in the district.'});
      f.push({k:'Permitted, not yet built',v:n(c.permitted),d:'Units in CB6 waiting on construction.'}); }
    if(a[2]&&a[2].by_cd&&a[2].by_cd['BK-06'])
      f.push({k:'Affordable units financed in CB6',v:n(a[2].by_cd['BK-06']),d:'Income regulated units since 2014.'});
    if(!f.length) return;
    var pick=f[Math.floor(new Date(todayISO+'T12:00:00')/86400000)%f.length];
    $('stat').innerHTML='<div class="k">'+pick.k+'</div><div class="v">'+pick.v+'</div><div class="d">'+pick.d+'</div>';
  }).catch(function(){});

  $('foot').innerHTML='Turns over at midnight &middot; bkcb6.app<br>CB6 calendar, NYC Open Data, HPD, DCP and StreetEasy';
})();
</script>
</body>
</html>
