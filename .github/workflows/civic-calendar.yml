name: Civic calendar

on:
  schedule:
    - cron: '30 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Probe Brooklyn community board calendar feeds
        run: python scripts/probe_civic_calendars.py

      - name: Build NYC Council calendar
        run: python scripts/build_council_calendar.py

      - name: Build Brooklyn community board calendars
        run: python scripts/build_cb_calendar.py

      - name: Build city agency public hearings
        run: python scripts/build_hearings_calendar.py

      - name: Build borough president hearings
        run: python scripts/build_bp_calendar.py

      - name: Commit updated civic calendar data
        run: |
          git config user.email "mracioppo@cb.nyc.gov"
          git config user.name "Mike Racioppo"
          git add data/civic-calendar
          git diff --cached --quiet && exit 0
          git commit -m "Auto-refresh civic calendar $(date -u +%Y-%m-%d)"
          # another job pushes to this repo constantly, so rebase and retry
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 10
          done
          echo "could not push after 5 attempts"
          exit 1
