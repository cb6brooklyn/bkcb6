name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # The jobs below save their own changes to main. Those saves do not start a push run, so this job follows each of them.
  workflow_run:
    workflows: ["App calendar", "App feeds", "App pack", "Civic calendar", "Election results", "Fetch NYS enrollment by ED", "lift-probe", "lift-sites", "Refresh calendar events", "Refresh permits data", "se-rents", "zap-districts", "zap-votes"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment:
      name: github-pages
      url: https://bkcb6.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Anything new to put up?
        id: new
        run: |
          HEAD=$(git rev-parse HEAD)
          echo "sha=$HEAD" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$HEAD" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "go=no" >> "$GITHUB_OUTPUT"; echo "That job saved nothing new."
          else
            echo "go=yes" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload Pages artifact
        if: steps.new.outputs.go == 'yes'
        id: artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      # Pages normally takes the site in about 2 minutes. Sometimes it hangs while syncing files and, 10 minutes in, its
      # status goes blank and it never finishes. So this step gives each try 5 minutes, cancels a try that hangs or
      # fails, and starts it again, up to 5 tries.
      - name: Deploy to GitHub Pages
        if: steps.new.outputs.go == 'yes'
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const version = '${{ steps.new.outputs.sha }}';
            const artifactId = Number('${{ steps.artifact.outputs.artifact_id }}');
            const H = { 'X-GitHub-Api-Version': '2022-11-28' };
            const sleep = ms => new Promise(r => setTimeout(r, ms));
            const cancel = async id => {
              try { await github.request('POST /repos/{owner}/{repo}/pages/deployments/{id}/cancel', { owner, repo, id, headers: H }); core.info(`cancelled ${id}`); }
              catch (e) { core.info(`cancel ${id}: ${e.message}`); }
            };
            const bad = ['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'deployment_perms_error', 'deployment_attempt_error'];
            core.info(`artifact ${artifactId}, version ${version}`);
            for (let attempt = 1; attempt <= 5; attempt++) {
              let id;
              try {
                const oidc = await core.getIDToken();
                const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
                  owner, repo, artifact_id: artifactId, pages_build_version: version, oidc_token: oidc, headers: H
                });
                id = created.data.id || version;
              } catch (e) {
                core.info(`try ${attempt}: could not start: ${e.message}`);
                const stuck = /cancel ([0-9a-f]{40})/i.exec(e.message || '');
                if (stuck) await cancel(stuck[1]);
                await sleep(20000);
                continue;
              }
              core.info(`try ${attempt}: deployment ${id} started`);
              const started = Date.now();
              let last = null, seen = false, why = 'took more than 5 minutes';
              while (Date.now() - started < 5 * 60 * 1000) {
                await sleep(10000);
                let s;
                try { s = (await github.request('GET /repos/{owner}/{repo}/pages/deployments/{id}', { owner, repo, id, headers: H })).data.status; }
                catch (e) { core.info(`status check failed: ${e.message}`); continue; }
                if (s !== last) { core.info(`${Math.round((Date.now() - started) / 1000)}s: ${s || '(blank)'}`); last = s; }
                if (s === 'succeed') { core.info('deployed'); return; }
                if (bad.includes(s)) { why = `Pages reported ${s}`; break; }
                if (s) seen = true; else if (seen) { why = 'status went blank'; break; }
              }
              core.info(`try ${attempt}: ${why}; starting again`);
              await cancel(id);
              await sleep(20000);
            }
            core.setFailed('Pages did not take the site in 5 tries');
