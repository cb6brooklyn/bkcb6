name: Refresh calendar events

on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch ICS feeds
        run: python scripts/build_calendar_events.py

      - name: Commit updated calendar data
        run: |
          git config user.email "Mike@bkcb6.org"
          git config user.name "Mike Racioppo"
          git add data/calendar-events.json
          git diff --cached --quiet && exit 0
          git commit -m "Auto-refresh calendar events $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5 6; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "push attempt $i failed, retrying"; sleep 10
          done
          exit 1
