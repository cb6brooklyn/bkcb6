name: Vote status

# Keeps the words on the apps' voting button (Home, "vote-now") current with the early voting and Election Day hours:
# open now, closed for today, days left. Writes only when the words change.
on:
  schedule:
    - cron: '2 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Update the voting button
        run: python scripts/vote_status.py
      - name: Commit
        run: |
          git config user.email "Mike@bkcb6.org"
          git config user.name "Mike Racioppo"
          git add app/data/civic/ui app/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "Vote status $(TZ=America/New_York date +'%Y-%m-%d %H:%M')"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 10
          done
          exit 1
