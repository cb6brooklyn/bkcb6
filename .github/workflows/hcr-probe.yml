name: hcr-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the HCR dashboard and list its data layers
        run: |
          mkdir -p data/hcr
          ID=febd7f253aae485385174cabff9c6f31
          curl -sL "https://nyshcr.maps.arcgis.com/sharing/rest/content/items/$ID?f=json" -o /tmp/item.json --max-time 60 || true
          curl -sL "https://nyshcr.maps.arcgis.com/sharing/rest/content/items/$ID/data?f=json" -o /tmp/dash.json --max-time 90 || true
          {
            echo "=== item ==="
            head -c 800 /tmp/item.json
            echo ""
            echo "=== dashboard size ==="
            wc -c /tmp/dash.json
            echo "=== service urls ==="
            grep -oE 'https://[^"]*(FeatureServer|MapServer)[^"]*' /tmp/dash.json | sort -u | head -25
            echo "=== referenced item ids ==="
            grep -oE '[0-9a-f]{32}' /tmp/dash.json | sort -u | head -25
          } > data/hcr/probe.txt 2>&1
          cat data/hcr/probe.txt
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add data/hcr/ && git commit -m "HCR dashboard probe" || echo skip
          git push
