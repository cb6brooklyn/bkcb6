name: hcr-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the web map and pull its layers
        run: |
          mkdir -p data/hcr
          curl -sL "https://www.arcgis.com/sharing/rest/content/items/1051fe513a604b46ae33ccb03a201f35/data?f=json" -o /tmp/wm.json --max-time 60
          python3 - <<'PYEOF'
          import json,urllib.request
          d=json.load(open('/tmp/wm.json'))
          layers=[]
          def walk(ls):
              for l in ls or []:
                  if l.get('url'): layers.append((l.get('title'),l['url']))
                  walk(l.get('layers'))
          walk(d.get('operationalLayers')); walk(d.get('tables'))
          open('data/hcr/weblayers.txt','w').write('\n'.join('%s\n   %s'%t for t in layers) or 'none')
          print('layers found:',len(layers))
          for t,u in layers: print('  ',t,u)
          out={}
          for title,u in layers:
              u=u.rstrip('/')
              try:
                  meta=json.loads(urllib.request.urlopen(u+'?f=json',timeout=60).read())
                  flds=[f['name'] for f in meta.get('fields',[])]
                  rows=[];off=0
                  while True:
                      q=u+'/query?where=1%%3D1&outFields=*&returnGeometry=true&f=json&resultOffset=%d&resultRecordCount=2000'%off
                      j=json.loads(urllib.request.urlopen(q,timeout=120).read())
                      fs=j.get('features') or []
                      rows.extend(fs)
                      if len(fs)<2000: break
                      off+=2000
                  out[title or u]={'url':u,'fields':flds,'count':len(rows),'rows':rows}
                  print('  ->',title,len(rows),'rows')
              except Exception as e:
                  print('  ->',title,'failed',e)
          json.dump(out,open('data/hcr/hp-layers.json','w'))
          with open('data/hcr/summary.txt','w') as fh:
              for k,v in out.items():
                  fh.write('%s  %d rows\n  fields: %s\n'%(k,v['count'],', '.join(v['fields'])))
                  if v['rows']: fh.write('  sample: %s\n'%json.dumps(v['rows'][0].get('attributes'))[:700])
                  fh.write('\n')
          PYEOF
          cat data/hcr/summary.txt
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add data/hcr/ && git commit -m "HCR housing plan layers" || echo skip
          git push
