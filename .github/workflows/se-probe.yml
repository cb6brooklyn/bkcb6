name: se-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List what the master report contains
        run: |
          mkdir -p data/se
          curl -sL "https://cdn-charts.streeteasy.com/Master%20Report.zip" -o /tmp/m.zip --max-time 180 || true
          ls -la /tmp/m.zip > data/se/master-listing.txt 2>&1 || true
          echo "" >> data/se/master-listing.txt
          unzip -l /tmp/m.zip >> data/se/master-listing.txt 2>&1 || echo "unzip failed" >> data/se/master-listing.txt
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add data/se/ && git commit -m "StreetEasy master report listing" || echo skip
          git push
