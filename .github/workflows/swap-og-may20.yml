name: Swap calendar OG image May 20

on:
  schedule:
    # 04:01 UTC May 20 = 00:01 EDT May 20
    - cron: '1 4 20 5 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  swap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swap OG image to May 20 flyer
        run: |
          sed -i 's|og-calendar-may19.png|og-calendar-may20.png|g' calendar.html
      - name: Commit
        run: |
          git config user.email "mracioppo@cb.nyc.gov"
          git config user.name "Mike Racioppo"
          git add calendar.html
          git diff --cached --quiet || git commit -m "Auto-swap calendar OG image to May 20 Transportation flyer"
          git push
