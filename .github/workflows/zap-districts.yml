name: zap-districts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the validated community districts
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, time, os, sys
          ids=json.load(open('data/zap-api/district-list.json'))['ids']
          out={}
          if os.path.exists('data/zap-districts.json'):
              try: out=json.load(open('data/zap-districts.json'))['projects']
              except Exception: out={}
          todo=[i for i in ids if i not in out]
          print('total %d, have %d, fetching %d'%(len(ids),len(out),len(todo)))
          fails=0
          for k,pid in enumerate(todo):
              try:
                  with urllib.request.urlopen('https://zap-api-production.herokuapp.com/projects/'+pid,timeout=45) as f:
                      d=json.loads(f.read())
                  a=d['data']['attributes']
                  out[pid]={'cds':a.get('dcp-validatedcommunitydistricts') or '',
                            'b':a.get('dcp-borough') or ''}
              except Exception as e:
                  fails+=1; out[pid]={'err':str(e)[:50]}
              if (k+1)%50==0:
                  print('  %d done, %d failed'%(k+1,fails)); sys.stdout.flush()
                  json.dump({'projects':out},open('data/zap-districts.json','w'),separators=(',',':'))
              time.sleep(1.3)
          json.dump({'generated':time.strftime('%Y-%m-%d'),'projects':out},
                    open('data/zap-districts.json','w'),separators=(',',':'))
          print('finished: %d, %d failures'%(len(out),fails))
          PYEOF
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add data/zap-districts.json && git commit -m "Harvest validated community districts" || echo skip
          git push
