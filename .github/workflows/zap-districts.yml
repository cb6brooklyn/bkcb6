name: zap-districts
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Look for district fields on a multi district project
        run: |
          mkdir -p data/zap-api
          curl -s --max-time 40 "https://zap-api-production.herokuapp.com/projects/2018K0382" -o /tmp/g.json || true
          python3 - <<'PYEOF'
          import json
          d=json.load(open('/tmp/g.json'))
          a=d['data']['attributes']
          keys=[k for k in a if any(t in k for t in ('district','community','council','borough','cb'))]
          out={'attribute_keys_matching':keys}
          for k in keys: out[k]=a[k]
          inc={}
          for i in d.get('included',[]):
              inc[i.get('type')]=inc.get(i.get('type'),0)+1
          out['included_types']=inc
          # dump a sample of any district-like included record
          for i in d.get('included',[]):
              if 'district' in (i.get('type') or ''):
                  out['sample_'+i['type']]=i.get('attributes'); break
          open('data/zap-api/districts-probe.json','w').write(json.dumps(out,indent=1))
          print(json.dumps(out,indent=1)[:1500])
          PYEOF
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add data/zap-api/ && git commit -m "district probe" || echo skip
          git push
