name: App pack

# Runs on every push to main so app/manifest.json always matches the site, and keeps the apps' landmarks, liquor data, minutes and screens current: the civic/ui files (buttons, Home sections, banners, text), LPC permits from NYC Open Data, the liquor dataset and the liquor
# license applicants before the committee, into app/data/civic, with app/manifest.json updated so installed apps download them.
on:
  schedule:
    - cron: '45 11 * * *'
  push:
    branches: [main]
    paths-ignore:
      - 'app/manifest.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: app-pack
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build the pack
        run: python scripts/build_app_pack.py
      - name: Commit
        run: |
          git config user.email "Mike@bkcb6.org"
          git config user.name "Mike Racioppo"
          git add app/data app/index app/manifest.json
          git diff --cached --quiet && exit 0
          git commit -m "App pack refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash -q origin main && git push && exit 0
            echo "push attempt $i failed, retrying"
            sleep 10
          done
          exit 1
