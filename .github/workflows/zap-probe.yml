name: zap-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch one real project with milestones
        run: |
          mkdir -p data/zap-api
          curl -s --max-time 40 "https://zap-api-production.herokuapp.com/projects/2024K0280" -o data/zap-api/sample-46nelson.json || true
          curl -s --max-time 40 "https://zap-api-production.herokuapp.com/projects/2021K0360" -o data/zap-api/sample-redhook.json || true
          rm -f data/zap-api/probe.txt data/zap-api/probe.json
          ls -la data/zap-api/ 
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add -A data/zap-api/ && git commit -m "ZAP sample projects with milestones" || echo skip
          git push
