name: zap-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe the heroku API
        run: |
          mkdir -p data/zap-api
          : > data/zap-api/probe.txt
          for u in \
            "https://zap-api-production.herokuapp.com/projects/2019K0184" \
            "https://zap-api-production.herokuapp.com/projects/P2019K0184" \
            "https://zap-api-production.herokuapp.com/project/2019K0184" \
            "https://zap-api-production.herokuapp.com/projects/46-nelson-street-rezoning-ii" ; do
            echo "== $u" >> data/zap-api/probe.txt
            curl -s -o /tmp/r -w "%{http_code} %{content_type}\n" --max-time 30 "$u" >> data/zap-api/probe.txt 2>&1 || true
            head -c 3000 /tmp/r >> data/zap-api/probe.txt || true
            echo "" >> data/zap-api/probe.txt
          done
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add data/zap-api/ && git commit -m "heroku API probe" || echo skip
          git push
