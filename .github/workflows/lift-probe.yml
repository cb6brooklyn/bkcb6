name: lift-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the LIFT tracker map and pull every site
        run: |
          mkdir -p data/lift
          curl -sL "https://www.arcgis.com/sharing/rest/content/items/70bd4dc0d246454d82e0784a8ab9c265/data?f=json" -o /tmp/wm.json --max-time 60
          python3 - <<'PYEOF'
          import json,urllib.request,os
          d=json.load(open('/tmp/wm.json'))
          layers=[]
          for k in ('operationalLayers','tables'):
              for l in d.get(k,[]) or []:
                  if l.get('url'): layers.append((l.get('title'),l['url']))
                  for sl in (l.get('layers') or []):
                      if sl.get('url'): layers.append((sl.get('title'),sl['url']))
          open('data/lift/layers.txt','w').write('\n'.join('%s\n   %s'%(t,u) for t,u in layers) or 'none')
          print('layers:',len(layers))
          best=None
          for t,u in layers:
              if t and 'lift' in t.lower(): best=(t,u); break
          if not best and layers: best=layers[0]
          if not best: raise SystemExit
          t,u=best
          print('pulling',t,u)
          out=[]; off=0
          while True:
              q=u+'/query?where=1%3D1&outFields=*&returnGeometry=true&f=json&resultOffset=%d&resultRecordCount=1000'%off
              try:
                  j=json.loads(urllib.request.urlopen(q,timeout=90).read())
              except Exception as e:
                  print('query failed',e); break
              fs=j.get('features') or []
              out.extend(fs)
              if len(fs)<1000: break
              off+=1000
          print('features:',len(out))
          json.dump({'layer':t,'url':u,'features':out},open('data/lift/lift-sites-raw.json','w'))
          if out:
              open('data/lift/fields.txt','w').write('\n'.join(sorted(out[0]['attributes'].keys())))
          PYEOF
          ls -la data/lift/
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add data/lift/ && git commit -m "LIFT tracker sites" || echo skip
          git push
