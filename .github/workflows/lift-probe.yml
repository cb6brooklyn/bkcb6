name: lift-probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve the items the story references
        run: |
          mkdir -p data/lift
          : > data/lift/items.txt
          for ID in 01800cd22b1647849dbbf4b3a086db97 08a084ba1a7d4542b6c57859179cddbb \
                    70bd4dc0d246454d82e0784a8ab9c265 b2169f40d13b478a9f9b4cfcf3010dd6 \
                    b42e3f8f244343a4ae54f0e511dd8df5 c3866494abf7438d907282a3dee912d7 \
                    e6710c01704e45878df09bc1f83748ec ; do
            echo "== $ID" >> data/lift/items.txt
            curl -sL "https://www.arcgis.com/sharing/rest/content/items/$ID?f=json" --max-time 45 \
              | python3 -c "import sys,json;d=json.load(sys.stdin);print('  type:',d.get('type'));print('  title:',d.get('title'));print('  url:',d.get('url'))" >> data/lift/items.txt 2>&1 || echo "  failed" >> data/lift/items.txt
          done
          cat data/lift/items.txt
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add data/lift/ && git commit -m "LIFT referenced items" || echo skip
          git push
