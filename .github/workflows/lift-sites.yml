name: lift-sites
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull the LIFT tracker sites
        run: python3 scripts/lift_pull.py || true
      - name: List
        run: ls -la data/lift/ && tail -40 data/lift/log.txt
      - name: Commit
        run: |
          git config user.name "Mike Racioppo"
          git config user.email "mracioppo@cb.nyc.gov"
          git add -A data/lift/
          git commit -m "LIFT tracker sites pull" || echo "nothing to commit"
          git pull --rebase origin main || true
          git push
