<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CB6 Votes by Meeting (preview)</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/cb6-logo.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920;--ink:#1d2333;--paper:#f8f7f4;--white:#fff;--line:#e3e1db;--muted:#646b7a;--ok:#1f6b3a;--okbg:#e3f2e8;--no:#a52a2a;--nobg:#fbe5e5;--tab:#8a5a00;--tabbg:#fff1d2;--gray:#eceae4}
*{box-sizing:border-box}html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
.mono{font-family:'DM Mono',ui-monospace,monospace}
header{background:var(--navy);color:#fff;padding:18px 16px 16px;border-bottom:4px solid var(--orange)}
header .wrap{max-width:980px;margin:0 auto}
header h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.01em}
header p{margin:6px 0 0;color:#c8cfe4;font-size:14px}
.pv{display:inline-block;margin-top:10px;background:var(--orange);color:#fff;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px}
main{max-width:980px;margin:0 auto;padding:14px 16px 70px}
.years{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}.years::-webkit-scrollbar{display:none}
.years button{flex:0 0 auto;font:inherit;font-weight:700;font-size:14px;border:1.5px solid var(--line);background:#fff;color:var(--navy);padding:6px 12px;border-radius:999px;cursor:pointer}
.years button.on{background:var(--navy);border-color:var(--navy);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px;margin:12px 0}
h2{font-size:22px;font-weight:800;color:var(--navy);margin:0 0 10px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.tile{background:var(--paper);border-radius:8px;padding:10px}
.tile b{display:block;font-family:'DM Mono',monospace;font-size:26px;font-weight:500;color:var(--navy);line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:14px;margin-top:12px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
td.n,th.n{text-align:right;font-family:'DM Mono',monospace}
tr.tot td{font-weight:700;border-bottom:none}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-top:14px;align-items:end;height:70px}
.months a{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;text-decoration:none;color:var(--muted);font-size:10px}
.months i{display:block;width:100%;background:var(--navy);border-radius:3px 3px 0 0;min-height:2px}
.months i.c{background:#b9c0d6;border-radius:0}
.months a.none i{background:var(--gray)}
.legend{font-size:12px;color:var(--muted);margin-top:6px;display:flex;gap:14px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
section.month{margin-top:22px}
section.month>h3{font-size:19px;font-weight:800;color:var(--navy);margin:0 0 6px;display:flex;align-items:baseline;gap:10px}
section.month>h3 small{font-size:13px;font-weight:500;color:var(--muted)}
.fb{border-left:5px solid var(--navy)}
.fb .head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.fb .head b{font-size:16px;color:var(--navy)}
.fb .head a,.cmte a.src{font-size:13px;color:var(--navy);font-weight:700;text-decoration:none}
.note{background:var(--tabbg);color:#5b3d00;border-radius:6px;padding:8px 10px;font-size:13px;margin-top:8px}
ol.vl{list-style:none;margin:8px 0 0;padding:0;counter-reset:v}
ol.vl>li{counter-increment:v;border-top:1px solid var(--line);padding:10px 0 10px 30px;position:relative}
ol.vl>li::before{content:counter(v);position:absolute;left:0;top:10px;font-family:'DM Mono',monospace;font-size:12px;color:#fff;background:var(--navy);width:21px;height:21px;border-radius:50%;display:flex;align-items:center;justify-content:center}
ol.vl.c>li::before{background:#8e97b3}
.it{font-weight:700}
.sm{font-size:14px;margin-top:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px;font-size:12px}
.badge{font-weight:700;padding:2px 8px;border-radius:5px;font-size:12px}
.b-ok{background:var(--okbg);color:var(--ok)}.b-no{background:var(--nobg);color:var(--no)}.b-tab{background:var(--tabbg);color:var(--tab)}.b-nr{background:var(--gray);color:var(--muted)}
.chip{background:var(--gray);color:var(--ink);padding:2px 8px;border-radius:5px}
.act{color:var(--navy);font-weight:700}
.tally{color:var(--muted)}
details.cm{margin-top:8px}
details.cm>summary{cursor:pointer;list-style:none;font-weight:700;color:var(--navy);font-size:15px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px}
details.cm>summary::-webkit-details-marker{display:none}
details.cm>summary::before{content:"▸ ";color:var(--orange)}
details.cm[open]>summary::before{content:"▾ "}
details.cm>summary small{font-weight:500;color:var(--muted)}
.cmte{background:#fff;border:1px solid var(--line);border-left:5px solid #8e97b3;border-radius:10px;padding:12px 14px;margin:8px 0}
.cmte .head{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.cmte .head b{color:var(--ink);font-size:15px}
.empty{color:var(--muted);font-size:14px;padding:8px 0}
.srcnote{font-size:12px;color:var(--muted);margin-top:10px}
@media (max-width:520px){header h1{font-size:22px}.tile b{font-size:22px}table{font-size:13px}}
</style></head><body><script src="/assets/site-bar.js?v=1" defer></script>
<header><div class="wrap">
<h1>Votes by Meeting</h1>
<p>Every motion of Brooklyn Community Board 6, organized by Full Board meeting, month by month, with committee votes under each month and a tally for the year.</p>
<span class="pv">Preview, not linked from the site</span>
</div></header>
<main>
<div class="years" id="years"></div>
<div id="out"></div>
</main>
<script>
const BODY={FB:'Full Board',LLH:'Landmarks, Land Use & Housing',BAL:'Business Affairs & Licenses',TPPI:'Transportation, Parks & Public Infrastructure',HSES:'Human Services & Environmental Sustainability'};
const SLUG={FB:'full-board',LLH:'landmarks-land-use-housing',BAL:'business-affairs-licensing',TPPI:'transportation-parks-public-safety',HSES:'youth-human-services-education'};
const TOPIC={liquor:'Liquor licenses',landmarks:'Landmarks',landuse:'Land use & zoning',streets:'Streets & transportation',proc:'Procedural'};
const OLDTOPIC={'Liquor license':'liquor','Landmarks / Certificate of Appropriateness':'landmarks','Land use / zoning (ULURP, BSA, variance, rezoning)':'landuse','Transportation / streets / parking':'streets','Procedural: minutes/adjournment':'proc'};
const MON=['January','February','March','April','May','June','July','August','September','October','November','December'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>{const[y,m,dd]=d.split('-').map(Number);return MON[m-1]+' '+dd+', '+y};
const short=d=>{const[y,m,dd]=d.split('-').map(Number);return MON[m-1].slice(0,3)+' '+dd};
let CUR={},OLD=[],NOTES={};
function cls(r){r=(r||'').toLowerCase();if(r.includes('fail'))return'b-no';if(r.includes('tabl'))return'b-tab';if(r.includes('not recorded'))return'b-nr';return'b-ok'}
function normOld(x){const fb=x.c==='Full Board';return{d:x.d,b:fb?'FB':'X',bl:x.c,i:'',s:x.s,a:x.t==='Procedural'?'Procedural':'',r:x.o,k:OLDTOPIC[x.k]||x.k,u:x.u,src:x.src}}
function rowHTML(v){
 const from=v.f?`<span class="chip">From ${esc(BODY[v.f])}</span>`:'';
 const n=v.n?`<span class="chip mono">${v.n} applications</span>`:'';
 const act=v.a?`<span class="act">${esc(v.a)}</span>`:'';
 const top=`<span class="chip">${esc(TOPIC[v.k]||v.k)}</span>`;
 const title=v.i?`<div class="it">${esc(v.i)}</div>`:'';
 const sm=v.s?`<div class="sm">${esc(v.s)}</div>`:'';
 const src=v.u?` <a class="src" href="${esc(v.u)}" target="_blank" rel="noopener" style="font-size:12px;color:var(--navy);font-weight:700;text-decoration:none">Source</a>`:'';
 return `<li>${title}${sm}<div class="meta">${act}<span class="badge ${cls(v.r)}">${esc(v.r)}</span>${v.t?`<span class="tally">${esc(v.t)}</span>`:''}</div><div class="meta">${top}${from}${n}${src}</div></li>`;
}
function minutesLink(d,b){return SLUG[b]?`/minutes/${d}-${SLUG[b]}.html`:''}
function render(y){
 document.querySelectorAll('#years button').forEach(b=>b.classList.toggle('on',b.dataset.y==y));
 const list=(y==CUR.year)?CUR.votes.map(v=>Object.assign({},v)):OLD.filter(v=>v.d.startsWith(y+'-'));
 const fb=list.filter(v=>v.b==='FB'),cm=list.filter(v=>v.b!=='FB');
 const isPass=v=>cls(v.r)==='b-ok',apps=v=>v.n||1;
 const fbApproved=fb.filter(v=>v.k!=='proc'&&isPass(v)).length;
 const notUnan=fb.filter(v=>!/unanim/i.test(v.r)&&v.k!=='proc').length;
 const lic=fb.filter(v=>v.k==='liquor'&&isPass(v)).reduce((s,v)=>s+apps(v),0);

 const fbMeet=[...new Set(fb.map(v=>v.d))].concat(Object.keys(NOTES).filter(d=>d.startsWith(y+'-')&&y==CUR.year&&!fb.some(v=>v.d===d)));
 const fbMeetings=new Set(fbMeet).size;
 // topic table
 const tk=[...new Set(list.map(v=>v.k))];
 const order=['liquor','landmarks','landuse','streets','proc'];
 tk.sort((a,b)=>(order.indexOf(a)<0?99:order.indexOf(a))-(order.indexOf(b)<0?99:order.indexOf(b))||String(a).localeCompare(b));
 let rows='',tf=0,tc=0;
 tk.forEach(k=>{const f=fb.filter(v=>v.k===k).length,c=cm.filter(v=>v.k===k).length;tf+=f;tc+=c;rows+=`<tr><td>${esc(TOPIC[k]||k)}</td><td class="n">${f}</td><td class="n">${c}</td></tr>`});
 // month bars
 const mf=Array(12).fill(0),mc=Array(12).fill(0);
 fb.forEach(v=>mf[+v.d.slice(5,7)-1]++);cm.forEach(v=>mc[+v.d.slice(5,7)-1]++);
 const mx=Math.max(1,...mf.map((f,i)=>f+mc[i]));
 const bars=mf.map((f,i)=>{const c=mc[i],tot=f+c;return `<a href="#m${i+1}" class="${tot?'':'none'}" title="${MON[i]}: ${f} Full Board, ${c} committee"><i class="c" style="height:${c/mx*52}px"></i><i style="height:${tot?f/mx*52:2}px"></i>${MON[i].slice(0,1)}</a>`}).join('');
 let h=`<div class="card"><h2>${y} at a glance</h2><div class="tiles">
 <div class="tile"><b>${fbMeetings}</b><span>Full Board meetings</span></div>
 <div class="tile"><b>${fb.length}</b><span>Full Board votes</span></div>
 <div class="tile"><b>${cm.length}</b><span>Committee votes</span></div>
 <div class="tile"><b>${lic}</b><span>Liquor licenses approved by the Full Board</span></div>
 <div class="tile"><b>${notUnan}</b><span>Full Board votes that were not unanimous</span></div>
 </div>
 <table><thead><tr><th>Topic</th><th class="n">Full Board</th><th class="n">Committees</th></tr></thead><tbody>${rows}<tr class="tot"><td>Total</td><td class="n">${tf}</td><td class="n">${tc}</td></tr></tbody></table>
 <div class="months">${bars}</div>
 <div class="legend"><span><b style="background:var(--navy)"></b>Full Board votes</span><span><b style="background:#b9c0d6"></b>Committee votes</span></div>
 ${y==CUR.year?'':'<div class="srcnote">Years before '+CUR.year+' come from the vote records already on the minutes page, with exact duplicates removed.</div>'}
 </div>`;
 for(let m=1;m<=12;m++){
  const mm=String(m).padStart(2,'0');
  const f=fb.filter(v=>v.d.slice(5,7)===mm),c=cm.filter(v=>v.d.slice(5,7)===mm);
  const nd=Object.keys(NOTES).filter(d=>y==CUR.year&&d.startsWith(y+'-'+mm));
  if(!f.length&&!c.length&&!nd.length)continue;
  h+=`<section class="month" id="m${m}"><h3>${MON[m-1]} <small>${f.length} Full Board · ${c.length} committee</small></h3>`;
  const fdates=[...new Set(f.map(v=>v.d).concat(nd))].sort();
  fdates.forEach(d=>{
   const vs=f.filter(v=>v.d===d);const ml=y==CUR.year?minutesLink(d,'FB'):'';
   h+=`<div class="card fb"><div class="head"><b>Full Board · ${fmt(d)}</b>${ml?`<a href="${ml}">Minutes</a>`:''}</div>`;
   if(NOTES[d])h+=`<div class="note">${esc(NOTES[d])}</div>`;
   h+=vs.length?`<ol class="vl">${vs.map(rowHTML).join('')}</ol>`:'';
   h+=`</div>`;
  });
  if(c.length){
   const groups={};c.forEach(v=>{const key=v.d+'|'+(v.bl||v.b);(groups[key]=groups[key]||[]).push(v)});
   h+=`<details class="cm"${f.length?'':' open'}><summary>Committee votes in ${MON[m-1]} <small>(${c.length})</small></summary>`;
   Object.keys(groups).sort().forEach(key=>{const[d,b]=key.split('|');const vs=groups[key];const ml=y==CUR.year?minutesLink(d,b):'';
    h+=`<div class="cmte"><div class="head"><b>${esc(BODY[b]||b)} · ${short(d)}</b>${ml?`<a class="src" href="${ml}">Minutes</a>`:''}</div><ol class="vl c">${vs.map(rowHTML).join('')}</ol></div>`});
   h+=`</details>`;
  }
  h+=`</section>`;
 }
 document.getElementById('out').innerHTML=h;
 try{history.replaceState(null,'','#'+y)}catch(e){}
}
Promise.all([fetch('votes-2026.json?v=2').then(r=>r.json()),fetch('/app/data/civic/votes.json').then(r=>r.json())]).then(([cur,old])=>{
 CUR=cur;NOTES=cur.notes||{};
 const seen=new Set();
 OLD=old.votes.filter(x=>!x.d.startsWith(cur.year+'-')).filter(x=>{const k=x.d+'|'+x.c+'|'+x.s;if(seen.has(k))return false;seen.add(k);return true}).map(normOld);
 const ys=[cur.year,...[...new Set(OLD.map(v=>+v.d.slice(0,4)))].sort((a,b)=>b-a)];
 document.getElementById('years').innerHTML=ys.map(y=>`<button data-y="${y}">${y}</button>`).join('');
 document.querySelectorAll('#years button').forEach(b=>b.onclick=()=>render(b.dataset.y));
 const want=(location.hash||'').slice(1);render(ys.map(String).includes(want)?want:String(cur.year));
});
</script>
</body></html>
