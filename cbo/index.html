<!DOCTYPE html>
<html lang="en"><head><meta name="apple-itunes-app" content="app-id=6813967208"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Community-based organizations &mdash; bkcb6.app</title>
<meta name="description" content="Every community-based organization, each with its own profile: search by name, borough, category or district.">
<link rel="canonical" href="https://bkcb6.app/cbo/">
<meta property="og:site_name" content="Brooklyn Community Board 6"><meta property="og:title" content="Community-based organizations">
<meta property="og:description" content="Every community-based organization, each with its own profile, by borough and by what it does.">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/state-profile.css?v=20261112">
<style>
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.tools input,.tools select{font:500 .9rem "DM Sans",sans-serif;padding:9px 11px;border:1px solid #d9d5cc;border-radius:9px;background:#fff;color:#0d1b4b;min-width:0}
.tools input{flex:1 1 240px}.tools select{flex:1 1 160px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}.chip{flex:none;border:1px solid #d9d5cc;background:#fff;color:#0d1b4b;border-radius:99px;padding:6px 12px;font:700 .78rem "DM Sans",sans-serif;cursor:pointer}
.chip.on{background:#0d1b4b;color:#fff;border-color:#0d1b4b}
.count{font:500 .7rem "DM Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#6b6760;margin:6px 0}
.cbo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;list-style:none;margin:0;padding:0}.cbo-tile{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;background:#fff;border:1px solid #d6d3d1;border-radius:12px;overflow:hidden;text-decoration:none;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.cbo-tile:hover,.cbo-tile:focus-visible{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.08);border-color:#a8a29e;outline:none}
.cbo-tile img{display:block;width:100%;height:100%;object-fit:contain;padding:8px;box-sizing:border-box}
@media (max-width:640px){.cbo-grid{grid-template-columns:repeat(2,1fr);gap:10px}}
.cbo-name{display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;width:100%;height:100%;padding:14px;color:#0d1b4b;font-weight:800;font-size:1rem;line-height:1.2;overflow:hidden}
.cbo-name small{display:block;margin-top:8px;font-family:"DM Mono",monospace;font-weight:500;font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:#6b6760}
.more{display:block;margin:14px auto;padding:10px 18px;border-radius:99px;border:0;background:#f47920;color:#fff;font:700 .9rem "DM Sans",sans-serif;cursor:pointer}
</style></head>
<body>
<div class="pwrap">
<div class="phead"><span><div class="pcrumb"><a href="/" style="color:inherit">bkcb6.app</a> &middot; <a href="/orgs/" style="color:inherit">Directory</a></div>
<h1>Community-based organizations</h1><div class="pseat">By borough and by what each one does</div></span></div>
<div class="sec"><div class="tools"><input id="q" type="search" placeholder="Search a name" autocomplete="off"><select id="cat"><option value="">Every category</option></select><select id="dist"><option value="">Every community board</option></select></div>
<div class="chips" id="boros"></div><div class="count" id="count"></div><div class="cbo-grid" id="list"></div><button class="more" id="more" hidden>Show more</button></div>

</div>
<script>
(function(){
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
var BN={'1':'Manhattan','2':'Bronx','3':'Brooklyn','4':'Queens','5':'Staten Island'};
var R=[],F=[],shown=0,boro='',q=document.getElementById('q'),cat=document.getElementById('cat'),dist=document.getElementById('dist'),list=document.getElementById('list'),more=document.getElementById('more');
var p=new URLSearchParams(location.search);
function cdName(c){return BN[c[0]]+' '+(+c.slice(1))}
function draw(n){var h='';for(var i=shown;i<Math.min(F.length,shown+n);i++){var r=F[i];
  var href=esc(r.u)+(location.search.indexOf('app=1')>=0&&r.u.indexOf('/cbo/')===0?'?app=1':'');
  h+='<a class="cbo-tile" href="'+href+'" aria-label="'+esc(r.n)+'" title="'+esc(r.n)+'">'+(r.l?'<img src="'+esc(r.l)+'" alt="'+esc(r.n)+'" loading="lazy">':'<span class="cbo-name">'+esc(r.n)+'<small>'+esc(r.c)+'</small></span>')+'</a>'}
  list.insertAdjacentHTML('beforeend',h);shown=Math.min(F.length,shown+n);more.hidden=shown>=F.length}
function run(){var t=q.value.trim().toLowerCase(),c=cat.value,d=dist.value;
  F=R.filter(function(r){return(!boro||r.b===boro)&&(!c||r.c===c)&&(!d||r.cd===d)&&(!t||r.n.toLowerCase().indexOf(t)>=0)});
  document.getElementById('count').textContent=F.length.toLocaleString('en-US')+' of '+R.length.toLocaleString('en-US')+' organizations';
  list.innerHTML='';shown=0;draw(60)}
fetch('/data/cbo/index.json').then(function(r){return r.json()}).then(function(d){R=d.sort(function(a,b){return a.n.localeCompare(b.n)});
  var cats={},bs={},ds={};R.forEach(function(r){cats[r.c]=1;bs[r.b]=(bs[r.b]||0)+1;if(r.cd)ds[r.cd]=1});
  Object.keys(cats).sort().forEach(function(c){cat.insertAdjacentHTML('beforeend','<option>'+esc(c)+'</option>')});
  Object.keys(ds).sort().forEach(function(c){dist.insertAdjacentHTML('beforeend','<option value="'+c+'">'+esc(cdName(c))+'</option>')});
  var bb=document.getElementById('boros'),order=['Manhattan','Brooklyn','Queens','Bronx','Staten Island','Outside NYC','No Address Listed'];
  bb.innerHTML='<button class="chip on" data-b="">All</button>'+order.filter(function(b){return bs[b]}).map(function(b){return '<button class="chip" data-b="'+esc(b)+'">'+esc(b)+' '+bs[b]+'</button>'}).join('');
  bb.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;boro=b.getAttribute('data-b');[].forEach.call(bb.children,function(x){x.classList.toggle('on',x===b)});run()});
  if(p.get('cd'))dist.value=p.get('cd');if(p.get('q'))q.value=p.get('q');run()});
q.addEventListener('input',run);cat.addEventListener('change',run);dist.addEventListener('change',run);more.addEventListener('click',function(){draw(100)});
})();
</script>
</body></html>
