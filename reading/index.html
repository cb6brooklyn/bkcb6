<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recommended Reading &mdash; bkcb6.app</title>
<meta name="description" content="Recommended reading from bkcb6.app.">
<link rel="canonical" href="https://bkcb6.app/reading/">
<meta property="og:site_name" content="Brooklyn Community Board 6"><meta property="og:type" content="website">
<meta property="og:title" content="Recommended Reading">
<meta property="og:url" content="https://bkcb6.app/reading/">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920;--border:#e5e2db;--muted:#6b6760;--off:#f8f7f4}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--navy)}
header{background:var(--navy);border-bottom:4px solid var(--orange);padding:16px 18px}
.crumb{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase}
.crumb a{color:rgba(255,255,255,.75);text-decoration:none}
h1{color:#fff;font-size:1.5rem;font-weight:800;margin-top:6px}
main{max-width:720px;margin:0 auto;padding:18px 16px 40px}
.item{display:flex;gap:12px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;text-decoration:none;color:inherit}
a.item:hover{border-color:var(--orange)}
.ic{font-size:1.2rem;line-height:1.4}
.t{font-weight:700;font-size:1.02rem}
.a{color:var(--muted);font-size:.86rem;font-weight:500;margin-top:2px}
.n{font-size:.92rem;line-height:1.45;margin-top:6px}
.go{margin-left:auto;color:var(--orange);font-weight:700}
.empty{color:var(--muted);padding:10px 0}
</style>
</head>
<body>
<header>
  <div class="crumb"><a href="/">bkcb6.app</a></div>
  <h1>Recommended Reading</h1>
</header>
<main id="list"><div class="empty">Loading&hellip;</div></main>
<script>
(function(){
  var el=document.getElementById('list');
  function esc(v){return String(v==null?'':v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var LOCAL='/app/data/civic/reading.json', LIVE='https://bkcb6.app/app/data/civic/reading.json';
  function get(u){ return fetch(u+'?_='+Math.floor(Date.now()/60000)).then(function(r){ if(!r.ok) throw 0; return r.json(); }); }
  (location.hostname==='bkcb6.app' ? get(LOCAL) : get(LIVE).catch(function(){ return get(LOCAL); })).then(function(d){
    var items=(d&&d.items)||[];
    if(!items.length){el.innerHTML='<div class="empty">No titles on the list yet.</div>';return;}
    el.innerHTML=items.map(function(i){
      var body='<span class="ic">&#128214;</span><span><div class="t">'+esc(i.title)+'</div>'
        +(i.author?'<div class="a">'+esc(i.author)+'</div>':'')
        +(i.note?'<div class="n">'+esc(i.note)+'</div>':'')+'</span>';
      return i.url?'<a class="item" href="'+esc(i.url)+'" target="_blank" rel="noopener">'+body+'<span class="go">&#8599;</span></a>'
                  :'<div class="item">'+body+'</div>';
    }).join('');
  }).catch(function(){el.innerHTML='<div class="empty">The list did not load.</div>';});
})();
</script>
</body>
</html>
