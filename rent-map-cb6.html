<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta property="og:title" content="CB6 Rents by Neighborhood — Brooklyn Community Board 6">
<meta property="og:description" content="Median asking rent, price range, and move-in cost for each Brooklyn CB6 neighborhood: Park Slope, Carroll Gardens, Cobble Hill, Gowanus, and Red Hook.">
<meta property="og:url" content="https://bkcb6.app/rent-map-cb6.html">
<title>CB6 Rents by Neighborhood — bkcb6.app</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0d1b4b;color:#fff;height:100vh;display:flex;flex-direction:column}
.top-bar{background:#0d1b4b;border-bottom:3px solid #f47920;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;flex-wrap:wrap}
.top-bar h1{font-size:.95rem;font-weight:700;color:#fff}
.top-bar h1 span{color:#f47920}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rent-btn{padding:5px 12px;font-size:.75rem;font-family:'DM Sans',sans-serif;font-weight:600;border:1px solid rgba(255,255,255,.3);border-radius:20px;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s}
.rent-btn:hover{border-color:#fff;color:#fff}
.rent-btn.active{background:#f47920;color:#fff;border-color:#f47920}
.back-link{font-size:.72rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.5);text-decoration:none;white-space:nowrap}
.back-link:hover{color:#f47920}
#map{flex:1;min-height:280px}
.source{font-size:.65rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.35);padding:6px 16px;flex-shrink:0;background:#0d1b4b}
.panel{background:#fff;color:#132D65;padding:12px 14px;flex-shrink:0;max-height:52vh;overflow-y:auto}
.chips-toggle{width:100%;display:flex;align-items:center;gap:8px;padding:9px 4px;background:none;border:none;border-top:1px solid #eee;cursor:pointer;font-family:'DM Mono',monospace;font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;color:#6b6760;font-weight:700;margin-top:10px}
.chips-toggle .ct-ar{margin-left:auto;color:#9ca3af;transition:transform .15s}
.chips-toggle.open .ct-ar{transform:rotate(90deg)}
.nbhd-list{display:none}
.nbhd-list.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:8px}
.rsr-clear{margin-left:auto;background:none;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:6px;font-size:.6rem;padding:3px 9px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:700}
.rsr-clear:hover{background:rgba(255,255,255,.15)}
.result-hint{font-size:.72rem;color:#9ca3af;font-family:'DM Mono',monospace;padding:8px 2px}
.panel-label{font-size:.56rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:#6b6760;font-weight:700;margin-bottom:8px}
.nbhd-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.nbhd-chip{border:2px solid #132D65;border-radius:9px;padding:9px 11px;cursor:pointer;background:#fff;text-align:left;transition:all .12s}
.nbhd-chip:hover{border-color:#f47920;background:#fff8f2}
.nbhd-chip.active{background:#f47920;border-color:#f47920;color:#fff}
.nbhd-chip .n{font-size:.82rem;font-weight:800;line-height:1.15}
.nbhd-chip .r{font-family:'DM Mono',monospace;font-size:.72rem;margin-top:2px;color:#f47920;font-weight:700}
.nbhd-chip.active .r{color:#fff}
.nbhd-chip.nodata{border-color:#cbcbcb;border-style:dashed}
.nbhd-chip.nodata .r{color:#9ca3af;font-weight:600}
.rsr-card{border:2px solid #132D65;border-bottom:3px solid #f47920;border-radius:10px;overflow:hidden;margin-top:12px}
.rsr-head{background:#132D65;color:#fff;padding:10px 13px;display:flex;align-items:flex-start;gap:10px}
.rsr-head .t{font-size:.95rem;font-weight:800;line-height:1.2}
.rsr-head .s{font-size:.64rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.6);margin-top:2px}
.rsr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(80px,1fr));gap:1px;background:#e5e2db}
.rsr-cell{background:#fff;padding:9px 10px}
.rsr-cell .l{font-size:.54rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.06em;color:#6b6760}
.rsr-cell .v{font-size:.9rem;font-weight:800;color:#132D65;font-family:'DM Mono',monospace;margin-top:2px}
.rsr-signing{padding:9px 13px;background:#132D65;color:#fff;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rsr-signing .sl{font-family:'DM Mono',monospace;font-size:.56rem;text-transform:uppercase;letter-spacing:.06em;color:rgba(255,255,255,.6)}
.rsr-signing .sv{font-weight:800;font-size:.95rem;font-family:'DM Mono',monospace}
.rsr-signing .sb{font-weight:400;font-size:.6rem;color:rgba(255,255,255,.55);font-family:'DM Mono',monospace}
.rsr-range{padding:8px 13px;background:#fff;border-top:1px solid #f0ede8;display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:.7rem}
.rsr-range .rl{font-family:'DM Mono',monospace;font-size:.56rem;text-transform:uppercase;letter-spacing:.06em;color:#6b6760}
.rsr-range .rv{font-weight:700;color:#132D65;text-align:right}
.rsr-range .rb{font-weight:400;color:#9ca3af;font-family:'DM Mono',monospace;font-size:.62rem}
.rsr-foot{padding:9px 13px;background:#f8f7f4;display:flex;gap:8px;align-items:center}
.rsr-link{margin-left:auto;font-size:.7rem;font-weight:700;color:#f47920;text-decoration:none;white-space:nowrap}
.rsr-link:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="top-bar">
  <h1>Brooklyn <span>CB6</span> &middot; Rent by Neighborhood</h1>
  <div class="controls" id="bed-controls">
    <button class="rent-btn" data-bed="studio">Studio</button>
    <button class="rent-btn" data-bed="1br">1BR</button>
    <button class="rent-btn" data-bed="2br">2BR</button>
    <button class="rent-btn" data-bed="3br">3BR+</button>
    <button class="rent-btn active" data-bed="all">All</button>
  </div>
  <a class="back-link" href="/zoning-housing-cb6.html">&larr; Zoning &amp; Housing</a>
</div>
<div id="map"></div>
<div class="panel">
  <div id="result"></div>
  <button class="chips-toggle" id="chipsToggle"><span>All CB6 neighborhoods</span><span class="ct-ar">&#9654;</span></button>
  <div class="nbhd-list" id="chips"></div>
</div>
<div class="source">Source: StreetEasy median asking rent, as of June 1, 2026 &nbsp;|&nbsp; bkcb6.app &middot; Boundaries approximate</div>

<script>
(function(){
  var BEDS=[['studio','Studio'],['1br','1 BR'],['2br','2 BR'],['3br','3+ BR'],['all','All']];
  var COLORS=['#1B5E8A','#4A90A4','#82C341','#E8A800','#D45F00','#67000D'];
  var bed='all', DATA=null, layer=null, selName=null, chips={};
  var $=function(i){return document.getElementById(i);};
  var money=function(v){return (v==null)?'n/a':'$'+Number(v).toLocaleString('en-US');};

  var map=L.map('map',{scrollWheelZoom:true}).setView([40.673,-73.99],13);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19}).addTo(map);

  function tiers(vals){
    var s=vals.slice().sort(function(a,b){return a-b;});
    return function(v){ if(v==null) return '#ccc';
      var q=0; for(var i=0;i<s.length;i++){ if(v>=s[i]) q=Math.min(Math.floor(i/s.length*5),4); }
      // rank-based: position in sorted list
      var idx=s.indexOf(v); var t=Math.min(Math.floor(idx/s.length*5),4); return COLORS[t+1]; };
  }
  var colorFor=null;

  function styleFor(f){
    var v=f.properties['rent_'+bed];
    if(f.properties.no_data) return {color:'#9ca3af',weight:1.5,fillColor:'#d9d9d9',fillOpacity:.5,dashArray:'4,3'};
    return {color:'#0d1b4b',weight:1.5,fillColor:colorFor(v),fillOpacity:.72};
  }

  function selectNbhd(name){
    selName=name;
    Object.keys(chips).forEach(function(n){ chips[n].classList.toggle('active', n===name); });
    if(layer) layer.eachLayer(function(l){
      var on=l.feature.properties.nb===name;
      l.setStyle({weight:on?3.5:1.5,color:on?'#f47920':'#0d1b4b',fillOpacity:on?.92:.72});
      if(on){ if(l.bringToFront)l.bringToFront(); try{map.fitBounds(l.getBounds(),{padding:[30,30],maxZoom:15});}catch(e){} }
    });
    var f=DATA.features.filter(function(x){return x.properties.nb===name;})[0];
    if(f){ renderCard(f.properties); var rc=$('result'); if(rc&&rc.scrollIntoView) rc.scrollIntoView({behavior:'smooth',block:'nearest'}); }
  }

  function renderCard(p){
    if(p.no_data){
      $('result').innerHTML='<div class="rsr-card"><div class="rsr-head"><div><div class="t">'+p.nb+'</div><div class="s">Brooklyn CB6</div></div></div>'+
        '<div style="padding:14px 13px;background:#fff;font-size:.78rem;color:#555;line-height:1.5">StreetEasy does not publish separate rent data for this area, so no median, range, or move-in cost is available. It is part of Brooklyn CB6 and shown here for completeness.</div>'+
        '<div class="rsr-foot"><a class="rsr-link" target="_top" href="/rentpastpresent">Explore nearby areas &rarr;</a></div></div>';
      return;
    }
    var cells=BEDS.map(function(b){
      return '<div class="rsr-cell"><div class="l">'+b[1]+'</div><div class="v">'+money(p['rent_'+b[0]])+'</div></div>';
    }).join('');
    var sign = p.rent_all!=null ? '<div class="rsr-signing"><span class="sl">Due at signing</span><span class="sv">'+money(p.rent_all*2)+' <span class="sb">1st mo + 1mo deposit</span></span></div>' : '';
    var range = (p.range_lo!=null) ? '<div class="rsr-range"><span class="rl">By unit type</span><span class="rv">'+money(p.range_lo)+' <span class="rb">'+(p.range_lo_bed||'')+'</span> &ndash; '+money(p.range_hi)+' <span class="rb">'+(p.range_hi_bed||'')+'</span></span></div>' : '';
    $('result').innerHTML='<div class="rsr-card"><div class="rsr-head"><div><div class="t">'+p.nb+'</div><div class="s">Brooklyn CB6 &middot; neighborhood median</div></div></div>'+
      '<div class="rsr-grid">'+cells+'</div>'+ sign + range +
      '<div class="rsr-foot"><a class="rsr-link" target="_top" href="/rentpastpresent">Full history since 2010 &rarr;</a></div></div>';
  }

  function buildChips(){
    var feats=DATA.features.slice().sort(function(a,b){ if(a.properties.no_data)return 1; if(b.properties.no_data)return -1; return (b.properties.rent_all||0)-(a.properties.rent_all||0);});
    $('chips').innerHTML='';
    feats.forEach(function(f){
      var p=f.properties, b=document.createElement('button');
      b.className='nbhd-chip'+(p.no_data?' nodata':''); b.innerHTML='<div class="n">'+p.nb+'</div><div class="r">'+(p.no_data?'No rent data':money(p['rent_'+bed]))+'</div>';
      b.addEventListener('click',function(){ selectNbhd(p.nb); });
      chips[p.nb]=b; $('chips').appendChild(b);
    });
  }
  function refreshChips(){
    DATA.features.forEach(function(f){
      var p=f.properties, c=chips[p.nb];
      if(c) c.querySelector('.r').textContent=p.no_data?'No rent data':money(p['rent_'+bed]);
    });
  }

  fetch('data/neighborhood-rents.geojson').then(function(r){return r.json();}).then(function(j){
    DATA={type:'FeatureCollection',features:j.features.filter(function(f){return f.properties.cd==='BKCB6';})};
    colorFor=tiers(DATA.features.map(function(f){return f.properties.rent_all;}).filter(function(v){return v!=null;}));
    layer=L.geoJSON(DATA,{style:styleFor,onEachFeature:function(f,l){
      l.on('click',function(){ selectNbhd(f.properties.nb); });
      l.bindTooltip(f.properties.nb,{sticky:true});
    }}).addTo(map);
    try{ map.fitBounds(layer.getBounds(),{padding:[24,24]}); }catch(e){}
    buildChips();
    $('result').innerHTML='<div class="result-hint">Tap any neighborhood on the map (or open the list below) to see its rents, price range, and move-in cost.</div>';
  });

  var chipsToggle=document.getElementById('chipsToggle'), chipsList=document.getElementById('chips');
  chipsToggle.addEventListener('click',function(){ this.classList.toggle('open'); chipsList.classList.toggle('open'); });
  window.__clearSel=function(){
    selName=null;
    Object.keys(chips).forEach(function(n){ chips[n].classList.remove('active'); });
    if(layer) layer.setStyle(styleFor);
    $('result').innerHTML='<div class="result-hint">Tap any neighborhood on the map (or open the list below) to see its rents, price range, and move-in cost.</div>';
  };
  $('bed-controls').addEventListener('click',function(e){
    var btn=e.target.closest('.rent-btn'); if(!btn) return;
    bed=btn.getAttribute('data-bed');
    Array.prototype.forEach.call(this.children,function(c){c.classList.toggle('active',c===btn);});
    if(layer) layer.setStyle(styleFor);
    refreshChips();
    if(selName) selectNbhd(selName);
  });
})();
</script>
</body>
</html>
