<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Who represented the district</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>body{margin:0;padding:0;background:#f8f7f4;font-family:'DM Sans',sans-serif}</style>
</head>
<body>
<div id="rb"></div>
<script>
// the board from ?cb=, else the saved address's board (the apps set window.__bkcbPlace), else CB6
(function(){var p=new URLSearchParams(location.search).get('cb'),pl=window.__bkcbPlace,cb='306';
if(p&&/^[1-5]\d\d$/.test(p)&&+p.slice(1)<=18)cb=p;else if(pl&&pl.cd&&+String(pl.cd).slice(1)<=18)cb=String(pl.cd);
document.getElementById('rb').setAttribute('data-rep-board',cb);})();
</script>
<script src="/assets/rep-history.js?v=20261018b"></script>
</body>
</html>
