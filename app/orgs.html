<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organizations</title>
<style>
  @font-face { font-family:'DMS'; src:url('bkcb://font/DMSans-Regular.ttf'); font-weight:400; }
  @font-face { font-family:'DMS'; src:url('bkcb://font/DMSans-Bold.ttf'); font-weight:700; }
  @font-face { font-family:'DMM'; src:url('bkcb://font/DMMono-Medium.ttf'); font-weight:500; }
  :root { --navy:#06024d; --orange:#f47920; --ink:#14141c; --muted:#626470; --rule:#e1dfd8; --paper:#f8f7f4; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--paper); color:var(--ink); font-family:'DMS','DM Sans',system-ui,sans-serif; }
  .wrap { padding:12px 16px 120px; }
  .search { display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--rule); border-radius:12px; padding:10px 12px; }
  .search input { border:0; outline:0; font:inherit; font-size:15px; flex:1; background:transparent; color:var(--ink); }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:12px 0 4px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { flex:0 0 auto; border:1.5px solid var(--navy); color:var(--navy); background:#fff; border-radius:999px; padding:7px 14px; font-size:14px; font-weight:700; }
  .chip.on { background:var(--navy); color:#fff; }
  .grp { margin-top:10px; background:#fff; border:1px solid var(--rule); border-radius:14px; overflow:hidden; }
  .grp > .gh { display:flex; align-items:center; gap:10px; padding:14px; font-weight:700; font-size:16px; color:var(--navy); }
  .grp > .gh .n { font-family:'DMM','DM Mono',monospace; font-size:12px; color:var(--orange); margin-left:auto; }
  .grp > .gh .ch { color:var(--orange); font-size:14px; transition:transform .15s; }
  .grp.open > .gh .ch { transform:rotate(90deg); }
  .grp > .gb { display:none; padding:0 10px 10px; }
  .grp.open > .gb { display:block; }
  .sub { font-family:'DMM','DM Mono',monospace; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); margin:12px 4px 6px; }
  .row { display:flex; align-items:center; gap:12px; padding:10px; background:#fff; border:1px solid var(--rule); border-radius:14px; margin-top:8px; }
  .logo { width:52px; height:52px; border-radius:10px; border:1px solid var(--rule); object-fit:contain; background:#fff; flex:0 0 auto; }
  .ph { width:52px; height:52px; border-radius:10px; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; flex:0 0 auto; }
  .rt { flex:1; min-width:0; }
  .rn { font-weight:700; font-size:16px; }
  .rs { font-size:12px; color:var(--muted); margin-top:2px; }
  .rc { font-family:'DMM','DM Mono',monospace; font-size:10px; color:var(--orange); margin-top:3px; }
  .go { color:var(--orange); font-weight:700; }
  .back { display:inline-block; color:var(--orange); font-weight:700; font-size:15px; padding:4px 0 10px; }
  .hd { display:flex; gap:14px; align-items:flex-start; }
  .hd .logo, .hd .ph { width:84px; height:84px; }
  h1 { font-size:24px; color:var(--navy); margin:0 0 4px; line-height:1.15; }
  .seat { font-size:13px; color:var(--muted); }
  .since { font-family:'DMM','DM Mono',monospace; font-size:10px; color:var(--orange); margin-top:4px; letter-spacing:.06em; }
  p { font-size:15px; line-height:1.45; margin:12px 0 0; }
  .sh { font-family:'DMM','DM Mono',monospace; font-size:12px; letter-spacing:.1em; text-transform:uppercase; color:var(--orange); margin:22px 0 8px; }
  .card { background:#fff; border:1px solid var(--rule); border-radius:14px; padding:12px 14px; }
  .kv { display:flex; gap:12px; padding:6px 0; }
  .kv + .kv { border-top:1px solid var(--rule); }
  .k { font-family:'DMM','DM Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--muted); width:92px; flex:0 0 92px; padding-top:2px; }
  .v { font-size:14px; font-weight:500; }
  a.v { color:var(--orange); text-decoration:none; }
  .going { background:#fff; border:1px solid var(--rule); border-radius:14px; overflow:hidden; margin-top:8px; }
  .going img { width:100%; display:block; }
  .going .gi { padding:12px 14px; }
  .going .gk { font-family:'DMM','DM Mono',monospace; font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  .going .gt { font-weight:700; font-size:18px; color:var(--navy); margin-top:4px; }
  .going .gx { font-size:14px; margin-top:6px; line-height:1.4; }
  .ev { padding:10px 0; }
  .ev + .ev { border-top:1px solid var(--rule); }
  .ev .ed { font-family:'DMM','DM Mono',monospace; font-size:10px; color:var(--orange); text-transform:uppercase; }
  .ev .et { font-weight:700; font-size:15px; margin-top:2px; }
  .ev .el { font-size:12px; color:var(--muted); margin-top:2px; }
  .ev .ex { display:none; font-size:13px; margin-top:6px; line-height:1.4; }
  .ev.open .ex { display:block; }
  .biz { display:flex; align-items:center; gap:10px; padding:10px 0; }
  .biz + .biz { border-top:1px solid var(--rule); }
  .biz .bn { font-weight:700; font-size:14px; }
  .biz .ba { font-size:12px; color:var(--muted); }
  .muted { font-size:13px; color:var(--muted); }
  .hidden { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div id="list">
    <div class="search"><span class="muted">&#9906;</span><input id="q" type="search" placeholder="Search a name or a topic, like housing or arts" autocomplete="off"></div>
    <div class="chips" id="chips"></div>
    <div id="groups"><p class="muted">Loading</p></div>
  </div>
  <div id="page" class="hidden"></div>
</div>
<script>
(function(){
  var D = '/app/data/civic/';
  var LOGOFIX = { '6-15-green':'green615-logo.png', 'green615':'green615-logo.png', 'bergen-bike-bus':'bergenbikebus-logo.png', 'bergenbikebus':'bergenbikebus-logo.png' };
  // ?group=<heading> opens on that heading; &only=1 shows that heading alone, open, with no search or chips
  var Q = new URLSearchParams(location.search), ONLY = Q.get('only') === '1';
  var data = null, cal = [], biz = [], groupOn = Q.get('group') || '', openG = {}, scrollY = 0;
  if (ONLY) { document.getElementById('q').parentNode.style.display = 'none'; document.getElementById('chips').style.display = 'none'; }
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function J(p){ return fetch(p).then(function(r){ if (!r.ok) throw r.status; return r.json(); }); }
  function dsa(x){ return /dsa/i.test(x.slug || '') || /dsa/i.test(x.type || '') || /DSA|Democratic Socialists/.test(x.name || ''); }
  function logoHTML(file, name, kind, official){
    var src = file ? D + 'orgs/logos/' + (LOGOFIX[file] || file) : '';
    if (kind === 'official' && official) src = D + 'officials/' + official + '.png';
    var ini = esc((name || '?').replace(/^The /, '').charAt(0));
    if (!src) return '<div class="ph">' + ini + '</div>';
    return '<img class="logo" src="' + esc(src) + '" alt="" onerror="this.outerHTML=\'<div class=&quot;ph&quot;>' + ini + '</div>\'">';
  }
  function eventsFor(keys){
    var today = new Intl.DateTimeFormat('en-CA', { timeZone:'America/New_York' }).format(new Date());
    return cal.filter(function(e){ return e.d >= today && keys.indexOf(e.k) >= 0; }).sort(function(a, b){ return (a.d + (a.t || '')).localeCompare(b.d + (b.t || '')); });
  }
  function items(){
    var out = [];
    data.profiles.forEach(function(p){
      if (dsa(p)) return;
      out.push({ id:'p:' + p.slug, name:p.name, group:p.group || (p.kind === 'official' ? 'Elected officials' : p.kind === 'agency' ? 'Government agencies' : 'Community groups'), topic:p.topic || '', sort:p.sort || 0, sub:p.seat, p:p });
    });
    var types = {}; data.profiles.forEach(function(p){ types[p.type] = 1; });
    data.orgs.forEach(function(o){
      if (dsa(o) || types[o.slug]) return;
      out.push({ id:'c:' + o.slug, name:o.name, group:o.group || 'Community groups', topic:o.topic || '', sort:o.sort || 0, sub:'On the CB6 community calendar', c:o });
    });
    return out.sort(function(a, b){ return (a.sort - b.sort) || a.name.localeCompare(b.name); });
  }
  var ALL = [];
  function rowHTML(i){
    var keys = i.p ? [i.p.type, i.p.cal] : [i.c.slug, i.c.cal];
    var n = eventsFor(keys).length;
    var lg = i.p ? logoHTML(i.p.logo, i.name, i.p.kind, i.p.official) : logoHTML(i.c.logo, i.name);
    return '<div class="row" data-id="' + esc(i.id) + '">' + lg + '<div class="rt"><div class="rn">' + esc(i.name) + '</div><div class="rs">' + esc(i.sub) + '</div>' +
      (n ? '<div class="rc">' + n + ' upcoming on the calendar</div>' : '') + '</div><span class="go">&rsaquo;</span></div>';
  }
  function bizRow(r){ var lb = r[3] ? r[0] + ' \u00b7 ' + r[3] : r[0]; return '<div class="biz" data-biz="' + esc(lb) + '"><div class="rt"><div class="bn">' + esc(r[0]) + '</div><div class="ba">' + esc([r[2] || r[1], r[3], r[4]].filter(Boolean).join(' \u00b7 ')) + '</div></div><span class="go">&rsaquo;</span></div>'; }
  function bizFromLabel(lb){ var parts = lb.split(' \u00b7 '), name = parts[0], addr = parts.slice(1).join(' \u00b7 '); return biz.filter(function(r){ return r[0] === name && (!addr || r[3] === addr); })[0] || [name, '', '', addr, '']; }
  // the business directory, by BID and by category: each a closed heading, its rows drawn when it opens
  var DIR = {};
  function dirLists(){
    var out = [];
    data.profiles.filter(function(p){ return p.group === 'Business improvement districts' && (p.kv || []).length > 2; }).forEach(function(p){
      var rows = p.kv.slice(2).map(function(x){ return bizFromLabel(x[1]); });
      var key = 'bid:' + p.slug; DIR[key] = rows;
      out.push({ key:key, title:(p.slug === 'gowanus-bid-formation-effort' ? 'In the proposed Gowanus BID' : 'In the ' + p.name), n:rows.length });
    });
    var cats = {};
    biz.forEach(function(r){ var c = r[1] || 'Other businesses'; (cats[c] = cats[c] || []).push(r); });
    Object.keys(cats).sort().forEach(function(c){
      var rows = cats[c].slice().sort(function(a, b){ return a[0].localeCompare(b[0]); });
      DIR['cat:' + c] = rows; out.push({ key:'cat:' + c, title:c, n:rows.length, all:true });
    });
    return out;
  }
  var LISTS = [];
  function fold(key, title, n, body){ return '<div class="grp" data-dir="' + esc(key) + '" style="margin-top:8px"><div class="gh"><span class="ch">&rsaquo;</span>' + esc(title) + '<span class="n">' + n.toLocaleString() + '</span></div><div class="gb">' + (body || '') + '</div></div>'; }
  function drawList(){
    var q = document.getElementById('q').value.trim().toLowerCase();
    var r = ALL.filter(function(i){
      if (groupOn && i.group !== groupOn) return false;
      if (!q) return true;
      var p = i.p || {};
      return [i.name, i.topic, i.group, i.sub, p.desc, p.addr].join(' ').toLowerCase().indexOf(q) >= 0;
    });
    var bizHits = q.length >= 2 && (!groupOn || groupOn === 'Local businesses') ? biz.filter(function(b){ return [b[0], b[1], b[2], b[3], b[4]].join(' ').toLowerCase().indexOf(q) >= 0; }) : [];
    var count = function(g){ return ALL.filter(function(i){ return i.group === g; }).length + (g === 'Local businesses' ? biz.length : 0); };
    var total = ALL.length + biz.length;
    var gs = data.groups.map(function(g){ return g.name; });
    document.getElementById('chips').innerHTML = '<button class="chip' + (groupOn ? '' : ' on') + '" data-g="">All ' + total.toLocaleString() + '</button>' +
      gs.map(function(g){ var n = count(g); return n ? '<button class="chip' + (groupOn === g ? ' on' : '') + '" data-g="' + esc(g) + '">' + esc(g) + ' ' + n.toLocaleString() + '</button>' : ''; }).join('');
    var html = '';
    data.groups.forEach(function(g){
      var lb = g.name === 'Local businesses';
      var inG = r.filter(function(i){ return i.group === g.name; });
      if (!inG.length && !(lb && (!q || bizHits.length))) return;
      if (lb && groupOn && groupOn !== g.name) return;
      // every heading starts closed; a search opens what matches
      var open = openG[g.name] || !!q || (ONLY && groupOn === g.name);
      var listed = (g.topics || []).filter(function(t){ return inG.some(function(i){ return i.topic === t; }); });
      inG.forEach(function(i){ if (i.topic && listed.indexOf(i.topic) < 0) listed.push(i.topic); });
      var body = '';
      if (!listed.length) body = inG.map(rowHTML).join('');
      else {
        listed.forEach(function(t){ body += '<div class="sub">' + esc(t) + '</div>' + inG.filter(function(i){ return i.topic === t; }).map(rowHTML).join(''); });
        body += inG.filter(function(i){ return !i.topic; }).map(rowHTML).join('');
      }
      var n = inG.length;
      if (lb) {
        if (q) { body += bizHits.length ? '<div class="sub">The business directory \u00b7 ' + bizHits.length + '</div><div class="card">' + bizHits.map(bizRow).join('') + '</div>' : ''; n += bizHits.length; }
        else {
          if (inG.length) body = '<div class="sub">With a profile</div>' + body;
          body += '<div class="sub">By business improvement district</div>' + LISTS.filter(function(x){ return !x.all; }).map(function(x){ return fold(x.key, x.title, x.n); }).join('');
          body += '<div class="sub">Every business in CB6, by kind \u00b7 ' + biz.length.toLocaleString() + '</div>' + LISTS.filter(function(x){ return x.all; }).map(function(x){ return fold(x.key, x.title, x.n); }).join('');
          n += biz.length;
        }
      }
      html += '<div class="grp' + (open ? ' open' : '') + '" data-g="' + esc(g.name) + '"><div class="gh"><span class="ch">&rsaquo;</span>' + esc(g.name) + '<span class="n">' + n.toLocaleString() + '</span></div><div class="gb">' + body + '</div></div>';
    });
    document.getElementById('groups').innerHTML = html || '<p class="muted">Nothing matches \u201C' + esc(q) + '\u201D.</p>';
  }
  function kv(k, v, href){ return '<div class="kv"><div class="k">' + esc(k) + '</div>' + (href ? '<a class="v" href="' + esc(href) + '">' + esc(v) + '</a>' : '<div class="v">' + esc(v) + '</div>') + '</div>'; }
  function eventsHTML(list, name){
    if (!list.length) return '<p class="muted">Nothing from ' + esc(name) + ' on the community calendar right now.</p>';
    return '<div class="card">' + list.map(function(e){
      var day = new Date(e.d + 'T12:00:00').toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
      return '<div class="ev"><div class="ed">' + esc(day) + (e.t ? ' · ' + esc(e.t) : '') + '</div><div class="et">' + esc(e.l) + '</div>' + (e.loc ? '<div class="el">' + esc(e.loc) + '</div>' : '') + (e.desc ? '<div class="ex">' + esc(e.desc) + '</div>' : '') + '</div>';
    }).join('') + '</div>';
  }
  function show(html){
    document.getElementById('list').classList.add('hidden');
    var pg = document.getElementById('page'); pg.innerHTML = '<a class="back" href="#" data-back="1">&lsaquo; Back</a>' + html; pg.classList.remove('hidden');
    window.scrollTo(0, 0);
  }
  var stack = [];
  function open(fn){ if (!stack.length) scrollY = window.scrollY; stack.push(fn); fn(); }
  function back(){
    stack.pop();
    if (stack.length) { stack[stack.length - 1](); return; }
    document.getElementById('page').classList.add('hidden'); document.getElementById('list').classList.remove('hidden'); window.scrollTo(0, scrollY);
  }
  function profile(p){
    var h = '<div class="hd">' + logoHTML(p.logo, p.name, p.kind, p.official) + '<div><h1>' + esc(p.name) + '</h1><div class="seat">' + esc(p.seat) + '</div>' + (p.since ? '<div class="since">SINCE ' + esc(p.since) + '</div>' : '') + '</div></div>';
    (p.intro || []).forEach(function(t){ h += '<p>' + esc(t) + '</p>'; });
    var going = (p.going || []).filter(function(g){ return !g.until || g.until >= new Intl.DateTimeFormat('en-CA', { timeZone:'America/New_York' }).format(new Date()); });
    if (going.length) {
      h += '<div class="sh">Going on now</div>';
      going.forEach(function(g){ h += '<div class="going">' + (g.img ? '<img src="' + D + 'orgs/going/' + esc(g.img) + '" alt="">' : '') + '<div class="gi"><div class="gk">' + esc(g.kicker) + '</div><div class="gt">' + esc(g.title) + '</div><div class="gx">' + esc(g.text) + '</div></div></div>'; });
    }
    var visit = '';
    if (p.addr) visit += kv(p.zip ? 'Address' : 'Where', p.addr + (p.zip ? ', Brooklyn, NY ' + p.zip : ''));
    if (p.addr_note) visit += '<p class="muted">' + esc(p.addr_note) + '</p>';
    if (p.phone) visit += kv('Phone', p.phone, 'tel:' + p.phone.replace(/\s/g, ''));
    if (p.email) visit += kv('Email', p.email, 'mailto:' + p.email);
    if (p.web) visit += kv('Website', p.web);
    if (visit) h += '<div class="sh">Visit</div><div class="card">' + visit + '</div>';
    if ((p.does || []).length) { h += '<div class="sh">' + (p.kind === 'official' ? 'Committees and legislation' : 'What ' + esc(p.name) + ' does') + '</div>'; p.does.forEach(function(t){ h += '<p>' + esc(t) + '</p>'; }); }
    // a BID's businesses: each one opens its own page
    var dir = (p.kv || []).slice(2), isBid = p.group === 'Business improvement districts' && dir.length;
    var info = isBid ? (p.kv || []).slice(0, 2) : (p.kv || []);
    if (info.length) h += '<div class="sh">Details</div><div class="card">' + info.map(function(x){ return kv(x[0], x[1]); }).join('') + '</div>';
    if (isBid) {
      var cats = [];
      dir.forEach(function(x){ if (cats.indexOf(x[0]) < 0) cats.push(x[0]); });
      h += '<div class="sh">Businesses in the district · ' + dir.length + '</div>';
      cats.forEach(function(c){
        var rows = dir.filter(function(x){ return x[0] === c; });
        h += '<div class="grp" data-g="biz:' + esc(c) + '"><div class="gh"><span class="ch">&rsaquo;</span>' + esc(c) + '<span class="n">' + rows.length + '</span></div><div class="gb"><div class="card">' +
          rows.map(function(x){ var parts = x[1].split(' · '); return '<div class="biz" data-biz="' + esc(x[1]) + '"><div class="rt"><div class="bn">' + esc(parts[0]) + '</div><div class="ba">' + esc(parts.slice(1).join(' · ')) + '</div></div><span class="go">&rsaquo;</span></div>'; }).join('') + '</div></div></div>';
      });
    }
    h += '<div class="sh">Coming up</div>' + eventsHTML(eventsFor([p.type, p.cal]), p.name);
    show(h);
  }
  function calOrg(o){
    var h = '<div class="hd">' + logoHTML(o.logo, o.name) + '<div><h1>' + esc(o.name) + '</h1><div class="seat">On the CB6 community calendar</div></div></div>';
    h += '<div class="sh">Coming up</div>' + eventsHTML(eventsFor([o.slug, o.cal]), o.name);
    show(h);
  }
  function business(label){
    var parts = label.split(' · '), name = parts[0], addr = parts.slice(1).join(' · ');
    var b = biz.filter(function(r){ return r[0] === name && (!addr || r[3] === addr); })[0];
    var h = '<h1>' + esc(name) + '</h1>';
    if (b) {
      h += '<div class="seat">' + esc([b[2] || b[1], b[4]].filter(Boolean).join(' · ')) + '</div>';
      var c = kv('Category', b[1]);
      if (b[2]) c += kv('Kind', b[2]);
      if (b[3]) c += kv('Address', b[3] + ', Brooklyn');
      if (b[4]) c += kv('Neighborhood', b[4]);
      if (b[12]) c += kv('Legal name', b[12]);
      if (b[13]) c += kv('License', b[13]);
      if (b[10]) c += kv('New', 'Liquor license applied for ' + (b[11] || ''));
      if (b[7]) c += kv('Website', b[7].replace(/^https?:\/\//, '').replace(/\/$/, ''));
      h += '<div class="sh">Details</div><div class="card">' + c + '</div>';
    } else h += '<div class="seat">' + esc(addr) + '</div>';
    show(h);
  }
  document.addEventListener('click', function(ev){
    var t = ev.target.closest('[data-back],.row,.gh,.chip,.biz,.ev'); if (!t) return;
    if (t.dataset.back) { ev.preventDefault(); back(); return; }
    if (t.classList.contains('chip')) { groupOn = groupOn === t.dataset.g ? '' : t.dataset.g; drawList(); return; }
    if (t.classList.contains('gh')) { var g = t.parentNode; g.classList.toggle('open');
      if (g.dataset.dir) { var gb = g.querySelector('.gb'); if (!gb.innerHTML) gb.innerHTML = '<div class="card">' + (DIR[g.dataset.dir] || []).map(bizRow).join('') + '</div>'; return; }
      if (g.dataset.g && g.closest('#groups')) openG[g.dataset.g] = g.classList.contains('open'); return; }
    if (t.classList.contains('ev')) { t.classList.toggle('open'); return; }
    if (t.classList.contains('biz')) { var lb = t.dataset.biz; open(function(){ business(lb); }); return; }
    if (t.classList.contains('row')) {
      var i = ALL.filter(function(x){ return x.id === t.dataset.id; })[0]; if (!i) return;
      open(i.p ? function(){ profile(i.p); } : function(){ calOrg(i.c); });
    }
  });
  document.getElementById('q').addEventListener('input', drawList);
  Promise.all([
    J(D + 'orgs/orgs-profiles.json'),
    J(D + 'cal/calendar-bk.json').catch(function(){ return { events: [] }; }),
    J(D + 'business/business-cb6.json').catch(function(){ return { rows: [] }; })
  ]).then(function(r){
    data = r[0]; cal = r[1].events || []; biz = r[2].rows || [];
    ALL = items(); LISTS = dirLists(); drawList();
  }).catch(function(){ document.getElementById('groups').innerHTML = '<p class="muted">The organizations list did not load.</p>'; });
})();
</script>
</body>
</html>
