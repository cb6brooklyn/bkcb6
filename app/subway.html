<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subway and bus changes and delays</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
  :root { --navy:#06024d; --orange:#f47920; --ink:#14141c; --muted:#626470; --rule:#e1dfd8; --paper:#f8f7f4; --alert:#bf2e33; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--paper); color:var(--ink); font-family:'DM Sans', system-ui, sans-serif; }
  .wrap { padding:12px 14px 16px; }
  .k { font-family:'DM Mono', monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin:0 0 6px; }
  .ok { font-weight:700; font-size:15px; color:var(--ink); }
  .ok .lines { display:inline-flex; gap:4px; margin-left:6px; vertical-align:middle; }
  .line { min-width:24px; padding:0 4px; display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px; border-radius:50%; background:var(--navy); color:#fff; font-weight:700; font-size:12px; }
  .card { background:#fff; border:1px solid var(--rule); border-radius:12px; padding:10px 12px; margin:0 0 8px; }
  .card.active { border-color:rgba(191,46,51,.5); }
  .head { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
  .kind { font-family:'DM Mono', monospace; font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--alert); }
  .kind.later { color:var(--muted); }
  .when { font-family:'DM Mono', monospace; font-size:10px; color:var(--muted); margin-left:auto; }
  .h { font-weight:700; font-size:14px; line-height:1.3; }
  .d { font-size:13px; line-height:1.4; color:var(--ink); margin-top:6px; display:none; white-space:pre-line; }
  .card.open .d { display:block; }
  .more { font-size:12px; color:var(--orange); font-weight:700; margin-top:5px; cursor:pointer; }
  .note { font-size:11px; color:var(--muted); margin-top:8px; }
  .err { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <p class="k" id="title">Subway and bus changes and delays</p>
  <div id="out"><span class="err">Checking the MTA's alerts</span></div>
  <p class="note">Tap an alert for the details.</p>
</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var ALL = ['1','2','3','4','5','6','7','A','C','E','B','D','F','M','G','J','Z','L','N','Q','R','W','S','SI'];
  var LINES = q.get('lines') ? q.get('lines').split(',').map(function(s){ return s.trim(); }).filter(Boolean) : ALL;
  var BUSES = q.get('buses') ? q.get('buses').split(',').map(function(s){ return s.trim(); }).filter(Boolean) : [];
  var out = document.getElementById('out');
  if (q.get('title')) document.getElementById('title').textContent = q.get('title');
  function esc(s){ return String(s||'').replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function text(t){
    var tr = (t && t.translation) || [];
    var en = tr.filter(function(x){ return !x.language || x.language === 'en'; })[0] || tr[0];
    return en ? en.text || '' : '';
  }
  function lineBadges(ls){ return '<span class="lines">' + ls.map(function(l){ return '<span class="line">' + esc(l) + '</span>'; }).join('') + '</span>'; }
  function fmt(ts){ var d = new Date(ts*1000); return d.toLocaleString('en-US', {weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); }
  function render(feeds){
    var now = Date.now()/1000, items = [];
    feeds.forEach(function(f){ var j = f.j, LIST = f.list; if (!j) return;
    (j.entity || []).forEach(function(e){
      var a = e.alert; if (!a) return;
      var mine = (a.informed_entity || []).map(function(i){ return String(i.route_id || '').split('_').pop().replace(/\+$/, ''); }).filter(function(r, k, arr){ return r && LIST.indexOf(r) >= 0 && arr.indexOf(r) === k; });
      if (!mine.length) return;
      var periods = a.active_period || [], active = !periods.length, soon = false, start = null;
      periods.forEach(function(p){ var s = p.start || 0, en = p.end || 0; if (s <= now && (!en || now <= en)) active = true; if (s > now && s - now < 86400) { soon = true; if (!start || s < start) start = s; } });
      if (!active && !soon) return;
      var m = a['transit_realtime.mercury_alert'] || {};
      var kind = (m.alert_type || '').replace(/_/g, ' ') || 'service change';
      var h = text(a.header_text), d = text(a.description_text);
      if (!h) return;
      items.push({ routes: LIST.filter(function(l){ return mine.indexOf(l) >= 0; }), kind: kind, h: h, d: d, active: active, start: start });
    });
    });
    items.sort(function(x, y){ return (x.active ? 0 : 1) - (y.active ? 0 : 1); });
    if (!items.length) {
      out.innerHTML = '<div class="ok">Good service on every line' + (BUSES.length ? ' and bus route' : '') + '</div>';
      return;
    }
    out.innerHTML = items.map(function(it, i){
      return '<div class="card' + (it.active ? ' active' : '') + '" data-i="' + i + '">' +
        '<div class="head">' + lineBadges(it.routes) + '<span class="kind' + (it.active ? '' : ' later') + '">' + esc(it.kind) + '</span>' +
        (it.active ? '' : '<span class="when">from ' + esc(fmt(it.start)) + '</span>') + '</div>' +
        '<div class="h">' + esc(it.h) + '</div>' +
        (it.d ? '<div class="d">' + esc(it.d) + '</div><div class="more">Details</div>' : '') +
      '</div>';
    }).join('');
    Array.prototype.forEach.call(out.querySelectorAll('.card'), function(c){
      c.addEventListener('click', function(){ c.classList.toggle('open'); var m = c.querySelector('.more'); if (m) m.textContent = c.classList.contains('open') ? 'Less' : 'Details'; });
    });
  }
  var MTA = 'https://api-endpoint.mta.info/Dataservice/mtagtfsfeeds/camsys%2F';
  function get(u){ return fetch(u).then(function(r){ if (!r.ok) throw r.status; return r.json(); }).catch(function(){ return null; }); }
  var FERRY = q.get('ferry') === '1', ONLYFERRY = q.get('only') === 'ferry';
  var NEAR = /south brooklyn|atlantic ave|pier 6|red hook|atlantic basin|brooklyn bridge park|governors island/i;
  function ferryHTML(list){
    if (!list) return '<p class="k" style="margin-top:14px">NYC Ferry</p><div class="err">NYC Ferry\'s alerts are not reachable right now.</div>';
    if (!list.length) return '<p class="k" style="margin-top:14px">NYC Ferry</p><div class="ok">No ferry alerts posted. Nearest landings: Atlantic Ave/BBP Pier 6 and Red Hook/Atlantic Basin, South Brooklyn route.</div>';
    list.sort(function(a, b){ return (NEAR.test((b.notificationTitle||'') + (b.notificationBody||'')) ? 1 : 0) - (NEAR.test((a.notificationTitle||'') + (a.notificationBody||'')) ? 1 : 0); });
    return '<p class="k" style="margin-top:14px">NYC Ferry</p>' + list.map(function(a){
      var near = NEAR.test((a.notificationTitle||'') + (a.notificationBody||''));
      return '<div class="card' + (near ? ' active' : '') + '"><div class="head"><span class="kind">' + (near ? 'Near CB6' : 'Ferry') + '</span></div><div class="h">' + esc(String(a.notificationTitle||'').replace(/<[^>]+>/g,'')) + '</div><div class="d" style="display:block">' + esc(String(a.notificationBody||'').replace(/<[^>]+>/g,' ')) + '</div></div>';
    }).join('');
  }
  if (ONLYFERRY) { document.getElementById('title').textContent = 'NYC Ferry alerts'; get('https://us-central1-nyc-ferry.cloudfunctions.net/nycf_service_alerts?lang=en').then(function(f){ out.innerHTML = ferryHTML(f).replace(/^<p class="k"[^<]*<\/p>/, ''); }); return; }
  Promise.all([get(MTA + 'subway-alerts.json'), BUSES.length ? get(MTA + 'bus-alerts.json') : Promise.resolve(null), FERRY ? get('https://us-central1-nyc-ferry.cloudfunctions.net/nycf_service_alerts?lang=en') : Promise.resolve(null)]).then(function(r){
    var fh = FERRY ? ferryHTML(r[2]) : '';
    if (!r[0] && !r[1]) { out.innerHTML = '<span class="err">The MTA\'s alerts are not reachable right now. Try again with a connection.</span>' + fh; return; }
    render([{ j: r[0], list: LINES }, { j: r[1], list: BUSES }]);
    if (fh) out.insertAdjacentHTML('beforeend', fh);
  });
})();
</script>
</body>
</html>
