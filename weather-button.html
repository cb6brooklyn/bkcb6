<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CB6 Weather &amp; Safety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920}
html,body{margin:0;padding:0;background:transparent;font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a.btn{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;border:1px solid rgba(255,255,255,.08);box-sizing:border-box;width:100%;min-height:72px}
a.btn:hover{border-color:var(--orange)}
.logo{width:84px;height:56px;object-fit:cover;border-radius:8px;flex:0 0 auto;display:block;border:1px solid rgba(255,255,255,.25)}
.text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.title{font-weight:800;font-size:1.02rem;line-height:1.15;letter-spacing:.2px}
.sub{font-weight:500;font-size:.78rem;line-height:1.3;color:rgba(255,255,255,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.alert .sub{color:#ffd9b8;font-weight:700}
.arrow{color:var(--orange);font-size:1.4rem;font-weight:800;line-height:1;flex:0 0 auto}
</style>
</head>
<body>
<a class="btn" id="btn" href="https://bkcb6.app/weather" target="_blank" rel="noopener">
  <img class="logo" src="weather-button-map.jpg" alt="">
  <span class="text">
    <span class="title">CB6 Weather &amp; Safety</span>
    <span class="sub" id="sub">Live alerts, air quality, cooling centers, and flood maps</span>
  </span>
  <span class="arrow" aria-hidden="true">&rsaquo;</span>
</a>
<script>
(function(){
  var sub=document.getElementById("sub"),btn=document.getElementById("btn");
  function apply(j){
    if(!j) return;
    var msg="";
    if(j.codeRed===true) msg=j.codeRedTitle||"Code Red in effect.";
    else if(j.tornadoWatch===true) msg=j.tornadoWatchTitle||"A Tornado Watch is in effect.";
    else if(j.floodWatch===true) msg=j.floodWatchTitle||"Flood Watch in effect.";
    else if(j.heatEmergency===true) msg=j.title||"Heat emergency active.";
    if(msg){sub.textContent="Alert: "+msg;btn.classList.add("alert");}
    else{sub.textContent="Live alerts, air quality, cooling centers, and flood maps";btn.classList.remove("alert");}
  }
  function load(){fetch("heat.json?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(apply).catch(function(){});}
  load(); setInterval(load,300000);
  function postHeight(){if(window.parent&&window.parent!==window){window.parent.postMessage({type:"bkcb6-explorer-height",height:document.body.scrollHeight},"*");}}
  window.addEventListener("load",postHeight);window.addEventListener("resize",postHeight);
})();
</script>
</body>
</html>
