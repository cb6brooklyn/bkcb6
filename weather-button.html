<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CB6 Weather &amp; Safety</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920}
html,body{margin:0;padding:0;background:transparent;font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.card{container-type:inline-size;width:100%}
a.btn{position:relative;display:block;width:100%;aspect-ratio:16/9;overflow:hidden;border-radius:14px;text-decoration:none;color:#fff;background:var(--navy) url("weather-button-map.jpg") center/cover no-repeat;border:3px solid var(--orange);box-sizing:border-box}
a.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,27,75,0) 35%,rgba(13,27,75,.92) 75%,var(--navy) 100%)}
.text{position:absolute;left:0;right:0;bottom:0;z-index:1;padding:0 5cqw 4.5cqw;display:flex;align-items:flex-end;justify-content:space-between;gap:3cqw}
.title{font-weight:800;font-size:8cqw;line-height:1.02;letter-spacing:-.01em;text-shadow:0 2px 8px rgba(0,0,0,.35)}
.sub{margin-top:1.5cqw;font-weight:700;font-size:3.6cqw;line-height:1.2;color:var(--orange)}
.arrow{flex:0 0 auto;width:11cqw;height:11cqw;border-radius:50%;background:var(--orange);color:var(--navy);display:flex;align-items:center;justify-content:center;font-size:8cqw;font-weight:800;line-height:1;padding-bottom:.6cqw;box-sizing:border-box}
.alert .sub{color:#fff;background:#b3260a;display:inline-block;padding:.8cqw 2cqw;border-radius:6px}
.alert{border-color:#ffd9b8}
</style>
</head>
<body>
<div class="card">
<a class="btn" id="btn" href="https://bkcb6.app/weather" target="_blank" rel="noopener">
  <div class="text">
    <div>
      <div class="title">CB6 Weather<br>&amp; Safety</div>
      <div class="sub" id="sub">Live alerts &middot; Air quality &middot; Cooling centers &middot; Flood maps</div>
    </div>
    <div class="arrow" aria-hidden="true">&rsaquo;</div>
  </div>
</a>
</div>
<script>
(function(){
  var sub=document.getElementById("sub"),btn=document.getElementById("btn");
  var DEF="Live alerts &middot; Air quality &middot; Cooling centers &middot; Flood maps";
  function apply(j){
    if(!j) return;
    var msg="";
    if(j.codeRed===true) msg=j.codeRedTitle||"Code Red in effect.";
    else if(j.tornadoWatch===true) msg=j.tornadoWatchTitle||"A Tornado Watch is in effect.";
    else if(j.floodWatch===true) msg=j.floodWatchTitle||"Flood Watch in effect.";
    else if(j.heatEmergency===true) msg=j.title||"Heat emergency active.";
    if(msg){sub.textContent="ALERT: "+msg;btn.classList.add("alert");}
    else{sub.innerHTML=DEF;btn.classList.remove("alert");}
  }
  function load(){fetch("heat.json?_="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(apply).catch(function(){});}
  load(); setInterval(load,300000);
  function postHeight(){if(window.parent&&window.parent!==window){window.parent.postMessage({type:"bkcb6-explorer-height",height:document.body.scrollHeight},"*");}}
  window.addEventListener("load",postHeight);window.addEventListener("resize",postHeight);
})();
</script>
</body>
</html>
