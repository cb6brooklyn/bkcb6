<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Active Street Work · Brooklyn Community Board 6</title>
<meta name="description" content="Active DOT street and sidewalk permits across Brooklyn Community Board 6. Search, browse, or drop a pin to see work near any location.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --navy:#06024D; --navy2:#0d1b4b; --orange:#f47920; --orange2:#FD890E;
  --ink:#141426; --paper:#faf8f3; --paper2:#f2efe7; --line:#e0dccf;
  --muted:#6b6a78; --white:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'DM Sans',system-ui,sans-serif;color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;height:100vh;display:flex;flex-direction:column;overflow:hidden}

header{background:var(--navy);color:#fff;padding:16px 22px 0;position:relative;flex:0 0 auto}
.hrow{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;max-width:1240px;margin:0 auto;width:100%}
.eyebrow{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--orange2);margin:0 0 5px}
header h1{font-size:19px;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
header .sub{font-size:12px;color:#c9c8e0;margin:4px 0 0}
.archlink{font-family:'DM Mono',monospace;font-size:11px;color:var(--orange2);text-decoration:none;white-space:nowrap;padding-top:4px}
.archlink:hover{text-decoration:underline}
.toggwrap{max-width:1240px;margin:0 auto;width:100%;display:flex;justify-content:center}
.toggle{display:inline-flex;background:rgba(255,255,255,.1);border-radius:10px;padding:3px;margin:14px 0 0}
.toggle button{border:none;background:transparent;color:#c9c8e0;font-family:'DM Mono',monospace;
  font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:8px 20px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:7px}
.toggle button.on{background:#fff;color:var(--navy);font-weight:500}
.toggle svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.hbar{height:3px;background:linear-gradient(90deg,var(--orange) 0 62%,#fff 62% 100%);margin-top:14px}

.controls{flex:0 0 auto;background:var(--paper);border-bottom:1px solid var(--line);padding:14px 22px}
.cwrap{max-width:1240px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px}
.search input{width:100%;padding:11px 12px 11px 38px;border:1px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:14px;background:var(--white);color:var(--ink)}
.search input:focus{outline:2px solid var(--orange);outline-offset:-1px;border-color:transparent}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2}
.pinbtn{display:flex;align-items:center;gap:7px;padding:11px 15px;border:1px solid var(--line);background:var(--white);
  border-radius:10px;font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--navy);cursor:pointer;white-space:nowrap}
.pinbtn:hover{border-color:var(--navy)}
.pinbtn.on{background:var(--orange);border-color:var(--orange);color:#fff}
.pinbtn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.count{font-family:'DM Mono',monospace;font-size:13px;color:var(--navy);white-space:nowrap;margin-left:2px}
.count b{color:var(--orange);font-weight:500}

.chips{max-width:1240px;margin:10px auto 0;display:flex;gap:7px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--line);background:var(--white);
  border-radius:20px;font-size:12.5px;color:var(--ink);cursor:pointer;transition:.12s}
.chip:hover{background:var(--paper2)}
.chip.off{opacity:.4}
.chip .dot{width:9px;height:9px;border-radius:3px}
.chip .n{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted)}

.pinbar{max-width:1240px;margin:10px auto 0;display:none;align-items:center;gap:12px;flex-wrap:wrap;
  background:#fff6ee;border:1px solid #f9d9bf;border-radius:10px;padding:9px 13px;font-size:12.5px;color:#8a4b16}
.pinbar.show{display:flex}
.pinbar .radwrap{display:flex;align-items:center;gap:8px;margin-left:auto}
.pinbar input[type=range]{accent-color:var(--orange);width:120px}
.pinbar .rv{font-family:'DM Mono',monospace;font-size:12px;color:var(--orange);min-width:52px}
.pinbar .clear{background:none;border:none;color:#8a4b16;text-decoration:underline;cursor:pointer;font-family:inherit;font-size:12.5px}

.stage{flex:1;min-height:0;position:relative;max-width:1240px;margin:0 auto;width:100%}
#list{position:absolute;inset:0;overflow-y:auto;padding:8px 22px 40px;-webkit-overflow-scrolling:touch}
#list.hide{display:none}
.card{display:flex;gap:13px;padding:14px;border:1px solid var(--line);background:var(--white);
  border-radius:12px;margin-bottom:9px;cursor:pointer;transition:.12s}
.card:hover{border-color:var(--navy);box-shadow:0 3px 14px rgba(6,2,77,.07)}
.card .bar{width:4px;border-radius:4px;flex:0 0 auto}
.card .body{flex:1;min-width:0}
.card .loc{font-weight:700;font-size:15px;line-height:1.25}
.card .blk{font-size:12.5px;color:var(--muted);margin-top:1px}
.card .meta{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:8px;align-items:center}
.card .tag{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;font-family:'DM Mono',monospace}
.card .work{font-size:12.5px;color:var(--ink)}
.card .by{font-size:12px;color:var(--muted)}
.card .rt{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.card .dist{font-family:'DM Mono',monospace;font-size:12px;color:var(--orange);font-weight:500;white-space:nowrap}
.card .stat{font-family:'DM Mono',monospace;font-size:10px;padding:2px 7px;border-radius:5px;white-space:nowrap}
.card .until{font-size:11.5px;color:var(--muted);white-space:nowrap}
.stat.active{background:#1f8a7018;color:#1f8a70}
.stat.exp{background:#8a6d3b14;color:#8a6d3b}
.stat.del{background:#c2185b14;color:#c2185b}
.empty{text-align:center;padding:60px 20px;color:var(--muted)}
.loadmore{display:block;margin:16px auto 30px;padding:10px 22px;border:1px solid var(--navy);background:var(--white);
  border-radius:10px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--navy);cursor:pointer}
.loadmore:hover{background:var(--navy);color:#fff}

#mapview{position:absolute;inset:0;display:none;flex-direction:column}
#mapview.show{display:flex}
#map{flex:1;min-height:0;background:#dfe7ec}
.maphint{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:600;background:var(--navy);color:#fff;
  padding:8px 15px;border-radius:20px;font-size:12px;font-family:'DM Mono',monospace;box-shadow:0 4px 18px rgba(6,2,77,.3);
  opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
.maphint.show{opacity:1}

.leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 8px 30px rgba(6,2,77,.22);border:1px solid var(--line)}
.leaflet-popup-content{margin:0;width:262px!important}
.pop{border-radius:11px;overflow:hidden}
.pop .ph{padding:11px 14px 10px;color:#fff}
.pop .ph .k{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.06em;opacity:.9;text-transform:uppercase}
.pop .ph .loc{font-weight:700;font-size:14.5px;line-height:1.2;margin-top:3px}
.pop .pb{padding:11px 14px 13px;background:#fff;font-size:12.5px}
.pop .row{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px dashed var(--line)}
.pop .row:last-child{border-bottom:none}
.pop .lab{color:var(--muted);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.03em;text-transform:uppercase;flex:0 0 auto}
.pop .val{text-align:right;font-weight:500}
.pop .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;font-family:'DM Mono',monospace}

#loader{position:fixed;inset:0;background:var(--navy);color:#fff;z-index:9999;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px}
#loader .lg{font-family:'DM Mono',monospace;letter-spacing:.2em;font-size:12px;text-transform:uppercase;color:var(--orange2)}
#loader .bar{width:170px;height:3px;background:rgba(255,255,255,.18);border-radius:3px;overflow:hidden}
#loader .bar i{display:block;height:100%;width:30%;background:var(--orange);border-radius:3px;animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{margin-left:-30%}100%{margin-left:100%}}

@media(max-width:640px){
  header{padding:13px 16px 0}
  .controls{padding:12px 16px}
  #list{padding:8px 16px 40px}
  header h1{font-size:17px}
  .card .work{display:none}
}
</style>
</head>
<body>
<div id="loader"><div class="lg">Loading active permits</div><div class="bar"><i></i></div></div>

<header>
  <div class="hrow">
    <div>
      <p class="eyebrow">Brooklyn Community Board 6</p>
      <h1>Active Street Work</h1>
      <p class="sub">DOT permits with an open work window right now.</p>
    </div>
    <a class="archlink" href="permits-archive.html">Full archive →</a>
  </div>
  <div class="toggwrap">
    <div class="toggle">
      <button id="tabList" class="on"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>List</button>
      <button id="tabMap"><svg viewBox="0 0 24 24"><polygon points="1 6 8 3 16 6 23 3 23 18 16 21 8 18 1 21"/><line x1="8" y1="3" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="21"/></svg>Map</button>
    </div>
  </div>
  <div class="hbar"></div>
</header>

<div class="controls">
  <div class="cwrap">
    <div class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="q" type="text" placeholder="Search street, permittee, or work type…" autocomplete="off">
    </div>
    <button class="pinbtn" id="pinBtn"><svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Drop a pin</button>
    <span class="count"><b id="count">0</b> <span id="countlbl">active permits</span></span>
  </div>
  <div class="chips" id="chips"></div>
  <div class="pinbar" id="pinbar">
    <span id="pinlabel">Showing work near your pin, closest first.</span>
    <div class="radwrap">
      <span>Within</span>
      <input type="range" id="radius" min="1" max="15" value="5">
      <span class="rv" id="radval">0.25 mi</span>
      <button class="clear" id="pinClear">Clear pin</button>
    </div>
  </div>
</div>

<div class="stage">
  <div id="list"></div>
  <div id="mapview">
    <div id="map"><div class="maphint" id="maphint">Tap the map to drop a pin</div></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CATS=[
  ['opening','Street opening','#f47920'],['sidewalk','Sidewalk','#1f8a70'],
  ['building','Building operation','#5b6cff'],['paving','Paving & milling','#c2185b'],
  ['refuse','Refuse container','#8a6d3b'],['equipment','Equipment','#00897b'],
  ['manhole','Manhole','#7e57c2'],['canopy','Canopy','#d081c4'],['other','Other','#9aa0ad'],
];
const CATMAP=Object.fromEntries(CATS.map(c=>[c[0],{name:c[1],color:c[2]}]));
const ACTIVE_STATUS=new Set(['ISSUED & PRINTED','SUBMITTED',"CONFIRMATION REC'D",'EMERGENCY',"DELINQUENT EMERGENCY"]);
const PAGE=40;

let ALL=[], BOUND=[], map, layer, pinMarker, ringLayer, shown=PAGE, pinMode=false;
let state={view:'list', cats:new Set(CATS.map(c=>c[0])), q:'', pin:null, radiusMi:0.25};

const $=s=>document.querySelector(s);
const esc=s=>(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtDate=d=>{ if(!d) return '—'; const [y,m,dd]=d.split('-');
  return `${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+m-1]} ${+dd}, ${y}`; };
function titlecase(s){if(!s)return '—'; return s.replace(/\w\S*/g,t=>{
  if(t.length<=3&&/^[A-Z0-9]+$/.test(t))return t; return t.charAt(0)+t.slice(1).toLowerCase();})
  .replace(/\bLlc\b/g,'LLC').replace(/\bNyc\b/g,'NYC').replace(/\bDot\b/g,'DOT');}
function statusClass(st){ if(/VOID|EXPIRED/.test(st))return 'exp'; if(/DELINQUENT/.test(st))return 'del'; return 'active'; }
const RAD_STEPS=[0.05,0.1,0.15,0.2,0.25,0.3,0.4,0.5,0.6,0.75,1,1.25,1.5,2,3];
function haversine(a,b){ const R=3958.8,toR=x=>x*Math.PI/180;
  const dLat=toR(b[0]-a[0]),dLon=toR(b[1]-a[1]);
  const s=Math.sin(dLat/2)**2+Math.cos(toR(a[0]))*Math.cos(toR(b[0]))*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(s)); }

Promise.all([
  fetch('active-permits.json').then(r=>r.json()),
  fetch('cb6-boundary.json').then(r=>r.json())
]).then(([permits,boundary])=>{
  ALL=permits; BOUND=boundary;
  buildChips(); wire(); render();
  $('#loader').style.display='none';
}).catch(()=>{ $('#loader').innerHTML='<div class="lg">Could not load data</div>'; });

function buildChips(){
  const counts={}; ALL.forEach(p=>counts[p.s]=(counts[p.s]||0)+1);
  const wrap=$('#chips'); wrap.innerHTML='';
  CATS.forEach(([k,name,color])=>{
    if(!counts[k])return;
    const b=document.createElement('button');
    b.className='chip'+(state.cats.has(k)?'':' off');
    b.innerHTML=`<span class="dot" style="background:${color}"></span>${name} <span class="n">${counts[k]}</span>`;
    b.onclick=()=>{ state.cats.has(k)?state.cats.delete(k):state.cats.add(k);
      b.classList.toggle('off',!state.cats.has(k)); shown=PAGE; render(); };
    wrap.appendChild(b);
  });
}

function wire(){
  let t; $('#q').oninput=e=>{clearTimeout(t);t=setTimeout(()=>{state.q=e.target.value.toLowerCase().trim();shown=PAGE;render();},160);};
  $('#tabList').onclick=()=>switchView('list');
  $('#tabMap').onclick=()=>switchView('map');
  $('#pinBtn').onclick=togglePin;
  $('#pinClear').onclick=clearPin;
  $('#radius').oninput=e=>{ state.radiusMi=RAD_STEPS[+e.target.value-1];
    $('#radval').textContent=state.radiusMi+' mi'; drawRing(); shown=PAGE; render(); };
}

function switchView(v){
  state.view=v;
  $('#tabList').classList.toggle('on',v==='list');
  $('#tabMap').classList.toggle('on',v==='map');
  $('#list').classList.toggle('hide',v==='map');
  $('#mapview').classList.toggle('show',v==='map');
  if(v==='map'){ if(!map) initMap(); setTimeout(()=>map.invalidateSize(),60); }
  render();
}

function togglePin(){
  if(state.pin){ clearPin(); return; }
  if(navigator.geolocation){
    $('#pinBtn').classList.add('on');
    navigator.geolocation.getCurrentPosition(
      pos=>setPin([pos.coords.latitude,pos.coords.longitude],true),
      ()=>enterTapMode(),
      {timeout:6000,enableHighAccuracy:true});
  } else enterTapMode();
}
function enterTapMode(){
  pinMode=true; $('#pinBtn').classList.add('on');
  if(state.view!=='map') switchView('map');
  $('#maphint').classList.add('show');
}
function setPin(ll,recenter){
  state.pin=ll; pinMode=false;
  $('#pinBtn').classList.add('on');
  $('#pinBtn').innerHTML='<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Pin set';
  $('#pinbar').classList.add('show');
  $('#maphint').classList.remove('show');
  if(map){
    if(pinMarker) pinMarker.setLatLng(ll); else pinMarker=L.marker(ll,{zIndexOffset:1000}).addTo(map);
    drawRing();
    if(recenter) map.setView(ll,15);
  }
  shown=PAGE; render();
}
function clearPin(){
  state.pin=null; pinMode=false;
  $('#pinBtn').classList.remove('on');
  $('#pinBtn').innerHTML='<svg viewBox="0 0 24 24"><path d="M21 10c0 7-9 12-9 12s-9-5-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>Drop a pin';
  $('#pinbar').classList.remove('show');
  if(pinMarker){ map.removeLayer(pinMarker); pinMarker=null; }
  if(ringLayer){ map.removeLayer(ringLayer); ringLayer=null; }
  shown=PAGE; render();
}
function drawRing(){
  if(!map||!state.pin)return;
  if(ringLayer) map.removeLayer(ringLayer);
  ringLayer=L.circle(state.pin,{radius:state.radiusMi*1609.34,color:'#f47920',weight:1.5,
    fillColor:'#f47920',fillOpacity:.06,dashArray:'4 4',interactive:false}).addTo(map);
}

function initMap(){
  map=L.map('map',{zoomControl:true,minZoom:12,maxZoom:19}).setView([40.6775,-73.992],14);
  const carto=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',
    {attribution:'&copy; OpenStreetMap &copy; CARTO',subdomains:'abcd',maxZoom:19});
  const osm=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {attribution:'&copy; OpenStreetMap contributors',maxZoom:19});
  let sw=false; carto.on('tileerror',()=>{if(!sw){sw=true;map.removeLayer(carto);osm.addTo(map);}});
  carto.addTo(map);
  L.polygon(BOUND,{color:'#06024D',weight:2.5,opacity:.85,fill:false,dashArray:'3 6',interactive:false}).addTo(map);
  map.fitBounds(L.polygon(BOUND).getBounds(),{padding:[24,24]});
  layer=L.layerGroup().addTo(map);
  map.on('click',e=>{ if(pinMode) setPin([e.latlng.lat,e.latlng.lng]); });
  map.on('zoomend',()=>{ if(state.view==='map') renderMap(filtered()); });
  if(state.pin) setPin(state.pin,false);
}

function filtered(){
  const q=state.q;
  let out=ALL.filter(p=>{
    if(!state.cats.has(p.s))return false;
    if(q){ const hay=(p.loc+' '+p.by+' '+p.t+' '+p.p+' '+CATMAP[p.s].name+' '+(p.fr||'')+' '+(p.to||'')).toLowerCase();
      if(!hay.includes(q))return false; }
    return true;
  });
  out.forEach(p=>{ delete p._dist; });
  if(state.pin){
    out=out.map(p=>({p,d:haversine(state.pin,p.c)}))
           .filter(o=>o.d<=state.radiusMi)
           .sort((a,b)=>a.d-b.d)
           .map(o=>{o.p._dist=o.d;return o.p;});
  }
  return out;
}

function render(){
  const data=filtered();
  $('#count').textContent=data.length.toLocaleString();
  $('#countlbl').textContent=(data.length===1?'active permit':'active permits')+(state.pin?' nearby':'');
  if(state.view==='list') renderList(data); else renderMap(data);
}

function renderList(data){
  const el=$('#list');
  if(!data.length){ el.innerHTML='<div class="empty">No active permits match. Try clearing filters'+(state.pin?' or widening the radius.':'.')+'</div>'; return; }
  const slice=data.slice(0,shown);
  el.innerHTML=slice.map(p=>{
    const c=CATMAP[p.s], col=c.color, sc=statusClass(p.st);
    const block=(p.fr&&p.to)?`${esc(p.on)} · ${esc(p.fr)} to ${esc(p.to)}`:esc(p.on||'');
    const dist=p._dist!=null?`<div class="dist">${p._dist<0.1?Math.round(p._dist*5280)+' ft':p._dist.toFixed(2)+' mi'}</div>`:'';
    return `<div class="card" data-p="${esc(p.p)}">
      <div class="bar" style="background:${col}"></div>
      <div class="body">
        <div class="loc">${esc(p.loc||p.on||'Location on file')}</div>
        <div class="blk">${block}</div>
        <div class="meta">
          <span class="tag" style="background:${col}1a;color:${col}">${c.name}</span>
          <span class="work">${esc(p.t||'')}</span>
          <span class="by">· ${esc(titlecase(p.by))}</span>
        </div>
      </div>
      <div class="rt">
        ${dist}
        <span class="stat ${sc}">${esc(p.st)}</span>
        <span class="until">until ${fmtDate(p.we)}</span>
      </div>
    </div>`;
  }).join('') + (data.length>shown?`<button class="loadmore" id="loadmore">Show more (${(data.length-shown).toLocaleString()} more)</button>`:'');
  el.querySelectorAll('.card').forEach(card=>{
    card.onclick=()=>{ const p=data.find(x=>x.p===card.dataset.p); openOnMap(p); };
  });
  const lm=$('#loadmore'); if(lm) lm.onclick=()=>{ shown+=PAGE; renderList(data); };
}

function openOnMap(p){
  switchView('map');
  const center=p.line?p.line[Math.floor(p.line.length/2)]:p.c;
  setTimeout(()=>{ map.setView(center,17); openPop(p,{lat:center[0],lng:center[1]}); },140);
}

function renderMap(data){
  if(!layer)return;
  layer.clearLayers();
  const z=map.getZoom();
  const w=z>=17?9:z>=16?7:z>=15?6:z>=14?5:4;
  const rr=z>=17?6:z>=15?5:4;
  const groups={};
  data.forEach(p=>{ if(p.line){const k=p.line[0].join(',')+'|'+p.line[p.line.length-1].join(',');(groups[k]=groups[k]||[]).push(p);} });
  data.forEach(p=>{
    const col=CATMAP[p.s].color;
    if(p.line){
      const g=groups[p.line[0].join(',')+'|'+p.line[p.line.length-1].join(',')];
      const off=g.indexOf(p)-(g.length-1)/2;
      const line=off?offsetLine(p.line,off*(z>=16?0.4:0.7)):p.line;
      layer.addLayer(L.polyline(line,{color:'#fff',weight:w+3,opacity:.9,lineCap:'round',interactive:false}));
      const pl=L.polyline(line,{color:col,weight:w,opacity:.95,lineCap:'round'});
      pl.on('click',e=>openPop(p,e.latlng)); layer.addLayer(pl);
    } else if(p.c){
      const m=L.circleMarker(p.c,{radius:rr,color:'#fff',weight:1.2,fillColor:col,fillOpacity:.9});
      m.on('click',()=>openPop(p,{lat:p.c[0],lng:p.c[1]})); layer.addLayer(m);
    }
  });
}
function offsetLine(line,k){ if(line.length<2)return line;
  const [y0,x0]=line[0],[y1,x1]=line[line.length-1]; let dy=y1-y0,dx=x1-x0;const len=Math.hypot(dy,dx)||1;
  const ny=-dx/len,nx=dy/len,s=k*0.00006; return line.map(([y,x])=>[y+ny*s,x+nx*s]); }

function statusColor(st){ if(ACTIVE_STATUS.has(st))return '#1f8a70';
  if(st&&st.includes('DELINQUENT'))return '#c2185b'; if(st&&st.includes('VOID'))return '#9aa0ad'; return '#8a6d3b'; }

function openPop(p,latlng){
  const cat=CATMAP[p.s],c=cat.color,bg=statusColor(p.st);
  const block=(p.fr&&p.to)?`${esc(p.on)} · ${esc(p.fr)} to ${esc(p.to)}`:esc(p.loc||p.on||'—');
  const html=`<div class="pop"><div class="ph" style="background:${c}">
    <div class="k">${cat.name}${p.a?' · '+esc(p.a):''}</div>
    <div class="loc">${esc(p.loc||p.on||'Location on file')}</div></div>
    <div class="pb">
      <div class="row"><span class="lab">Block</span><span class="val">${block}</span></div>
      <div class="row"><span class="lab">Status</span><span class="val"><span class="badge" style="background:${bg}22;color:${bg}">${esc(p.st||'—')}</span></span></div>
      <div class="row"><span class="lab">Work</span><span class="val">${esc(p.t||'—')}</span></div>
      <div class="row"><span class="lab">Permittee</span><span class="val">${esc(titlecase(p.by))}</span></div>
      ${p.ws||p.we?`<div class="row"><span class="lab">Work window</span><span class="val">${fmtDate(p.ws)} → ${fmtDate(p.we)}</span></div>`:''}
      ${p.pc?`<div class="row"><span class="lab">Purpose</span><span class="val">${esc(p.pc)}</span></div>`:''}
      <div class="row"><span class="lab">Permit #</span><span class="val" style="font-family:'DM Mono',monospace;font-size:11px">${esc(p.p)}</span></div>
    </div></div>`;
  L.popup({maxWidth:280,autoPan:true}).setLatLng(latlng).setContent(html).openOn(map);
}
</script>
</body>
</html>
