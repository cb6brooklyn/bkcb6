<!DOCTYPE html>
<html lang="en">
<head><meta name="apple-itunes-app" content="app-id=6813967208">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CB6 District Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:transparent;font-family:'DM Sans',-apple-system,BlinkMacSystemFont,sans-serif;color:#0d1b4b}
.card{height:100%;display:flex;flex-direction:column;background:#fff;border:1px solid #e6e1d8;border-radius:22px;overflow:hidden}
.top{padding:14px 14px 12px}
.seg{display:flex;background:#f1efea;border-radius:999px;padding:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;font:600 15px 'DM Sans',sans-serif;color:#0d1b4b;padding:9px 6px;border-radius:999px;cursor:pointer}
.seg button.on{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.box{display:flex;align-items:center;gap:8px;border:1.5px solid #e6e1d8;border-radius:14px;padding:0 12px;height:46px;background:#fff}
.box svg{flex:none}
.box input{flex:1;border:0;outline:0;font:400 16px 'DM Sans',sans-serif;color:#0d1b4b;background:transparent;min-width:0}
.box input::placeholder{color:#9aa0a6}
.corner{display:none;gap:8px}
.corner select{flex:1;min-width:0;height:46px;border:1.5px solid #e6e1d8;border-radius:14px;padding:0 10px;font:400 15px 'DM Sans',sans-serif;color:#0d1b4b;background:#fff}
.corner button{flex:none;height:46px;border:0;border-radius:14px;padding:0 16px;background:#f47920;color:#fff;font:700 15px 'DM Sans',sans-serif;cursor:pointer}
.drop{position:relative}
.drop ul{display:none;position:absolute;left:0;right:0;top:4px;z-index:1000;list-style:none;background:#fff;border:1px solid #e6e1d8;border-radius:12px;box-shadow:0 6px 18px rgba(13,27,75,.12);overflow:hidden}
.drop li{padding:10px 12px;font-size:14px;cursor:pointer;border-bottom:1px solid #f1efea}
.drop li:last-child{border-bottom:0}
.drop li:hover{background:#f8f7f4}
#map{flex:1;min-height:260px;background:#e9eef2}
.result{display:none;padding:10px 14px;font-size:14px;border-top:1px solid #f1efea}
.result b{font-weight:700}
.foot{padding:10px 14px 12px;border-top:1px solid #f1efea}
.foot p{font-size:13px;color:#5b6675;line-height:1.4}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px}
.key span{display:flex;align-items:center;gap:6px}
.key i{width:14px;height:14px;border-radius:4px;display:inline-block}
.lbl{font:500 11px 'DM Mono',monospace;letter-spacing:.12em;color:#5b6675;margin-top:8px}
.cb6pin{width:46px;height:46px;border-radius:9px;background:#0d1b4b url(/cb6-logo-square.png) center/cover no-repeat;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.leaflet-control-attribution{font-size:9px}
</style>
</head>
<body><script src="/assets/site-bar.js?v=1" defer></script>
<div class="card">
  <div class="top">
    <div class="seg"><button id="m-addr" class="on" type="button">Address</button><button id="m-corner" type="button">Street and cross street</button></div>
    <div id="addr-wrap">
      <div class="box">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d1b4b" stroke-width="2.6" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg>
        <input id="q" type="search" placeholder="Address, e.g. 250 Baltic Street" autocomplete="off" aria-label="Address">
      </div>
      <div class="drop"><ul id="ac"></ul></div>
    </div>
    <div id="corner-wrap" class="corner">
      <select id="st" aria-label="Street"><option value="">Loading streets</option></select>
      <select id="cx" aria-label="Cross street"><option value="">Cross street</option></select>
      <button id="go" type="button">Go</button>
    </div>
  </div>
  <div id="map"></div>
  <div id="res" class="result"></div>
  <div class="foot">
    <p>Starts with zoning. Search an address, or a street and its cross street, to find a block and its zoning.</p>
    <div class="lbl">KEY</div>
    <div class="key"><span><i style="background:#f5a55a"></i>Residential zoning</span><span><i style="background:#2f6fe0"></i>Commercial zoning</span><span><i style="background:#9b5de5"></i>Manufacturing zoning</span></div>
  </div>
</div>
<script>
var map=L.map('map',{zoomControl:false,scrollWheelZoom:false,attributionControl:true}).setView([40.676,-73.995],13);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png?key=cb1_2hyw_1_9cda1572a3817275ed412c0e',{subdomains:'abcd',maxZoom:20,attribution:'&copy; OpenStreetMap &copy; CARTO'}).addTo(map);
L.control.zoom({position:'topright'}).addTo(map);
map.on('click',function(){map.scrollWheelZoom.enable();});
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function zColor(z){z=String(z||'').toUpperCase();if(/^R/.test(z))return'#f5a55a';if(/^C/.test(z))return'#2f6fe0';if(/^M/.test(z))return'#9b5de5';if(/PARK/.test(z))return'#7cc47c';return'#b8bec6';}
function zLabel(z){z=String(z||'').toUpperCase();if(/^R/.test(z))return'Residential';if(/^C/.test(z))return'Commercial';if(/^M/.test(z))return'Manufacturing';if(/PARK/.test(z))return'Park';return'Other';}
var zones=null, cb6=null;
fetch('/data/cb6_boundary.geojson').then(function(r){return r.json();}).then(function(g){
  cb6=L.geoJSON(g,{style:{color:'#f47920',weight:5,fill:false},interactive:false}).addTo(map);
  var b=cb6.getBounds(); map.fitBounds(b,{padding:[10,10]});
  L.marker(b.getCenter(),{icon:L.divIcon({className:'',html:'<div class="cb6pin"></div>',iconSize:[46,46],iconAnchor:[23,23]}),interactive:false}).addTo(map);
  var sw=b.getSouthWest(),ne=b.getNorthEast();
  var env={xmin:sw.lng,ymin:sw.lat,xmax:ne.lng,ymax:ne.lat,spatialReference:{wkid:4326}};
  return fetch('https://services5.arcgis.com/GfwWNkhOj9bNBqoJ/arcgis/rest/services/nyzd/FeatureServer/0/query?where=1%3D1&outFields=ZONEDIST&returnGeometry=true&outSR=4326&geometry='+encodeURIComponent(JSON.stringify(env))+'&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&f=pgeojson');
}).then(function(r){return r.json();}).then(function(z){
  zones=L.geoJSON(z,{style:function(f){var c=zColor(f.properties.ZONEDIST);return{color:c,weight:1,opacity:.7,fillColor:c,fillOpacity:.28};},onEachFeature:function(f,l){l.bindTooltip(esc(f.properties.ZONEDIST)+' · '+zLabel(f.properties.ZONEDIST),{sticky:true});}}).addTo(map);
  if(cb6) cb6.bringToFront();
}).catch(function(){});
function pip(lng,lat,g){var rings=g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];for(var p=0;p<rings.length;p++){var o=rings[p][0],ins=false;for(var i=0,j=o.length-1;i<o.length;j=i++){var xi=o[i][0],yi=o[i][1],xj=o[j][0],yj=o[j][1];if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))ins=!ins;}if(ins)return true;}return false;}
var pin=null;
function show(lat,lng,label){
  map.setView([lat,lng],17);
  if(pin) map.removeLayer(pin);
  pin=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:'#f47920',fillOpacity:1}).addTo(map);
  var z='';
  if(zones) zones.eachLayer(function(l){if(!z&&pip(lng,lat,l.feature.geometry))z=l.feature.properties.ZONEDIST;});
  var r=document.getElementById('res');
  r.style.display='block';
  r.innerHTML='<b>'+esc(label)+'</b>'+(z?' · Zoning: <b>'+esc(z)+'</b> ('+zLabel(z)+')':'');
}
var q=document.getElementById('q'),ac=document.getElementById('ac'),t=null;
q.addEventListener('input',function(){
  clearTimeout(t);var v=q.value.trim();if(v.length<3){ac.style.display='none';return;}
  t=setTimeout(function(){
    fetch('https://geosearch.planninglabs.nyc/v2/autocomplete?text='+encodeURIComponent(v)).then(function(r){return r.json();}).then(function(d){
      var fs=(d.features||[]).filter(function(f){return /Brooklyn/i.test(f.properties.borough||'');}).slice(0,6);
      ac.innerHTML=fs.map(function(f,i){return'<li data-i="'+i+'">'+esc(f.properties.label)+'</li>';}).join('');
      ac.style.display=fs.length?'block':'none';
      Array.prototype.forEach.call(ac.children,function(li){li.onclick=function(){var f=fs[+li.dataset.i];ac.style.display='none';q.value=f.properties.name;show(f.geometry.coordinates[1],f.geometry.coordinates[0],f.properties.name);};});
    }).catch(function(){});
  },220);
});
q.addEventListener('keydown',function(e){if(e.key==='Enter'){var li=ac.querySelector('li');if(li)li.click();}});
var STREETS=null;
function mode(c){document.getElementById('m-addr').classList.toggle('on',!c);document.getElementById('m-corner').classList.toggle('on',c);document.getElementById('addr-wrap').style.display=c?'none':'block';document.getElementById('corner-wrap').style.display=c?'flex':'none';if(c&&!STREETS)loadStreets();}
document.getElementById('m-addr').onclick=function(){mode(false);};
document.getElementById('m-corner').onclick=function(){mode(true);};
function loadStreets(){fetch('/bk/data/bk-streets.json').then(function(r){return r.json();}).then(function(j){STREETS=j;var s=document.getElementById('st');s.innerHTML='<option value="">Street</option>'+j.streets.map(function(n){return'<option>'+esc(n)+'</option>';}).join('');}).catch(function(){document.getElementById('st').innerHTML='<option value="">Street list unavailable</option>';});}
document.getElementById('st').onchange=function(){var l=((STREETS||{}).cross||{})[this.value]||[];document.getElementById('cx').innerHTML='<option value="">Cross street</option>'+l.map(function(n){return'<option>'+esc(n)+'</option>';}).join('');};
document.getElementById('go').onclick=function(){
  var a=document.getElementById('st').value,b=document.getElementById('cx').value,r=document.getElementById('res');
  if(!a||!b){r.style.display='block';r.textContent='Pick a street and a cross street.';return;}
  fetch('https://geosearch.planninglabs.nyc/v2/search?text='+encodeURIComponent(a+' and '+b+', Brooklyn, NY')+'&size=1').then(function(x){return x.json();}).then(function(d){
    var f=d.features&&d.features[0];if(!f)throw 0;show(f.geometry.coordinates[1],f.geometry.coordinates[0],a+' and '+b);
  }).catch(function(){r.style.display='block';r.textContent='That corner was not found. Try the other cross street.';});
};
</script>
</body>
</html>
