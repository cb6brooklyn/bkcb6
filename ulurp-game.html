<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Use Review Order Game, Brooklyn CB6</title>
<meta name="description" content="Put the steps of ULURP and the other NYC land use review processes in the right order. From Brooklyn Community Board 6.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bkcb6.app/ulurp-game.html">
<meta property="og:title" content="Land Use Review Order Game">
<meta property="og:description" content="Drag the steps of ULURP and the expedited review tracks into the right order.">
<meta property="og:image" content="https://bkcb6.app/ulurp-game-og.png">
<meta property="og:image:width" content="500">
<meta property="og:image:height" content="500">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Land Use Review Order Game">
<meta name="twitter:image" content="https://bkcb6.app/ulurp-game-og.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0f1b4d; --bar:#0f1b4d; --orange:#f47920; --blue:#1e2f6b; --white:#fff; --green:#2ecc71; --red:#e74c3c; --muted:rgba(255,255,255,.7); }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:'DM Sans',sans-serif; background:var(--navy); color:var(--white); min-height:100vh; -webkit-user-select:none; user-select:none; }
  .topbar { background:var(--bar); border-bottom:3px solid var(--orange); padding:10px 20px; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; }
  .topbar-title { font-size:1.1rem; font-weight:800; } .topbar-title span { color:var(--orange); }
  .topbar a { text-decoration:none; color:#fff; }
  .score-display { background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); border-radius:20px; padding:4px 14px; font-size:.85rem; font-weight:bold; color:var(--orange); }
  .main { max-width:640px; margin:0 auto; padding:16px; }
  .game-header { text-align:center; padding:12px 0 6px; }
  .game-header img { width:74px; height:74px; border-radius:50%; box-shadow:0 4px 14px rgba(0,0,0,.3); margin-bottom:8px; }
  .game-header h1 { font-size:1.45rem; font-weight:800; color:var(--orange); text-transform:uppercase; letter-spacing:.5px; line-height:1.1; }
  .game-header .by { font-size:.8rem; color:var(--orange); font-weight:600; margin-top:4px; }
  .game-header p { color:var(--muted); font-size:.9rem; margin-top:5px; font-style:italic; }
  .tracks { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:14px 0 8px; }
  .track-btn { background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25); color:#fff; border-radius:18px; padding:7px 13px; font-size:.82rem; font-weight:700; font-family:'DM Sans',sans-serif; cursor:pointer; }
  .track-btn.active { background:var(--orange); color:#1a1a1a; border-color:var(--orange); }
  .track-desc { background:var(--blue); border-radius:10px; padding:11px 14px; margin:8px 0; font-size:.86rem; line-height:1.45; }
  .track-desc b { color:var(--orange); }
  .instr { text-align:center; font-size:.8rem; color:var(--muted); margin:8px 0; font-family:'DM Mono',monospace; }
  .list { list-style:none; margin:8px 0; }
  .step { display:flex; align-items:center; gap:10px; background:#fff; color:#16213e; border-radius:10px; padding:12px 14px; margin-bottom:8px; cursor:grab; box-shadow:0 2px 6px rgba(0,0,0,.25); border-left:6px solid var(--orange); touch-action:none; }
  .step.dragging { opacity:.5; }
  .step.over { outline:2px dashed var(--orange); }
  .step .num { width:26px; height:26px; flex:none; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:.82rem; }
  .step .body { flex:1; }
  .step .title { font-weight:700; font-size:.95rem; }
  .step .meta { font-size:.74rem; color:#555; margin-top:1px; }
  .step .tagpill { font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; padding:2px 7px; border-radius:10px; }
  .tag-Advisory { background:#fdebd0; color:#b9540a; }
  .tag-Binding { background:#d5f5e3; color:#1d7a44; }
  .step .arrows { display:flex; flex-direction:column; gap:4px; flex:none; }
  .arrow { width:38px; height:30px; border:1px solid #cdd6e4; background:#f4f7fb; color:var(--navy); border-radius:7px; font-size:.8rem; cursor:pointer; line-height:1; display:flex; align-items:center; justify-content:center; }
  .arrow:active { background:var(--orange); color:#fff; }
  .arrow:disabled { opacity:.3; cursor:default; }
  .step.correct { border-left-color:var(--green); }
  .step.wrong { border-left-color:var(--red); }
  .controls { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .btn { font-family:'DM Sans',sans-serif; font-weight:800; border:none; border-radius:20px; padding:10px 20px; cursor:pointer; font-size:.9rem; }
  .btn-orange { background:var(--orange); color:#1a1a1a; }
  .btn-ghost { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.25); }
  .result { text-align:center; margin-top:12px; font-weight:700; min-height:24px; font-size:1rem; }
  .result.win { color:var(--green); }
  .result.lose { color:var(--red); }
  .footer { text-align:center; padding:18px; font-size:.78rem; color:rgba(255,255,255,.4); }
  .footer a { color:rgba(255,255,255,.6); }
</style>
</head>
<body>
<div class="topbar">
  <a href="https://bkcb6.app"><div class="topbar-title">bkcb6<span>.app</span></div></a>
  <div class="score-display" id="scoreDisplay">Solved: 0</div>
</div>

<div class="main">
  <div class="game-header">
    <img src="seal-nycflag.png" alt="New York City seal">
    <h1>Land Use Review<br>Order Game</h1>
    <div class="by">Designed by Mike Racioppo</div>
    <p>Tap the arrows to order the steps.</p>
  </div>

  <div class="tracks" id="tracks"></div>
  <div class="track-desc" id="trackDesc"></div>
  <div class="instr">Use the &#9650;&#9660; arrows to put the steps in order, then tap Check.</div>

  <ul class="list" id="list"></ul>

  <div class="controls">
    <button class="btn btn-orange" id="checkBtn">Check order</button>
    <button class="btn btn-ghost" id="shuffleBtn">Shuffle</button>
    <button class="btn btn-ghost" id="showBtn">Show answer</button>
  </div>
  <div class="result" id="result"></div>
</div>

<div class="footer">
  A project of <a href="https://bkcb6.app">Brooklyn Community Board 6</a> &middot;
  Learn more in the <a href="https://bkcb6.app/govhub.html">land use guide</a>
</div>

<script>
var TRACKS = {"ulurp": {"name": "ULURP", "full": "Uniform Land Use Review Procedure", "blurb": "The standard 7-month public review for major land use actions: rezonings, special permits, city map changes, dispositions of city land, and more.", "steps": [{"t": "DCP Certification", "d": "Starts the clock", "tag": ""}, {"t": "Community Board Review", "d": "60 days", "tag": "Advisory"}, {"t": "Borough President Review", "d": "30 days", "tag": "Advisory"}, {"t": "City Planning Commission", "d": "60 days", "tag": "Binding"}, {"t": "City Council Review", "d": "50 days", "tag": "Binding"}, {"t": "Mayoral Review / AHAB", "d": "5 to 20 days", "tag": ""}]}, "elurp-cc": {"name": "ELURP-CC", "full": "Expedited Land Use Review, Council-approved (§197-e(k))", "blurb": "For acquisitions, leases, and sales of publicly owned land for affordable housing. Skips DCP and CPC; ends with the City Council.", "steps": [{"t": "DCP Certification", "d": "Starts the clock", "tag": ""}, {"t": "Community Board + Borough President", "d": "60 days, combined", "tag": "Advisory"}, {"t": "City Council Review", "d": "30 days", "tag": "Binding"}]}, "elurp-cpc": {"name": "ELURP-CPC", "full": "Expedited Land Use Review, CPC-approved (§197-e(b)(2))", "blurb": "For modest density increases, like up to 30% more floor area in a medium-density district. Ends with the City Planning Commission, no Council vote.", "steps": [{"t": "DCP Certification", "d": "Starts the clock", "tag": ""}, {"t": "Community Board + Borough President", "d": "60 days, combined", "tag": "Advisory"}, {"t": "City Planning Commission", "d": "30 days", "tag": "Binding"}]}, "bsa": {"name": "BSA Fast-Track", "full": "BSA Fast-Track for Affordable Housing (§666-a)", "blurb": "HPD-supported affordable housing on residentially zoned land can seek a waiver of bulk, use, or parking from the Board of Standards and Appeals, bypassing ULURP.", "steps": [{"t": "HPD Intake & Design Standards", "d": "Prerequisite", "tag": ""}, {"t": "Community Board + Borough President", "d": "60 days", "tag": "Advisory"}, {"t": "BSA Hearing & Decision", "d": "Final", "tag": "Binding"}]}, "ahft": {"name": "AHFT", "full": "Affordable Housing Fast Track (§197-f), from Jan 2027", "blurb": "For affordable housing in the 12 community districts that built the least affordable housing. CPC names the districts by Oct 2026; the track starts Jan 1, 2027.", "steps": [{"t": "DCP Certification", "d": "Starts the clock", "tag": ""}, {"t": "Community Board + Borough President", "d": "60 days, combined", "tag": "Advisory"}, {"t": "City Planning Commission", "d": "30 days (45 if more review)", "tag": "Binding"}]}};
var order = ['ulurp','elurp-cc','elurp-cpc','bsa','ahft'];
var currentKey = 'ulurp';
var items = [];      // current displayed order: array of original-index
var solved = 0;

function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;} return a; }

function buildTracks(){
  var box=document.getElementById('tracks'); box.innerHTML='';
  order.forEach(function(k){
    var b=document.createElement('button');
    b.className='track-btn'+(k===currentKey?' active':'');
    b.textContent=TRACKS[k].name;
    b.onclick=function(){ currentKey=k; loadTrack(); };
    box.appendChild(b);
  });
}

function loadTrack(){
  buildTracks();
  var tr=TRACKS[currentKey];
  document.getElementById('trackDesc').innerHTML='<b>'+tr.full+'</b><br>'+tr.blurb;
  document.getElementById('result').textContent=''; document.getElementById('result').className='result';
  // shuffle until not already in order (for >1 step)
  var idx=tr.steps.map(function(_,i){return i;});
  do { items=shuffle(idx); } while(items.length>1 && items.join()===idx.join());
  render();
}

function render(){
  var list=document.getElementById('list'); list.innerHTML='';
  var tr=TRACKS[currentKey];
  var n=items.length;
  items.forEach(function(origIdx,pos){
    var s=tr.steps[origIdx];
    var li=document.createElement('li');
    li.className='step'; li.draggable=true; li.dataset.pos=pos;
    var tagHtml = s.tag ? '<span class="tagpill tag-'+s.tag+'">'+s.tag+'</span>' : '';
    li.innerHTML='<span class="num">'+(pos+1)+'</span>'+
      '<div class="body"><div class="title">'+s.t+'</div>'+
      '<div class="meta">'+s.d+'</div></div>'+
      tagHtml+
      '<span class="arrows">'+
        '<button class="arrow" data-dir="up" aria-label="Move up"'+(pos===0?' disabled':'')+'>&#9650;</button>'+
        '<button class="arrow" data-dir="down" aria-label="Move down"'+(pos===n-1?' disabled':'')+'>&#9660;</button>'+
      '</span>';
    // arrow handlers
    li.querySelector('[data-dir=up]').addEventListener('click',function(e){ e.stopPropagation(); if(pos>0) moveItem(pos,pos-1); });
    li.querySelector('[data-dir=down]').addEventListener('click',function(e){ e.stopPropagation(); if(pos<n-1) moveItem(pos,pos+1); });
    addDnD(li);
    list.appendChild(li);
  });
}

// --- Drag and drop (mouse + touch) ---
var dragPos=null;
function addDnD(li){
  li.addEventListener('dragstart',function(e){ dragPos=+li.dataset.pos; li.classList.add('dragging'); });
  li.addEventListener('dragend',function(){ li.classList.remove('dragging'); clearOver(); });
  li.addEventListener('dragover',function(e){ e.preventDefault(); li.classList.add('over'); });
  li.addEventListener('dragleave',function(){ li.classList.remove('over'); });
  li.addEventListener('drop',function(e){ e.preventDefault(); var to=+li.dataset.pos; moveItem(dragPos,to); });
  // touch
  li.addEventListener('touchstart',function(e){ dragPos=+li.dataset.pos; li.classList.add('dragging'); },{passive:true});
  li.addEventListener('touchmove',function(e){
    e.preventDefault();
    var t=e.touches[0]; var el=document.elementFromPoint(t.clientX,t.clientY);
    clearOver(); var step=el&&el.closest?el.closest('.step'):null; if(step) step.classList.add('over');
  },{passive:false});
  li.addEventListener('touchend',function(e){
    var t=e.changedTouches[0]; var el=document.elementFromPoint(t.clientX,t.clientY);
    var step=el&&el.closest?el.closest('.step'):null;
    li.classList.remove('dragging'); clearOver();
    if(step){ moveItem(dragPos, +step.dataset.pos); }
  });
}
function clearOver(){ Array.prototype.forEach.call(document.querySelectorAll('.step.over'),function(s){s.classList.remove('over');}); }
function moveItem(from,to){
  if(from==null||to==null||from===to) return;
  var m=items.splice(from,1)[0]; items.splice(to,0,m); render();
}

function check(){
  var tr=TRACKS[currentKey];
  var correctCount=0;
  var lis=document.querySelectorAll('.step');
  items.forEach(function(origIdx,pos){
    var ok = origIdx===pos;
    if(ok) correctCount++;
    lis[pos].classList.add(ok?'correct':'wrong');
  });
  var res=document.getElementById('result');
  if(correctCount===tr.steps.length){
    res.textContent='Correct! That\'s the '+tr.name+' order.'; res.className='result win';
    solved++;
    document.getElementById('scoreDisplay').textContent='Solved: '+solved;
  } else {
    res.textContent=correctCount+' of '+tr.steps.length+' in the right spot. Keep going.'; res.className='result lose';
  }
}
function showAnswer(){
  var tr=TRACKS[currentKey];
  items=tr.steps.map(function(_,i){return i;});
  render();
  var lis=document.querySelectorAll('.step');
  Array.prototype.forEach.call(lis,function(li){li.classList.add('correct');});
  document.getElementById('result').textContent='Here is the correct '+tr.name+' order.';
  document.getElementById('result').className='result';
}

document.getElementById('checkBtn').addEventListener('click',check);
document.getElementById('shuffleBtn').addEventListener('click',loadTrack);
document.getElementById('showBtn').addEventListener('click',showAnswer);

buildTracks(); loadTrack();
</script>
</body>
</html>
