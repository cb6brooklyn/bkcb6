<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Staten Island Median Rent by Community Board — bkcb6.app</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0d1b4b;color:#fff;height:100vh;display:flex;flex-direction:column}
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;600;700&display=swap');
.top-bar{background:#0d1b4b;border-bottom:3px solid #f47920;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px;flex-wrap:wrap}
.top-bar h1{font-size:.95rem;font-weight:700;color:#fff}
.top-bar h1 span{color:#f47920}
.controls{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rent-btn{padding:5px 12px;font-size:.75rem;font-family:'DM Sans',sans-serif;font-weight:600;border:1px solid rgba(255,255,255,.3);border-radius:20px;background:transparent;color:rgba(255,255,255,.7);cursor:pointer;transition:all .15s}
.rent-btn:hover{border-color:#fff;color:#fff}
.rent-btn.active{background:#f47920;color:#fff;border-color:#f47920}
.legend{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:6px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0}
.legend-item{display:inline-flex;align-items:center;gap:4px;font-size:.72rem;color:rgba(255,255,255,.8)}
.legend-swatch{width:11px;height:11px;border-radius:2px;display:inline-block;flex-shrink:0}
#map{flex:1}
.back-link{font-size:.72rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.5);text-decoration:none;white-space:nowrap}
.back-link:hover{color:#f47920}
.source{font-size:.65rem;font-family:'DM Mono',monospace;color:rgba(255,255,255,.35);padding:4px 16px;flex-shrink:0;background:#0d1b4b}
</style>
</head>
<body>
<div class="top-bar">
  <h1>Staten Island Median Rent by <span>Community Board</span></h1>
  <div class="controls">
    <button class="rent-btn" onclick="toggle('studio',this)">Studio</button>
    <button class="rent-btn active" onclick="toggle('1br',this)">1BR</button>
    <button class="rent-btn" onclick="toggle('2br',this)">2BR</button>
    <button class="rent-btn" onclick="toggle('3br',this)">3BR+</button>
    <button class="rent-btn" onclick="toggle('all',this)">All Units</button>
  </div>
  <a class="back-link" href="statenisland.html">← Back</a>
</div>
<div class="legend">
  <span style="font-size:.6rem;font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);margin-right:4px">Rent Tier (Staten Island)</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#67000D"></span>Most Expensive</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#A50F15"></span>Expensive</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#EF3B2C"></span>Mid Range</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#FC9272"></span>Less Expensive</span>
  <span class="legend-item"><span class="legend-swatch" style="background:#FEE0D2"></span>Least Expensive</span>
</div>
<div id="map"></div>
<div class="source">Source: StreetEasy median asking rent, as of May 1, 2026 &nbsp;|&nbsp; bkcb6.app</div>

<script>
var map = L.map('map', {scrollWheelZoom: true}).setView([40.579, -74.151], 11.5);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_nolabels/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; CARTO',
  subdomains: 'abcd', maxZoom: 19
}).addTo(map);

var mode = '1br';
var layer = null;
var data = null;
var BORO_PREFIX = 'SI';

fetch('data/citywide-rents.geojson?v=b05dd51').then(r=>r.json()).then(function(d){
  d.features = d.features.filter(function(f){ return f.properties.cb_code.indexOf(BORO_PREFIX) === 0; });
  data = d;
  drawLayer();
});

function getFill(props) {
  return props['boro_fill_' + mode] || '#ccc';
}

function getTooltip(props) {
  var rentKey = 'rent_' + mode;
  var rent = props[rentKey] ? '$' + props[rentKey].toLocaleString() + '/mo' : 'N/A';
  var bandLabel = props['boro_band_' + mode] || '';
  var boroRank = props['boro_rank_' + mode];
  var cityRank = props['city_rank_' + mode];
  var rankStr = '';
  if (boroRank) rankStr += '#' + boroRank + ' in Staten Island';
  if (cityRank) rankStr += (rankStr ? '  |  ' : '') + '#' + cityRank + ' in NYC';
  return '<div style="font-family:DM Sans,sans-serif;min-width:170px">' +
    '<div style="font-weight:700;font-size:.92rem;color:#0d1b4b;border-bottom:1px solid #eee;padding-bottom:4px;margin-bottom:6px">' +
    'Staten Island ' + props.cb_code.replace(BORO_PREFIX, '') + '</div>' +
    '<div style="font-size:1.05rem;font-weight:700;color:#0d1b4b">' + rent + '</div>' +
    '<div style="font-size:.7rem;color:#888;margin-top:4px">' + bandLabel + '</div>' +
    '<div style="font-size:.7rem;color:#666;margin-top:2px">' + rankStr + '</div>' +
    '</div>';
}

function drawLayer() {
  if (layer) map.removeLayer(layer);
  layer = L.geoJSON(data, {
    style: function(feat) {
      return {fillColor: getFill(feat.properties), fillOpacity: 0.8, color: '#fff', weight: 1};
    },
    onEachFeature: function(feat, lyr) {
      lyr.bindTooltip(getTooltip(feat.properties), {sticky:true, opacity:1});
      lyr.on('mouseover', function(){ lyr.setStyle({fillOpacity:.95,weight:2,color:'#333'}); });
      lyr.on('mouseout', function(){ layer.resetStyle(lyr); });
    }
  }).addTo(map);
}

function toggle(m, btn) {
  mode = m;
  document.querySelectorAll('.rent-btn').forEach(function(b){ b.classList.remove('active'); });
  btn.classList.add('active');
  if (data) drawLayer();
}
</script>
</body>
</html>
