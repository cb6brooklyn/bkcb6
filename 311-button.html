<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CB6 311 Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920}
html,body{margin:0;padding:0;background:transparent;font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{display:flex;justify-content:center}
a.btn{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;text-decoration:none;background:var(--navy);color:#fff;border-radius:16px;padding:18px 14px;border:2px solid var(--orange);box-sizing:border-box;width:200px;height:200px}
a.btn:hover{background:#142563}
.logo{width:72px;height:72px;border-radius:14px;display:block;background:#fff}
.title{font-weight:800;font-size:1.05rem;line-height:1.15;letter-spacing:.2px}
.sub{font-weight:600;font-size:.74rem;line-height:1.25;color:var(--orange)}
</style>
</head>
<body>
<a class="btn" href="https://bkcb6.app/311" target="_blank" rel="noopener">
  <img class="logo" src="icon-311.png" alt="">
  <span class="title">CB6 311 Data</span>
  <span class="sub">Open the dashboard &rsaquo;</span>
</a>
<script>
(function(){
  function postHeight(){if(window.parent&&window.parent!==window){window.parent.postMessage({type:"bkcb6-explorer-height",height:document.body.scrollHeight},"*");}}
  window.addEventListener("load",postHeight);window.addEventListener("resize",postHeight);
})();
</script>
</body>
</html>
