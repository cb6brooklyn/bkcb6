<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CB6 311 Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0d1b4b;--orange:#f47920}
html,body{margin:0;padding:0;background:transparent;font-family:"DM Sans",system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a.btn{display:flex;align-items:center;gap:12px;text-decoration:none;background:var(--navy);color:#fff;border-radius:12px;padding:10px 14px;border:1px solid rgba(255,255,255,.08);box-sizing:border-box;width:100%;min-height:60px}
a.btn:hover{border-color:var(--orange)}
.logo{width:36px;height:36px;border-radius:8px;flex:0 0 auto;display:block;background:#fff}
.text{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.title{font-weight:800;font-size:1.02rem;line-height:1.15;letter-spacing:.2px}
.sub{font-weight:500;font-size:.78rem;line-height:1.3;color:rgba(255,255,255,.75);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arrow{color:var(--orange);font-size:1.4rem;font-weight:800;line-height:1;flex:0 0 auto}
</style>
</head>
<body>
<a class="btn" href="https://bkcb6.app/311" target="_blank" rel="noopener">
  <img class="logo" src="icon-311.png" alt="">
  <span class="text">
    <span class="title">CB6 311 Data</span>
    <span class="sub">Service requests, top complaint types, and trends for Park Slope, Carroll Gardens, Cobble Hill, Red Hook, Gowanus, and the Columbia Street Waterfront District</span>
  </span>
  <span class="arrow" aria-hidden="true">&rsaquo;</span>
</a>
<script>
(function(){
  function postHeight(){if(window.parent&&window.parent!==window){window.parent.postMessage({type:"bkcb6-explorer-height",height:document.body.scrollHeight},"*");}}
  window.addEventListener("load",postHeight);window.addEventListener("resize",postHeight);
})();
</script>
</body>
</html>
